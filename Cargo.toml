[workspace]
members = [
  "programs/gpu_escrow",
  "apps/host-desktop/src-tauri",
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
solana-secp256k1-recover = { path = "vendor/security/solana-secp256k1-recover-2.2.1" }
# Experimental official GTK3 migration snapshots; see prototypes/gtk-migration/source-pins.json.
# Every revision is immutable and every package retains its actual upstream version.
tauri = { git = "https://github.com/tauri-apps/tauri.git", rev = "899ca2105ffd06293013b6d2bff4416987d99010" }
tauri-build = { git = "https://github.com/tauri-apps/tauri.git", rev = "899ca2105ffd06293013b6d2bff4416987d99010" }
