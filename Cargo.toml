[workspace]
members = [
  "programs/gpu_escrow",
  "apps/host-desktop/src-tauri",
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
glib = { path = "vendor/security/glib-0.18.5" }
rand = { path = "vendor/security/rand-0.7.3" }
