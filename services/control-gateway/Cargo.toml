[package]
name = "gpubnb-control-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "gpubnb-control-gateway"
path = "src/main.rs"

[[bin]]
name = "p2p-qualify-ticket"
path = "src/bin/p2p-qualify-ticket.rs"

[[bin]]
name = "p2p-qualify-keygen"
path = "src/bin/p2p-qualify-keygen.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
bs58 = "0.5"
ed25519-dalek = "2.2"
hex = "0.4"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9"
redis = { version = "0.32", features = ["tokio-comp"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"
