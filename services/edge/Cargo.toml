[package]
name = "gpubnb-edge-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "gpubnb-edge"
path = "src/bin/gpubnb-edge.rs"

[dependencies]
anyhow = "1.0"
ed25519-dalek = "2.2"
hex = "0.4"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"
