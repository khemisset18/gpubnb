[package]
name = "gpubnb-host-desktop"
version = "0.1.0"
description = "Secure GPUbnb host desktop application"
authors = ["GPUbnb"]
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
desktop-runtime = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener"]

[lib]
name = "gpubnb_host_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gpubnb-host-desktop"
path = "src/main.rs"
required-features = ["desktop-runtime"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[dev-dependencies]
