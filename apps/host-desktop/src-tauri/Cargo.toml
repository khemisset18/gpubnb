[package]
name = "gpubnb-host-desktop"
version = "0.1.0"
description = "Secure GPUbnb host desktop application"
authors = ["GPUbnb"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gpubnb_host_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.6.3", features = [] }

[dev-dependencies]
serde_json = "1"
