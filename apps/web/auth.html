<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion GPUbnb</title><link rel="stylesheet" href="auth.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="/">GPUbnb</a><p class="eyebrow">COMPTE PRIVÉ · PSEUDO PUBLIC</p><h1>Connexion</h1><p class="lead">Ton nom, ton prénom et ton e-mail ne sont jamais affichés publiquement.</p><button id="google" class="button secondary">Continuer avec Google</button><button id="phantom" class="button phantom">Continuer avec Phantom</button><div class="separator"><span>ou</span></div><form id="email-form"><label>E-mail<input id="email" type="email" autocomplete="email" required maxlength="254"></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></label><label>Pseudo public<input id="pseudonym" type="text" autocomplete="nickname" minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]+" placeholder="ex. gpu_master"></label><button class="button primary" type="submit">Créer un compte / se connecter</button></form><p id="status" role="status" aria-live="polite"></p><p class="legal">En continuant, tu acceptes les conditions et la politique de confidentialité.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script><script src="auth.js"></script></body></html>
