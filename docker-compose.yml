services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: gpubnb, POSTGRES_PASSWORD: gpubnb, POSTGRES_DB: gpubnb}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U gpubnb"], interval: 5s, timeout: 3s, retries: 20}
    ports: ["127.0.0.1:5432:5432"]
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes","--requirepass","change-me"]
    volumes: [redis_data:/data]
    ports: ["127.0.0.1:6379:6379"]
volumes: {postgres_data: {}, redis_data: {}}
