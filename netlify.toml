[build]
  publish = "apps/web"
  functions = "netlify/functions"
  command = "node scripts/generate-web-build-info.mjs && test -f apps/web/index.html && test -f apps/web/app.js && test -f apps/web/styles.css && test -f apps/web/config.js && test -f apps/web/_redirects && test -f apps/web/_headers && test -f apps/web/portal.css && test -f apps/web/portal.js && test -f apps/web/host-downloads.js && test -f apps/web/dashboard.html && test -f apps/web/host-install.html && test -f netlify/functions/host-download.mjs"

[build.environment]
  NODE_VERSION = "22"

# /api proxy routing and the CSP are generated at build time into apps/web/_redirects
# and apps/web/_headers from validated GPUBNB_API_ORIGIN / GPUBNB_GATEWAY_ORIGIN.
# This keeps provider names out of the repository and makes missing production
# origins fail the build instead of silently falling back to a stale host.

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/machines"
  to = "/machines.html"
  status = 200

[[redirects]]
  from = "/host-install"
  to = "/host-install.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
