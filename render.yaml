services:
  - type: web
    name: gpubnb
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: gpubnb_session
      - key: SESSION_TTL_SECONDS
        value: 86400
      - key: SESSION_IDLE_TTL_SECONDS
        value: 3600
      - key: TRUST_PROXY
        value: "true"
      - key: PUBLIC_APP_DOMAIN
        sync: false
      - key: PLATFORM_WALLET
        value: B5WQmXWHL8R86wf3LHLRE4aQAuRdRSz1EXKcwNQDqj2e
      - key: SOLANA_CLUSTER
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: ESCROW_PROGRAM_ID
        value: NOT_DEPLOYED_YET
      - key: ALLOW_MAINNET
        value: "false"
      - key: HEARTBEAT_MAX_AGE_SECONDS
        value: 25
      - key: HEARTBEAT_OFFLINE_SECONDS
        value: 40
      - key: COMMISSION_BPS
        value: 500
