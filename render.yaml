services:
  - type: web
    name: gpubnb-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: DATABASE_URL
        fromDatabase:
          name: gpubnb-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gpubnb-redis
          property: connectionString
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: SOLANA_CLUSTER
        value: devnet
      - key: ALLOW_MAINNET
        value: "false"
  - type: redis
    name: gpubnb-redis
    ipAllowList: []
    plan: starter

databases:
  - name: gpubnb-db
    plan: basic-256mb
