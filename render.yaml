services:
  - type: web
    name: gpubnb
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PUBLIC_APP_DOMAIN
        value: gpubnb.netlify.app
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: SUPABASE_URL
        value: https://ctifqdjpxdfdgdgbpzod.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0aWZxZGpweGRmZGdkZ2Jwem9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1ODkxOTEsImV4cCI6MjEwMDE2NTE5MX0.ghl21WQ8tfcmEOqRfW1QF1Lt_revqkHHgkgAJqqaMhU # gitleaks:allow
      - key: SESSION_COOKIE_NAME
        value: gpubnb_session
      - key: SESSION_TTL_SECONDS
        value: 86400
      - key: PLATFORM_WALLET
        value: B5WQmXWHL8R86wf3LHLRE4aQAuRdRSz1EXKcwNQDqj2e
      - key: SOLANA_CLUSTER
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: ESCROW_PROGRAM_ID
        value: NOT_DEPLOYED_YET
      - key: ALLOW_MAINNET
        value: "false"
      - key: HEARTBEAT_MAX_AGE_SECONDS
        value: 25
      - key: HEARTBEAT_OFFLINE_SECONDS
        value: 40
      - key: COMMISSION_BPS
        value: 500
  - type: worker
    name: gpubnb-delivery-worker
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/delivery-worker.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_DOMAIN
        value: gpubnb.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: PLATFORM_WALLET
        value: B5WQmXWHL8R86wf3LHLRE4aQAuRdRSz1EXKcwNQDqj2e
      - key: SOLANA_CLUSTER
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: ESCROW_PROGRAM_ID
        value: NOT_DEPLOYED_YET
      - key: ALLOW_MAINNET
        value: "false"
      - key: HEARTBEAT_MAX_AGE_SECONDS
        value: 25
      - key: HEARTBEAT_OFFLINE_SECONDS
        value: 40
      - key: COMMISSION_BPS
        value: 500
  - type: worker
    name: gpubnb-sweep-scheduler
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/sweep-scheduler.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_DOMAIN
        value: gpubnb.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: PLATFORM_WALLET
        value: B5WQmXWHL8R86wf3LHLRE4aQAuRdRSz1EXKcwNQDqj2e
      - key: SOLANA_CLUSTER
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: ESCROW_PROGRAM_ID
        value: NOT_DEPLOYED_YET
      - key: ALLOW_MAINNET
        value: "false"
      - key: HEARTBEAT_OFFLINE_SECONDS
        value: 40
      - key: JOB_STALE_AFTER_SECONDS
        value: 900
      - key: SWEEP_INTERVAL_MS
        value: 30000
      - key: SWEEP_LOCK_TTL_MS
        value: 60000
      - key: COMMISSION_BPS
        value: 500
