name: Asset Exchange PostgreSQL Concurrency

on:
  push:
    branches:
      - asset-exchange/secure-foundation-v1
    paths:
      - 'asset-exchange/db/**'
      - '.github/workflows/asset-exchange-postgres.yml'
  pull_request:
    paths:
      - 'asset-exchange/db/**'
      - '.github/workflows/asset-exchange-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-exchange-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  concurrency:
    name: Atomic offer race tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PG_IMAGE: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: asset_exchange
      PGDATABASE: asset_exchange
      PGPASSWORD: asset_exchange_ci

    services:
      postgres:
        image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_USER: asset_exchange
          POSTGRES_PASSWORD: asset_exchange_ci
          POSTGRES_DB: asset_exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asset_exchange -d asset_exchange"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify pinned PostgreSQL server
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "${PG_IMAGE}" postgres --version

      - name: Apply Asset Exchange migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in asset-exchange/db/migrations/*.sql; do
            echo "Applying ${migration}"
            docker run --rm --network host               -e PGPASSWORD="${PGPASSWORD}"               -v "${GITHUB_WORKSPACE}:/workspace:ro"               "${PG_IMAGE}"               psql -v ON_ERROR_STOP=1                 -h "${PGHOST}" -p "${PGPORT}"                 -U "${PGUSER}" -d "${PGDATABASE}"                 -f "/workspace/${migration}"
          done

      - name: Run concurrency and idempotency tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x asset-exchange/db/test/concurrency.sh
          asset-exchange/db/test/concurrency.sh
