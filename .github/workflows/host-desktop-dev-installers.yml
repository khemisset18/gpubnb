name: host-desktop-dev-installers

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - apps/host-desktop/**
      - .github/workflows/host-desktop-dev-installers.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-desktop-dev-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
          - os: ubuntu-24.04
            label: Linux x64
          - os: macos-14
            label: macOS arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/host-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Materialize Windows bundle icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = 'apps/host-desktop/src-tauri/icons/icon.ico.base64'
          $target = 'apps/host-desktop/src-tauri/icons/icon.ico'
          if (!(Test-Path $source)) { throw 'Missing staged Windows icon source.' }
          [IO.File]::WriteAllBytes($target, [Convert]::FromBase64String((Get-Content $source -Raw).Trim()))

      - name: Require committed lockfiles
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          test -s apps/host-desktop/package-lock.json

      - name: Install locked dependencies
        working-directory: apps/host-desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit JavaScript production dependencies
        working-directory: apps/host-desktop
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check and build frontend
        working-directory: apps/host-desktop
        run: |
          npm run check
          npm run build

      - name: Enforce Rust formatting
        run: cargo fmt -p gpubnb-host-desktop -- --check

      - name: Test native host core
        run: cargo test -p gpubnb-host-desktop --all-targets --locked

      - name: Lint native host core
        run: cargo clippy -p gpubnb-host-desktop --all-targets --locked -- -D warnings

      - name: Build development installer
        working-directory: apps/host-desktop
        run: npm run tauri -- build
        env:
          GPUBNB_RELEASE_CHANNEL: development

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/host-desktop/dist-evidence
          find apps/host-desktop/src-tauri/target/release/bundle -type f -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > apps/host-desktop/dist-evidence/SHA256SUMS.txt
          test -s apps/host-desktop/dist-evidence/SHA256SUMS.txt
          printf '%s\n' \
            'UNSIGNED DEVELOPMENT BUILD' \
            'Do not distribute as a production release.' \
            "Commit: $GITHUB_SHA" \
            "Runner: $RUNNER_OS/$RUNNER_ARCH" \
            > apps/host-desktop/dist-evidence/BUILD-NOTICE.txt

      - name: Upload installer and evidence
        uses: actions/upload-artifact@v6
        with:
          name: gpubnb-host-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            apps/host-desktop/src-tauri/target/release/bundle/**
            apps/host-desktop/dist-evidence/**
          if-no-files-found: error
          retention-days: 14

  release-policy:
    name: Public release policy
    runs-on: ubuntu-24.04
    steps:
      - name: Block unsigned public release
        run: |
          echo 'This workflow only creates short-lived development artifacts.'
          echo 'Production installers require platform signing, notarization, provenance and an approved release workflow.'
