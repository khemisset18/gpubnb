name: host-desktop

on:
  pull_request:
    paths:
      - 'apps/host-desktop/**'
      - '.github/workflows/host-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'apps/host-desktop/**'
      - '.github/workflows/host-desktop.yml'

permissions:
  contents: read

concurrency:
  group: host-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/host-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require committed dependency lock
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo 'package-lock.json is required for reproducible builds.' >&2
            exit 1
          fi
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Build web interface
        run: npm run build

  rust:
    name: rust tests and lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/host-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@1.77.2
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/host-desktop/src-tauri
      - name: Require committed Cargo lock
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then
            echo 'Cargo.lock is required for reproducible application builds.' >&2
            exit 1
          fi
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  security-gate:
    name: production security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require production readiness evidence
        shell: bash
        run: |
          test -f docs/HOST_DESKTOP_PRODUCTION_READINESS.md
          test -f docs/HOST_DESKTOP_THREAT_MODEL.md
          test -f docs/HOST_DESKTOP_RESOURCE_ORCHESTRATION.md
          grep -q 'Status: \*\*NOT READY TO MERGE\*\*' docs/HOST_DESKTOP_PRODUCTION_READINESS.md
