name: host-desktop

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/host-desktop/**'
      - 'docs/HOST_DESKTOP_*.md'
      - '.github/workflows/host-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/host-desktop/**'
      - 'docs/HOST_DESKTOP_*.md'
      - '.github/workflows/host-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/host-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/host-desktop/package-lock.json
      - name: Require committed dependency lock
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo 'package-lock.json is required for reproducible builds.' >&2
            exit 1
          fi
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run check
      - name: Build web interface
        run: npm run build

  rust:
    name: rust tests and lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize Windows bundle icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = 'apps/host-desktop/src-tauri/icons/icon.ico.base64'
          $target = 'apps/host-desktop/src-tauri/icons/icon.ico'
          if (!(Test-Path $source)) { throw 'Missing staged Windows icon source.' }
          [IO.File]::WriteAllBytes($target, [Convert]::FromBase64String((Get-Content $source -Raw).Trim()))
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Require committed Cargo lock
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then
            echo 'Cargo.lock is required at the workspace root for reproducible builds.' >&2
            exit 1
          fi
      - name: Verify host package formatting
        shell: bash
        run: |
          set -o pipefail
          cargo fmt -p gpubnb-host-desktop -- --check 2>&1 | tee cargo-fmt-${{ runner.os }}.log
      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-fmt-${{ runner.os }}
          path: cargo-fmt-${{ runner.os }}.log
          if-no-files-found: error
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p gpubnb-host-desktop --all-targets 2>&1 | tee cargo-test-${{ runner.os }}.log
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-${{ runner.os }}
          path: cargo-test-${{ runner.os }}.log
          if-no-files-found: warn
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p gpubnb-host-desktop --all-targets -- -D warnings 2>&1 | tee cargo-clippy-${{ runner.os }}.log
      - name: Upload Clippy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-clippy-${{ runner.os }}
          path: cargo-clippy-${{ runner.os }}.log
          if-no-files-found: warn

  security-gate:
    name: production security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require production readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/HOST_DESKTOP_PRODUCTION_READINESS.md
          test -f docs/HOST_DESKTOP_THREAT_MODEL.md
          test -f docs/HOST_DESKTOP_RESOURCE_ORCHESTRATION.md
          grep -Fq 'Status: **NOT READY TO MERGE**' docs/HOST_DESKTOP_PRODUCTION_READINESS.md

      - name: Reject simulated production behavior
        shell: bash
        run: |
          set -euo pipefail
          forbidden='automatic_setup_pending|start_simulated|gpubnb-fake-miner|simulated-ravencoin'
          if grep -RInE "$forbidden" agent apps/host-desktop \
            --exclude-dir=node_modules --exclude-dir=target; then
            echo 'A simulated production behavior was found.' >&2
            exit 1
          fi

      - name: Require fail-closed cleanup verification
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'diagnostic_cleanup_unverified' agent/gpubnb_agent/runner.py
          grep -Fq 'protection_probe_cleanup_unverified' agent/gpubnb_agent/runner.py
          grep -Fq 'test_diagnostic_fails_when_cleanup_cannot_be_verified' agent/tests/test_agent.py
          grep -Fq 'test_protection_profile_rejects_host_bind_mount' agent/tests/test_agent.py

  miner-provenance:
    name: pinned miner provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official lolMiner archives
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output lolMiner_v1.98a_Win64.zip https://github.com/Lolliedieb/lolMiner-releases/releases/download/1.98a/lolMiner_v1.98a_Win64.zip
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output lolMiner_v1.98a_Lin64.tar.gz https://github.com/Lolliedieb/lolMiner-releases/releases/download/1.98a/lolMiner_v1.98a_Lin64.tar.gz
      - name: Verify archives and extract only pinned basenames
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' f2bbda2d2255155d50935967b8c55105b9aeefbd27cda3e8d01beaf535a16762 lolMiner_v1.98a_Win64.zip 0b8078299654a12846e4967f1db3506409cfb8b1031687a910965d1a99c6f270 lolMiner_v1.98a_Lin64.tar.gz | sha256sum --check --strict
          win_entry="$(unzip -Z1 lolMiner_v1.98a_Win64.zip | awk 'BEGIN { n=0 } /(^|\/)lolMiner\.exe$/ { e=$0; n++ } END { if (n != 1) exit 1; print e }')"
          linux_entry="$(tar -tzf lolMiner_v1.98a_Lin64.tar.gz | awk 'BEGIN { n=0 } /(^|\/)lolMiner$/ { e=$0; n++ } END { if (n != 1) exit 1; print e }')"
          case "$win_entry" in /*|*../*|../*) exit 1;; esac
          case "$linux_entry" in /*|*../*|../*) exit 1;; esac
          unzip -p lolMiner_v1.98a_Win64.zip "$win_entry" > lolMiner.exe
          tar -xOzf lolMiner_v1.98a_Lin64.tar.gz "$linux_entry" > lolMiner
          test -s lolMiner.exe
          test -s lolMiner
      - name: Write provenance report
        shell: bash
        run: |
          {
            printf 'lolMiner release: 1.98a\n'
            printf 'source: https://github.com/Lolliedieb/lolMiner-releases/releases/tag/1.98a\n'
            sha256sum lolMiner_v1.98a_Win64.zip lolMiner.exe lolMiner_v1.98a_Lin64.tar.gz lolMiner
          } | tee miner-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lolminer-1.98a-provenance
          path: miner-provenance.txt
          if-no-files-found: error
          retention-days: 14
