name: host-desktop

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/host-desktop/**'
      - 'docs/HOST_DESKTOP_*.md'
      - '.github/workflows/host-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/host-desktop/**'
      - 'docs/HOST_DESKTOP_*.md'
      - '.github/workflows/host-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-test-fixture:
    name: repair Rust test fixture
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Add collected GPU inventory to diagnostic fixture
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/host-desktop/src-tauri/src/lib.rs')
          source = path.read_text(encoding='utf-8')
          old = '            reason: "native_checks_pending",\n        }'
          new = '            reason: "native_checks_pending",\n            gpus: Vec::new(),\n        }'
          if new in source:
              raise SystemExit(0)
          if source.count(old) != 1:
              raise SystemExit('expected diagnostic fixture was not found exactly once')
          path.write_text(source.replace(old, new), encoding='utf-8')
      - name: Commit fixture correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Fixture is already corrected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/host-desktop/src-tauri/src/lib.rs
          git commit -m 'test(host): include GPUs in diagnostic fixture'
          git push origin HEAD:${{ github.head_ref }}

  frontend:
    name: frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/host-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/host-desktop/package-lock.json
      - name: Require committed dependency lock
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo 'package-lock.json is required for reproducible builds.' >&2
            exit 1
          fi
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run check
      - name: Build web interface
        run: npm run build

  rust:
    name: rust tests and lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize Windows bundle icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = 'apps/host-desktop/src-tauri/icons/icon.ico.base64'
          $target = 'apps/host-desktop/src-tauri/icons/icon.ico'
          if (!(Test-Path $source)) { throw 'Missing staged Windows icon source.' }
          [IO.File]::WriteAllBytes($target, [Convert]::FromBase64String((Get-Content $source -Raw).Trim()))
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Require committed Cargo lock
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then
            echo 'Cargo.lock is required at the workspace root for reproducible builds.' >&2
            exit 1
          fi
      - name: Verify host package formatting
        shell: bash
        run: |
          set -o pipefail
          cargo fmt -p gpubnb-host-desktop -- --check 2>&1 | tee cargo-fmt-${{ runner.os }}.log
      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-fmt-${{ runner.os }}
          path: cargo-fmt-${{ runner.os }}.log
          if-no-files-found: error
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p gpubnb-host-desktop --all-targets 2>&1 | tee cargo-test-${{ runner.os }}.log
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-${{ runner.os }}
          path: cargo-test-${{ runner.os }}.log
          if-no-files-found: warn
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p gpubnb-host-desktop --all-targets -- -D warnings 2>&1 | tee cargo-clippy-${{ runner.os }}.log
      - name: Upload Clippy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-clippy-${{ runner.os }}
          path: cargo-clippy-${{ runner.os }}.log
          if-no-files-found: warn

  security-gate:
    name: production security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require production readiness evidence
        shell: bash
        run: |
          test -f docs/HOST_DESKTOP_PRODUCTION_READINESS.md
          test -f docs/HOST_DESKTOP_THREAT_MODEL.md
          test -f docs/HOST_DESKTOP_RESOURCE_ORCHESTRATION.md
          grep -Fq 'Status: **NOT READY TO MERGE**' docs/HOST_DESKTOP_PRODUCTION_READINESS.md
