name: codex-wire-redis-readiness

on:
  push:
    branches:
      - codex/redis-capability-readiness
    paths:
      - .github/workflows/codex-wire-redis-readiness.yml
      - scripts/codex-wire-redis-readiness.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/redis-capability-readiness
      - run: python3 scripts/codex-wire-redis-readiness.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(redis): require capability proof in readiness"
          git push origin HEAD:codex/redis-capability-readiness
