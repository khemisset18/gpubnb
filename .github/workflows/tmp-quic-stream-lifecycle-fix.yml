name: tmp-quic-stream-lifecycle-fix

on:
  push:
    branches:
      - hardening/data-plane-production-qualification
    paths:
      - .github/scripts/tmp_quic_stream_lifecycle_fix.py
      - .github/workflows/tmp-quic-stream-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/data-plane-production-qualification
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Apply lifecycle patch
        run: python3 .github/scripts/tmp_quic_stream_lifecycle_fix.py

      - name: Validate Rust
        run: |
          cargo fmt --manifest-path services/edge/Cargo.toml -- --check
          cargo test --manifest-path services/edge/Cargo.toml --all-targets
          cargo clippy --manifest-path services/edge/Cargo.toml --all-targets -- -D warnings

      - name: Commit validated source only
        run: |
          git config user.name "gpubnb-ci"
          git config user.email "gpubnb-ci@users.noreply.github.com"
          git rm .github/scripts/tmp_quic_stream_lifecycle_fix.py .github/workflows/tmp-quic-stream-lifecycle-fix.yml
          git add services/edge/src/bin/gpubnb-edge.rs
          git commit -m "fix(data-plane): align stream release with QUIC acknowledgement"
          git push origin HEAD:hardening/data-plane-production-qualification
