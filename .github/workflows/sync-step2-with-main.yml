name: Sync step 2 with main

on:
  push:
    branches:
      - codex/step-2-hardware-metrics
    paths:
      - .github/workflows/sync-step2-with-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/step-2-hardware-metrics
          fetch-depth: 0
      - name: Merge current main safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X ours origin/main -m "merge: synchronize step 2 with main"
          git push origin HEAD:codex/step-2-hardware-metrics
