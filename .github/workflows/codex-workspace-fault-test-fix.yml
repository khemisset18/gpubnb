name: codex-workspace-fault-test-fix

on:
  push:
    branches:
      - codex/workspace-open-fault-qualification
    paths:
      - .github/workflows/codex-workspace-fault-test-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/workspace-open-fault-qualification
      - name: Remove invalid JSON parse from redirect assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/api/test/workspace-gateway-register-e2e.test.ts')
          s=p.read_text()
          old="assert.equal(firstOpen.statusCode, 302, JSON.stringify(firstOpen.json()));"
          new="assert.equal(firstOpen.statusCode, 302);"
          if s.count(old)!=1:
              raise SystemExit(f'redirect assertion marker count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit test correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/workspace-gateway-register-e2e.test.ts
          git commit -m "test(workspace): avoid parsing redirect as json"
          git push origin HEAD:codex/workspace-open-fault-qualification
