name: Stage 4 four-component release preflight
on:
  push:
    branches:
      - prep/stage4-four-component-rc-20261015
    paths:
      - scripts/build-windows-native-release-candidate.ps1
      - scripts/tests/stage4-four-component-rc.tests.ps1
      - .github/workflows/stage4-four-component-release-preflight.yml
  pull_request:
    paths:
      - scripts/build-windows-native-release-candidate.ps1
      - scripts/tests/stage4-four-component-rc.tests.ps1
      - .github/workflows/stage4-four-component-release-preflight.yml
permissions:
  contents: read
concurrency:
  group: stage4-rc-four-components-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reject-bad-agent-inputs:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Reject malformed Agent inputs without signing (PowerShell 5.1)
        shell: powershell
        run: |
          & ./scripts/tests/stage4-four-component-rc.tests.ps1
          if (-not $?) { throw 'stage4_rc_preflight_powershell_failed' }
      - name: Reject malformed Agent inputs without signing (PowerShell 7)
        shell: pwsh
        run: |
          & ./scripts/tests/stage4-four-component-rc.tests.ps1
          if (-not $?) { throw 'stage4_rc_preflight_pwsh_failed' }
      # No signing private key, no certificate, no signature, no upload or deploy.
