name: windows-native-media

on:
  pull_request:
    paths:
      - "native/windows-media/**"
      - ".github/workflows/windows-native-media.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout GPUbnb
        uses: actions/checkout@v6

      - name: Checkout pinned NVENC headers
        uses: actions/checkout@v6
        with:
          repository: FFmpeg/nv-codec-headers
          ref: eddcea9e27f6b772057c9b3f87de2cc1737faffc
          path: .deps/nv-codec-headers
          persist-credentials: false

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify pinned NVENC header
        shell: pwsh
        run: |
          $header = Join-Path $env:GITHUB_WORKSPACE ".deps\nv-codec-headers\include\ffnvcodec\nvEncodeAPI.h"
          if (-not (Test-Path -LiteralPath $header)) {
            throw "Pinned nvEncodeAPI.h is missing"
          }
          Select-String -Path $header -Pattern "NVENCAPI_MAJOR_VERSION" -SimpleMatch | Out-Null

      - name: Build Windows media proof DLL
        shell: pwsh
        run: |
          $include = Join-Path $env:GITHUB_WORKSPACE ".deps\nv-codec-headers\include\ffnvcodec"
          msbuild native\windows-media\GPUbnbWindowsMedia.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:NvCodecHeadersDir="$include" `
            /p:RunCodeAnalysis=true

      - name: Verify media DLL
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE "native\windows-media\bin\Release\GPUbnbWindowsMedia.dll"
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "GPUbnbWindowsMedia.dll was not produced"
          }
          $item = Get-Item -LiteralPath $dll
          if ($item.Length -le 0) {
            throw "GPUbnbWindowsMedia.dll is empty"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe is unavailable"
          }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Visual C++ build tools installation was not found"
          }
          $dumpbin = Get-ChildItem -Path (Join-Path $vs "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse -File |
            Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found in the Visual C++ toolchain"
          }

          $exports = (& $dumpbin.FullName /exports $dll) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed while inspecting GPUbnbWindowsMedia.dll"
          }
          foreach ($symbol in @(
            "GPUbnbProbeMediaFrame",
            "GPUbnbMediaOpen",
            "GPUbnbMediaReadFrame",
            "GPUbnbMediaClose"
          )) {
            $pattern = "(?m)^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+" + [regex]::Escape($symbol) + "(?:\s+=\s+" + [regex]::Escape($symbol) + ")?\s*$"
            if ($exports -notmatch $pattern) {
              Write-Host $exports
              throw "Missing required media ABI export: $symbol"
            }
          }
