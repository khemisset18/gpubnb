name: windows-native-media

on:
  pull_request:
    paths:
      - "native/windows-media/**"
      - ".github/workflows/windows-native-media.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout GPUbnb
        uses: actions/checkout@v6

      - name: Checkout pinned NVENC headers
        uses: actions/checkout@v6
        with:
          repository: FFmpeg/nv-codec-headers
          ref: eddcea9e27f6b772057c9b3f87de2cc1737faffc
          path: .deps/nv-codec-headers
          persist-credentials: false

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify pinned NVENC header
        shell: pwsh
        run: |
          $header = Join-Path $env:GITHUB_WORKSPACE ".deps\nv-codec-headers\include\ffnvcodec\nvEncodeAPI.h"
          if (-not (Test-Path -LiteralPath $header)) {
            throw "Pinned nvEncodeAPI.h is missing"
          }
          Select-String -Path $header -Pattern "NVENCAPI_MAJOR_VERSION" -SimpleMatch | Out-Null

      - name: Build Windows media proof DLL
        shell: pwsh
        run: |
          $include = Join-Path $env:GITHUB_WORKSPACE ".deps\nv-codec-headers\include\ffnvcodec"
          msbuild native\windows-media\GPUbnbWindowsMedia.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:NvCodecHeadersDir="$include" `
            /p:RunCodeAnalysis=true

      - name: Verify media DLL
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE "native\windows-media\bin\Release\GPUbnbWindowsMedia.dll"
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "GPUbnbWindowsMedia.dll was not produced"
          }
          $item = Get-Item -LiteralPath $dll
          if ($item.Length -le 0) {
            throw "GPUbnbWindowsMedia.dll is empty"
          }
