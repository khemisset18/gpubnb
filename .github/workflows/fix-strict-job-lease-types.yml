name: fix-strict-job-lease-types

on:
  push:
    branches:
      - hardening/job-lease-fencing
    paths:
      - scripts/fix_strict_job_lease_types.py
      - .github/workflows/fix-strict-job-lease-types.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/job-lease-fencing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_strict_job_lease_types.py
      - run: |
          git diff --check
          grep -q "type JobLeaseBody={attemptId?:string|undefined;leaseToken?:string|undefined};" apps/api/src/server.ts
          test ! -e .github/workflows/fix-strict-job-lease-types.yml
          test ! -e scripts/fix_strict_job_lease_types.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(api): satisfy exact optional job lease typing"
          git push origin HEAD:hardening/job-lease-fencing
