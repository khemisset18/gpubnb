name: Asset Exchange Recovery Artifact

on:
  push:
    branches:
      - asset-exchange/secure-foundation-v1
    paths:
      - 'asset-exchange/recovery/**'
      - 'asset-exchange/core/src/canonical.mjs'
      - 'asset-exchange/core/src/errors.mjs'
      - 'asset-exchange/core/src/deployment.mjs'
      - '.github/workflows/asset-exchange-recovery-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-exchange-recovery-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Reproducible recovery artifact + provenance
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          check-latest: false

      - name: Run recovery tests
        working-directory: asset-exchange
        run: node --test recovery/test/*.test.mjs

      - name: Resolve deterministic build timestamp
        id: source
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          echo "epoch=${epoch}" >> "${GITHUB_OUTPUT}"

      - name: Build twice
        shell: bash
        run: |
          set -euo pipefail
          chmod +x asset-exchange/recovery/release/build-reproducible.sh
          chmod +x asset-exchange/recovery/release/verify-artifact.sh
          asset-exchange/recovery/release/build-reproducible.sh "${RUNNER_TEMP}/recovery-build-a" "${GITHUB_SHA}" "${{ steps.source.outputs.epoch }}"
          asset-exchange/recovery/release/build-reproducible.sh "${RUNNER_TEMP}/recovery-build-b" "${GITHUB_SHA}" "${{ steps.source.outputs.epoch }}"

      - name: Prove byte-for-byte reproducibility
        shell: bash
        run: |
          set -euo pipefail
          cmp "${RUNNER_TEMP}/recovery-build-a/dist/gpu.k.p2p-recovery-tool-v1.tar.gz" "${RUNNER_TEMP}/recovery-build-b/dist/gpu.k.p2p-recovery-tool-v1.tar.gz"
          cmp "${RUNNER_TEMP}/recovery-build-a/dist/gpu.k.p2p-recovery-tool-v1.spdx.json" "${RUNNER_TEMP}/recovery-build-b/dist/gpu.k.p2p-recovery-tool-v1.spdx.json"
          cmp "${RUNNER_TEMP}/recovery-build-a/dist/SHA256SUMS" "${RUNNER_TEMP}/recovery-build-b/dist/SHA256SUMS"

      - name: Stage and verify artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/recovery
          cp "${RUNNER_TEMP}/recovery-build-a/dist/"* dist/recovery/
          asset-exchange/recovery/release/verify-artifact.sh dist/recovery "${GITHUB_SHA}"

      - name: Attest SLSA build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/recovery/gpu.k.p2p-recovery-tool-v1.tar.gz
          show-summary: true

      - name: Attest SPDX SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/recovery/gpu.k.p2p-recovery-tool-v1.tar.gz
          sbom-path: dist/recovery/gpu.k.p2p-recovery-tool-v1.spdx.json
          show-summary: true

      - name: Collect attestation bundles
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" dist/recovery/provenance.sigstore.json
          cp "${{ steps.sbom.outputs.bundle-path }}" dist/recovery/sbom-attestation.sigstore.json

      - name: Upload recovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-exchange-recovery-artifact-${{ github.sha }}
          path: dist/recovery/
          if-no-files-found: error
          retention-days: 30


  consumer-verify:
    name: Independent consumer attestation verification
    needs: package
    permissions:
      contents: read
      actions: read
      attestations: read
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout verifier source at exact build commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packaged recovery evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: asset-exchange-recovery-artifact-${{ github.sha }}
          path: dist/recovery

      - name: Verify packaged files, SBOM hashes, and source binding
        shell: bash
        run: |
          set -euo pipefail
          chmod +x asset-exchange/recovery/release/verify-artifact.sh
          asset-exchange/recovery/release/verify-artifact.sh dist/recovery "${GITHUB_SHA}"

      - name: Verify provenance against exact repository and source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          gh attestation verify             dist/recovery/gpu.k.p2p-recovery-tool-v1.tar.gz             --repo "${GITHUB_REPOSITORY}"             --source-digest "${GITHUB_SHA}"             --format json             > dist/recovery/consumer-provenance-verification.json

      - name: Verify SPDX SBOM attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify             dist/recovery/gpu.k.p2p-recovery-tool-v1.tar.gz             --repo "${GITHUB_REPOSITORY}"             --source-digest "${GITHUB_SHA}"             --predicate-type https://spdx.dev/Document/v2.3             --format json             > dist/recovery/consumer-sbom-verification.json

      - name: Verify consumer result structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in [
              "consumer-provenance-verification.json",
              "consumer-sbom-verification.json",
          ]:
              data=json.loads(Path("dist/recovery", name).read_text())
              if not isinstance(data, list) or not data:
                  raise SystemExit(f"{name}: no verified attestation result")
          print("Independent consumer attestation verification passed.")
          PY
