name: artifact-storage-s3-integration

on:
  pull_request:
    paths:
      - 'apps/api/src/artifact-storage.ts'
      - 'apps/api/src/artifact-storage-migration.ts'
      - 'apps/api/test/artifact-storage-s3.integration.test.ts'
      - 'apps/api/test/artifact-storage-migration-s3.integration.test.ts'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - '.github/workflows/artifact-storage-s3-integration.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/src/artifact-storage.ts'
      - 'apps/api/src/artifact-storage-migration.ts'
      - 'apps/api/test/artifact-storage-s3.integration.test.ts'
      - 'apps/api/test/artifact-storage-migration-s3.integration.test.ts'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - '.github/workflows/artifact-storage-s3-integration.yml'

permissions:
  contents: read

jobs:
  minio-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Resolve the maintained image once per CI run, then use only immutable
      # digests. Every selected image is verified and scanned BEFORE execution.
      MINIO_TAG: cgr.dev/chainguard/minio:latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install locked API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Resolve a current immutable MinIO image and exact linux/amd64 child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s3-evidence
          docker buildx version
          # The floating tag is used solely for discovery. No container executes
          # until the immutable index+child are independently verified and scanned.
          index_digest="$(docker buildx imagetools inspect "$MINIO_TAG" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$index_digest" =~ ^sha256:[[:xdigit:]]{64}$ ]] || {
            echo 'Could not resolve a valid immutable MinIO index digest' >&2
            exit 1
          }
          repository="${MINIO_TAG%:*}"
          index_image="$repository@$index_digest"
          docker buildx imagetools inspect --raw "$index_image" > s3-evidence/minio-index.json
          amd64_digest="$(jq -er '
            [.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64"
              and (.platform.variant == null or .platform.variant == "")) | .digest]
            | if length == 1 then .[0] else error("exactly one linux/amd64 image required") end
          ' s3-evidence/minio-index.json)"
          [[ "$amd64_digest" =~ ^sha256:[[:xdigit:]]{64}$ ]] || {
            echo 'Invalid architecture-pinned MinIO child digest' >&2
            exit 1
          }
          printf 'MINIO_IMAGE=%s\n' "$index_image" >> "$GITHUB_ENV"
          printf 'MINIO_AMD64_IMAGE=%s\n' "$repository@$amd64_digest" >> "$GITHUB_ENV"
          printf 'source-tag=%s\nindex=%s\nlinux-amd64=%s\n' \
            "$MINIO_TAG" "$index_image" "$repository@$amd64_digest" \
            > s3-evidence/resolved-fixture.txt
          sha256sum s3-evidence/minio-index.json > s3-evidence/minio-index.sha256
          echo 'Fixture image resolved to immutable index and linux/amd64 digests'
      - name: Verify pinned fixture signature and signed SBOM before execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir s3-evidence
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 \
            -o "$RUNNER_TEMP/s3-cosign"
          echo '424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  '"$RUNNER_TEMP/s3-cosign" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/s3-cosign"
          "$RUNNER_TEMP/s3-cosign" verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
            "$MINIO_IMAGE" > s3-evidence/image-signature.json
          "$RUNNER_TEMP/s3-cosign" verify-attestation --type https://spdx.dev/Document \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
            "$MINIO_AMD64_IMAGE" > s3-evidence/signed-sbom.jsonl
      - name: Scan actual pinned fixture without severity exclusions
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.MINIO_AMD64_IMAGE }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: s3-evidence/image-trivy.json
          exit-code: '1'
      - name: Start S3-compatible MinIO
        run: |
          docker network create --internal gpubnb-s3-ci
          docker run -d --rm --name gpubnb-minio \
            --platform linux/amd64 --network gpubnb-s3-ci \
            -p 127.0.0.1:9000:9000 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --cpus 2 \
            --tmpfs /data:uid=65532,gid=65532,mode=0700,size=256m \
            --tmpfs /tmp:uid=65532,gid=65532,mode=0700,size=32m \
            -e MINIO_ROOT_USER=gpubnb-ci-access \
            -e MINIO_ROOT_PASSWORD=gpubnb-ci-secret-key \
            "$MINIO_IMAGE" --certs-dir /tmp/certs server /data --address :9000
          # An internal bridge has no external NAT route. Reach its connected
          # private address from the runner rather than relying on port NAT.
          fixture_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' gpubnb-minio)"
          python3 - "$fixture_ip" <<'PY'
          import ipaddress, sys
          address = ipaddress.ip_address(sys.argv[1])
          assert address.version == 4 and address.is_private and not address.is_loopback
          PY
          fixture_endpoint="http://$fixture_ip:9000"
          echo "ARTIFACT_S3_ENDPOINT=$fixture_endpoint" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --noproxy '*' --connect-timeout 1 --max-time 2 "$fixture_endpoint/minio/health/live" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs gpubnb-minio
          exit 1
      - name: Real S3 put/get round trip
        working-directory: apps/api
        env:
          ARTIFACT_S3_INTEGRATION: '1'
          ARTIFACT_S3_REGION: us-east-1
          ARTIFACT_S3_ACCESS_KEY_ID: gpubnb-ci-access
          ARTIFACT_S3_SECRET_ACCESS_KEY: gpubnb-ci-secret-key
        run: |
          set -o pipefail
          npx tsx --test test/artifact-storage-s3.integration.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/s3-evidence/roundtrip.log"
      - name: Real historical migration round trip
        working-directory: apps/api
        env:
          ARTIFACT_S3_INTEGRATION: '1'
          ARTIFACT_S3_REGION: us-east-1
          ARTIFACT_S3_ACCESS_KEY_ID: gpubnb-ci-access
          ARTIFACT_S3_SECRET_ACCESS_KEY: gpubnb-ci-secret-key
        run: |
          set -o pipefail
          npx tsx --test test/artifact-storage-migration-s3.integration.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/s3-evidence/migration.log"
      - name: Retain MinIO diagnostics and remove disposable fixture
        if: always()
        run: |
          if docker container inspect gpubnb-minio >/dev/null 2>&1; then
            docker logs gpubnb-minio > s3-evidence/minio-container.log 2>&1
            docker stop gpubnb-minio
          fi
          if docker network inspect gpubnb-s3-ci >/dev/null 2>&1; then
            docker network rm gpubnb-s3-ci
          fi
      - name: Preserve real S3 test and fixture supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-integration-evidence
          path: s3-evidence/
          if-no-files-found: error
          retention-days: 30
