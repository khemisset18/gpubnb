name: artifact-storage-s3-integration

on:
  pull_request:
    paths:
      - 'apps/api/src/artifact-storage.ts'
      - 'apps/api/src/artifact-storage-migration.ts'
      - 'apps/api/test/artifact-storage-s3.integration.test.ts'
      - 'apps/api/test/artifact-storage-migration-s3.integration.test.ts'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - '.github/workflows/artifact-storage-s3-integration.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/src/artifact-storage.ts'
      - 'apps/api/src/artifact-storage-migration.ts'
      - 'apps/api/test/artifact-storage-s3.integration.test.ts'
      - 'apps/api/test/artifact-storage-migration-s3.integration.test.ts'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - '.github/workflows/artifact-storage-s3-integration.yml'

permissions:
  contents: read

concurrency:
  group: artifact-storage-s3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s3-real-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install locked API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Start pinned SeaweedFS S3 server (real HTTP backend)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gpubnb-s3-credentials.json" <<'JSON'
          {"identities":[{"name":"gpubnb-ci","credentials":[{"accessKey":"gpubnb-ci-access","secretKey":"gpubnb-ci-secret-key"}],"actions":["Admin","Read","Write"]}]}
          JSON
          docker run -d --rm --name gpubnb-s3 -p 127.0.0.1:9000:8333 \
            -v "$RUNNER_TEMP/gpubnb-s3-credentials.json:/etc/gpubnb-s3.json:ro" \
            chrislusf/seaweedfs@sha256:2c96cf02b8596dbf73c9fca5b90d9258f1953cdaaf4160009d3d02e796c9f0a6 \
            server -s3 -dir=/data -s3.config=/etc/gpubnb-s3.json
          for _ in $(seq 1 45); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:9000/ || true)
            if [ "$status" = "403" ] || [ "$status" = "200" ]; then
              exit 0
            fi
            if ! docker ps --filter "name=^/gpubnb-s3$" --format '{{.ID}}' | grep -q .; then
              docker logs gpubnb-s3
              exit 1
            fi
            sleep 1
          done
          docker logs gpubnb-s3
          exit 1
      - name: Real S3 put/get round trip
        working-directory: apps/api
        env:
          ARTIFACT_S3_INTEGRATION: '1'
          ARTIFACT_S3_ENDPOINT: http://127.0.0.1:9000
          ARTIFACT_S3_REGION: us-east-1
          ARTIFACT_S3_ACCESS_KEY_ID: gpubnb-ci-access
          ARTIFACT_S3_SECRET_ACCESS_KEY: gpubnb-ci-secret-key
        run: npx tsx --test test/artifact-storage-s3.integration.test.ts
      - name: Real historical migration round trip
        working-directory: apps/api
        env:
          ARTIFACT_S3_INTEGRATION: '1'
          ARTIFACT_S3_ENDPOINT: http://127.0.0.1:9000
          ARTIFACT_S3_REGION: us-east-1
          ARTIFACT_S3_ACCESS_KEY_ID: gpubnb-ci-access
          ARTIFACT_S3_SECRET_ACCESS_KEY: gpubnb-ci-secret-key
        run: npx tsx --test test/artifact-storage-migration-s3.integration.test.ts
      - name: SeaweedFS S3 diagnostics
        if: failure()
        run: docker logs gpubnb-s3 || true
      - name: Stop SeaweedFS S3
        if: always()
        run: docker stop gpubnb-s3 || true
