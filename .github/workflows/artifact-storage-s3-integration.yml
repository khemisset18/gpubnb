name: artifact-storage-s3-integration

on:
  pull_request:
    paths:
      - 'apps/api/src/artifact-storage.ts'
      - 'apps/api/src/artifact-storage-migration.ts'
      - 'apps/api/test/artifact-storage-s3.integration.test.ts'
      - 'apps/api/test/artifact-storage-migration-s3.integration.test.ts'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - '.github/workflows/artifact-storage-s3-integration.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/src/artifact-storage.ts'
      - 'apps/api/src/artifact-storage-migration.ts'
      - 'apps/api/test/artifact-storage-s3.integration.test.ts'
      - 'apps/api/test/artifact-storage-migration-s3.integration.test.ts'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - '.github/workflows/artifact-storage-s3-integration.yml'

permissions:
  contents: read

concurrency:
  group: artifact-storage-s3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minio-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install locked API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Start S3-compatible MinIO
        env:
          MINIO_ROOT_USER: gpubnb-ci-access
          MINIO_ROOT_PASSWORD: gpubnb-ci-secret-key
        run: |
          set -euo pipefail
          MINIO_VERSION='RELEASE.2025-09-07T16-13-09Z'
          MINIO_SHA256='7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f'
          MINIO_URL="https://github.com/minio/minio/releases/download/$MINIO_VERSION/minio.linux-amd64.$MINIO_VERSION"
          curl --fail --location --retry 3 --retry-all-errors --output /tmp/gpubnb-minio "$MINIO_URL"
          echo "$MINIO_SHA256  /tmp/gpubnb-minio" | sha256sum --check --strict
          chmod 0755 /tmp/gpubnb-minio
          mkdir -p /tmp/gpubnb-minio-data
          /tmp/gpubnb-minio server /tmp/gpubnb-minio-data --address :9000 > /tmp/gpubnb-minio.log 2>&1 &
          echo $! > /tmp/gpubnb-minio.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gpubnb-minio.log
          exit 1
      - name: Real S3 put/get round trip
        working-directory: apps/api
        env:
          ARTIFACT_S3_INTEGRATION: '1'
          ARTIFACT_S3_ENDPOINT: http://127.0.0.1:9000
          ARTIFACT_S3_REGION: us-east-1
          ARTIFACT_S3_ACCESS_KEY_ID: gpubnb-ci-access
          ARTIFACT_S3_SECRET_ACCESS_KEY: gpubnb-ci-secret-key
        run: npx tsx --test test/artifact-storage-s3.integration.test.ts
      - name: Real historical migration round trip
        working-directory: apps/api
        env:
          ARTIFACT_S3_INTEGRATION: '1'
          ARTIFACT_S3_ENDPOINT: http://127.0.0.1:9000
          ARTIFACT_S3_REGION: us-east-1
          ARTIFACT_S3_ACCESS_KEY_ID: gpubnb-ci-access
          ARTIFACT_S3_SECRET_ACCESS_KEY: gpubnb-ci-secret-key
        run: npx tsx --test test/artifact-storage-migration-s3.integration.test.ts
      - name: MinIO diagnostics
        if: failure()
        run: cat /tmp/gpubnb-minio.log 2>/dev/null || true
      - name: Stop MinIO
        if: always()
        run: |
          if [ -f /tmp/gpubnb-minio.pid ]; then
            kill "$(cat /tmp/gpubnb-minio.pid)" 2>/dev/null || true
          fi
