name: artifact-storage-s3-integration

on:
  pull_request:
    paths:
      - 'apps/api/src/artifact-storage.ts'
      - 'apps/api/src/artifact-storage-migration.ts'
      - 'apps/api/test/artifact-storage-s3.integration.test.ts'
      - 'apps/api/test/artifact-storage-migration-s3.integration.test.ts'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - '.github/workflows/artifact-storage-s3-integration.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/src/artifact-storage.ts'
      - 'apps/api/src/artifact-storage-migration.ts'
      - 'apps/api/test/artifact-storage-s3.integration.test.ts'
      - 'apps/api/test/artifact-storage-migration-s3.integration.test.ts'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - '.github/workflows/artifact-storage-s3-integration.yml'

permissions:
  contents: read

concurrency:
  group: artifact-storage-s3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minio-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install locked API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Start version-pinned S3-compatible MinIO from official Linux binary
        shell: bash
        env:
          MINIO_VERSION: RELEASE.2025-09-07T16-13-09Z
          MINIO_SHA256: 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/gpubnb-minio"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 180 \
            "https://dl.min.io/server/minio/release/linux-amd64/minio.${MINIO_VERSION}" \
            --output "$binary"
          printf '%s  %s\n' "$MINIO_SHA256" "$binary" | sha256sum --check --status
          chmod 0755 "$binary"
          mkdir -p "$RUNNER_TEMP/gpubnb-minio-data"
          MINIO_ROOT_USER=gpubnb-ci-access MINIO_ROOT_PASSWORD=gpubnb-ci-secret-key \
            "$binary" server "$RUNNER_TEMP/gpubnb-minio-data" --address :9000 \
            > "$RUNNER_TEMP/gpubnb-minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/gpubnb-minio.pid"
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/gpubnb-minio.pid")" 2>/dev/null; then
              echo "MinIO exited before readiness"
              cat "$RUNNER_TEMP/gpubnb-minio.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/gpubnb-minio.log"
          exit 1
      - name: Real S3 put/get round trip
        working-directory: apps/api
        env:
          ARTIFACT_S3_INTEGRATION: '1'
          ARTIFACT_S3_ENDPOINT: http://127.0.0.1:9000
          ARTIFACT_S3_REGION: us-east-1
          ARTIFACT_S3_ACCESS_KEY_ID: gpubnb-ci-access
          ARTIFACT_S3_SECRET_ACCESS_KEY: gpubnb-ci-secret-key
        run: npx tsx --test test/artifact-storage-s3.integration.test.ts
      - name: Real historical migration round trip
        working-directory: apps/api
        env:
          ARTIFACT_S3_INTEGRATION: '1'
          ARTIFACT_S3_ENDPOINT: http://127.0.0.1:9000
          ARTIFACT_S3_REGION: us-east-1
          ARTIFACT_S3_ACCESS_KEY_ID: gpubnb-ci-access
          ARTIFACT_S3_SECRET_ACCESS_KEY: gpubnb-ci-secret-key
        run: npx tsx --test test/artifact-storage-migration-s3.integration.test.ts
      - name: MinIO diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/gpubnb-minio.log" ]; then
            tail -n 100 "$RUNNER_TEMP/gpubnb-minio.log"
          fi
      - name: Stop MinIO
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/gpubnb-minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/gpubnb-minio.pid")" || true
          fi
