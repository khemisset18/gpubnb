name: codex-listing-reliability-patch

on:
  push:
    branches: [codex/listing-transaction-reliability]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/listing-transaction-reliability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact guarded replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          lifecycle = 'apps/api/src/rental-listing-lifecycle.ts'
          service = 'apps/api/src/rental-listing-service.ts'
          allowlist = 'apps/api/scripts/serializable-guard-allowlist.json'

          replace_once(
              lifecycle,
              "import { isExactGpuPubliclyHealthy } from './rental-public-listings.js';\n",
              "import { runBookingTransaction } from './booking-transaction-retry.js';\nimport { isExactGpuPubliclyHealthy } from './rental-public-listings.js';\n",
          )
          replace_once(
              lifecycle,
              "return await db.$transaction(async (tx) => {",
              "return await runBookingTransaction(db, async (tx) => {",
          )
          replace_once(
              lifecycle,
              "return await db.$transaction(async (tx) => {",
              "return await runBookingTransaction(db, async (tx) => {",
          )

          replace_once(
              service,
              "import { supportsJobLeaseProtocol } from './job-execution-lease.js';\n",
              "import { runBookingTransaction } from './booking-transaction-retry.js';\nimport { supportsJobLeaseProtocol } from './job-execution-lease.js';\n",
          )
          replace_once(
              service,
              "return await db.$transaction(async (tx) => {",
              "return await runBookingTransaction(db, async (tx) => {",
          )

          p = Path(allowlist)
          text = p.read_text()
          for entry in [
              '    "apps/api/src/rental-listing-lifecycle.ts:313",\n',
              '    "apps/api/src/rental-listing-lifecycle.ts:372",\n',
              '    "apps/api/src/rental-listing-service.ts:187",\n',
          ]:
              if text.count(entry) != 1:
                  raise SystemExit(f'{allowlist}: expected exactly one {entry.strip()}')
              text = text.replace(entry, '', 1)
          p.write_text(text)

          test_path = Path('apps/api/test/listing-transaction-retry-wiring.test.ts')
          if test_path.exists():
              raise SystemExit(f'{test_path} already exists')
          test_path.write_text("""import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';
import test from 'node:test';

function compact(value: string): string {
  return value.replace(/\\s+/g, '');
}

test('exact GPU listing creation uses bounded retry while preserving the machine advisory lock', async () => {
  const source = await readFile(new URL('../src/rental-listing-service.ts', import.meta.url), 'utf8');
  const start = source.indexOf('export async function createExactGpuListing');
  assert.ok(start >= 0);
  const body = compact(source.slice(start));

  assert.match(body, /runBookingTransaction\\(db,async\\(tx\\)=>/);
  assert.match(body, /pg_advisory_xact_lock\\(hashtextextended\\(\\$\\{input\\.machineId\\},0\\)\\)/);
  assert.match(body, /isolationLevel:Prisma\\.TransactionIsolationLevel\\.Serializable/);
  assert.match(body, /maxWait:5_000/);
  assert.match(body, /timeout:10_000/);
});

test('owner listing lifecycle retries both serialized machine-scoped transitions', async () => {
  const source = await readFile(new URL('../src/rental-listing-lifecycle.ts', import.meta.url), 'utf8');
  const body = compact(source);

  const retries = body.match(/runBookingTransaction\\(db,async\\(tx\\)=>/g) ?? [];
  assert.equal(retries.length, 2);

  const locks = body.match(/pg_advisory_xact_lock\\(hashtextextended\\(\\$\\{identity\\.machineId\\},0\\)\\)/g) ?? [];
  assert.equal(locks.length, 2);

  const serializable = body.match(/isolationLevel:Prisma\\.TransactionIsolationLevel\\.Serializable/g) ?? [];
  assert.equal(serializable.length, 2);

  const maxWait = body.match(/maxWait:5_000/g) ?? [];
  assert.equal(maxWait.length, 2);
  const timeout = body.match(/timeout:10_000/g) ?? [];
  assert.equal(timeout.length, 2);
});
""")
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/rental-listing-lifecycle.ts apps/api/src/rental-listing-service.ts apps/api/scripts/serializable-guard-allowlist.json apps/api/test/listing-transaction-retry-wiring.test.ts
          git diff --cached --exit-code && exit 0
          git commit -m "fix(reliability): retry exact GPU listing transactions"
          git push origin HEAD:codex/listing-transaction-reliability
