name: refresh-deepmerge-lock
on:
  push:
    branches:
      - tmp/refresh-deepmerge-lock
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh API lockfile
        working-directory: apps/api
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload refreshed lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-lockfiles
          path: |
            package-lock.json
            apps/api/package-lock.json
          retention-days: 1
