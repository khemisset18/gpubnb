name: harden-stalled-activation

on:
  push:
    branches: [hardening/job-lease-fencing]
    paths:
      - scripts/harden_stalled_activation_reconciler.py
      - .github/workflows/harden-stalled-activation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/job-lease-fencing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/harden_stalled_activation_reconciler.py
      - run: |
          git diff --check
          grep -q "claimedExecution" apps/api/src/dev-booking-reconciler.ts
          grep -q "leaseExpiresAt" apps/api/src/dev-booking-reconciler.ts
          test ! -e .github/workflows/harden-stalled-activation.yml
          test ! -e scripts/harden_stalled_activation_reconciler.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(api): fail closed on stalled claimed activations"
          git push origin HEAD:hardening/job-lease-fencing
