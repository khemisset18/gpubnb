name: deployment-readiness

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'deploy/**'
      - 'services/edge/**'
      - 'scripts/generate-web-build-info.mjs'
      - 'netlify.toml'
      - '.github/workflows/deployment-readiness.yml'
      - '.github/workflows/data-plane-production-qualification.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'deploy/**'
      - 'services/edge/**'
      - 'scripts/generate-web-build-info.mjs'
      - 'netlify.toml'
      - '.github/workflows/deployment-readiness.yml'
      - '.github/workflows/data-plane-production-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-site:
    name: Netlify static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required static assets
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/index.html
          test -f apps/web/app.js
          test -f apps/web/styles.css
          test -f apps/web/config.js
          test -f apps/web/vendor/solana-web3.min.js
      - name: Generate provider-neutral production routing
        shell: bash
        env:
          CONTEXT: production
          GPUBNB_API_ORIGIN: https://api.example.invalid
          GPUBNB_GATEWAY_ORIGIN: https://gateway.example.invalid
        run: node scripts/generate-web-build-info.mjs
      - name: Validate Netlify routing and security policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'publish = "apps/web"' netlify.toml
          grep -Fq '/api/* https://api.example.invalid/:splat 200!' apps/web/_redirects
          grep -Fq 'window.GPUBNB_GATEWAY_URL = window.GPUBNB_GATEWAY_URL || "https://gateway.example.invalid";' apps/web/config.js
          grep -Fq 'Content-Security-Policy:' apps/web/_headers
          grep -Eq "script-src [^;]*https://cdn\.jsdelivr\.net" apps/web/_headers
          grep -Fq 'https://gateway.example.invalid' apps/web/_headers
          grep -Fq 'wss://gateway.example.invalid' apps/web/_headers
          grep -Fq "frame-ancestors 'none'" apps/web/_headers
          grep -Fq 'X-Content-Type-Options = "nosniff"' netlify.toml
          grep -Fq 'src="https://cdn.jsdelivr.net' apps/web/auth.html
          ! grep -RInE '\.onrender\.com' apps/web scripts netlify.toml .github/workflows/deployment-readiness.yml
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|seed phrase|mnemonic)' apps/web netlify.toml

  api-image:
    name: API container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate provider-neutral production image
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'prisma migrate deploy' apps/api/Dockerfile
          grep -Fq 'node dist/server.js' apps/api/Dockerfile
          grep -Fq 'USER app' apps/api/Dockerfile
          ! grep -Fq 'onrender.com' apps/api/Dockerfile
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag gpubnb-api:deployment-check .
      - name: Inspect non-root runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect gpubnb-api:deployment-check --format '{{.Config.User}}')" = 'app'

  runtime-topology:
    name: Runtime process topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required provider-neutral process roles
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const topology = JSON.parse(fs.readFileSync('deploy/runtime-processes.json', 'utf8'));
          const processes = topology.processes || {};
          const required = {
            'database-migrate': ['one-shot', './node_modules/.bin/prisma migrate deploy'],
            'api': ['service', 'node dist/server.js'],
            'delivery-worker': ['worker', 'node dist/delivery-worker.js'],
          };
          for (const [name, [kind, command]] of Object.entries(required)) {
            if (!processes[name]) throw new Error(`missing runtime process: ${name}`);
            if (processes[name].kind !== kind) throw new Error(`wrong kind for ${name}`);
            if (processes[name].command !== command) throw new Error(`wrong command for ${name}`);
          }
          if (processes.api.healthPath !== '/ready') throw new Error('api /ready health check required');
          const before = new Set(processes['database-migrate'].requiredBefore || []);
          if (!before.has('api') || !before.has('delivery-worker')) throw new Error('migrations must precede api and delivery-worker');
          if (/onrender\.com|render\.yaml|railway|heroku|fly\.io/i.test(JSON.stringify(topology))) throw new Error('provider-specific runtime topology');
          NODE
          grep -Fq '"start": "node dist/server.js"' apps/api/package.json
          grep -Fq '"start:delivery": "node dist/delivery-worker.js"' apps/api/package.json
          grep -Fq 'delivery_worker_started' apps/api/src/delivery-worker.ts

  configuration:
    name: Deployment configuration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unsafe defaults and verify local infrastructure contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'ALLOW_MAINNET=true' .env.example
          grep -Fq '"--requirepass","change-me"' docker-compose.yml
          grep -Fq 'REDIS_URL=redis://:change-me@localhost:6379' .env.example
          grep -Fq "assert.equal(dataPlaneHostBootstrapEnabled({}), false);" apps/api/test/data-plane-host-bootstrap.test.ts
      - name: Require CI-gated Data Plane qualification
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/data-plane-production-qualification.yml
          grep -Fq 'production-qualification:' .github/workflows/data-plane-production-qualification.yml
          grep -Fq 'GPUBNB_DATA_PLANE_EDGE_ENABLED' apps/api/src/data-plane-host-bootstrap.ts
