name: publish-host-test-release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/host-desktop/**'
      - 'agent/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/publish-host-test-release.yml'

permissions:
  contents: write

concurrency:
  group: publish-host-test-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            bundle: nsis
            pattern: '*.exe'
            asset: gpubnb-host-windows-x64.exe
            tauri_config: '--config src-tauri/tauri.sidecar.conf.json'
          - os: ubuntu-24.04
            label: Linux x64
            bundle: deb
            pattern: '*.deb'
            asset: gpubnb-host-linux-x64.deb
            tauri_config: ''
          - os: macos-14
            label: macOS arm64
            bundle: dmg
            pattern: '*.dmg'
            asset: gpubnb-host-macos-arm64.dmg
            tauri_config: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/host-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Materialize bundle icon
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const source = 'apps/host-desktop/src-tauri/icons/icon.ico.base64';
          const target = 'apps/host-desktop/src-tauri/icons/icon.ico';
          const decoded = Buffer.from(fs.readFileSync(source, 'utf8').trim(), 'base64');
          if (decoded.length < 256) throw new Error('Invalid icon');
          fs.writeFileSync(target, decoded);
          NODE

      - name: Install locked dependencies
        working-directory: apps/host-desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build standalone Windows agent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./agent pyinstaller==6.16.0
          pyinstaller --clean --noconfirm --onefile --name gpubnb-agent --hidden-import=_cffi_backend --hidden-import=encodings.idna --hidden-import=servicemanager --hidden-import=win32event --hidden-import=win32service --hidden-import=win32serviceutil --hidden-import=win32timezone --collect-all cffi --collect-all nacl agent/gpubnb_agent/__main__.py
          if (-not (Test-Path dist/gpubnb-agent.exe)) { throw 'Standalone agent was not generated.' }
          $target = (rustc -vV | Select-String '^host:' | ForEach-Object { ($_ -split ':', 2)[1].Trim() })
          if (-not $target) { throw 'Rust target triple could not be determined.' }
          New-Item -ItemType Directory -Force apps/host-desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/gpubnb-agent.exe "apps/host-desktop/src-tauri/binaries/gpubnb-agent-$target.exe"
          & ./dist/gpubnb-agent.exe version
          if ($LASTEXITCODE -ne 0) { throw 'Standalone agent validation failed.' }
          & ./dist/gpubnb-agent.exe runtime-check
          if ($LASTEXITCODE -ne 0) { throw 'Standalone agent network runtime check failed.' }

      - name: Validate application
        working-directory: apps/host-desktop
        run: |
          npm run check
          npm run build

      - name: Validate native core
        shell: bash
        env:
          GPUBNB_WEB_BASE_URL: https://gpubnb.netlify.app
        run: |
          set -euo pipefail
          cargo fmt -p gpubnb-host-desktop -- --check
          cargo test --locked -p gpubnb-host-desktop --all-targets
          cargo clippy --locked -p gpubnb-host-desktop --all-targets -- -D warnings

      - name: Build test installer
        working-directory: apps/host-desktop
        shell: bash
        env:
          GPUBNB_RELEASE_CHANNEL: test
          GPUBNB_WEB_BASE_URL: https://gpubnb.netlify.app
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Tauri bundle attempt ${attempt}/3"
            if npm run tauri:build -- --bundles ${{ matrix.bundle }} ${{ matrix.tauri_config }}; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Tauri bundle failed after ${attempt} attempts." >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Stage predictable asset name
        shell: bash
        env:
          EXPECTED_PATTERN: ${{ matrix.pattern }}
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          bundle_dir='target/release/bundle'
          if [ ! -d "$bundle_dir" ]; then bundle_dir='apps/host-desktop/src-tauri/target/release/bundle'; fi
          source_file="$(find "$bundle_dir" -type f -name "$EXPECTED_PATTERN" | head -n 1)"
          test -n "$source_file"
          mkdir -p release-assets
          cp "$source_file" "release-assets/$ASSET_NAME"
          ASSET_PATH="release-assets/$ASSET_NAME" node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const file = process.env.ASSET_PATH;
          const hash = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          fs.writeFileSync(`${file}.sha256`, `${hash}  ${file.split('/').pop()}\n`);
          NODE

      - name: Create verified Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            'target/release/gpubnb-host-desktop.exe',
            'apps/host-desktop/src-tauri/target/release/gpubnb-host-desktop.exe'
          )
          $portable = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $portable) { throw 'Portable Windows executable was not produced.' }

          $bytes = [System.IO.File]::ReadAllBytes($portable)
          if ($bytes.Length -lt 262144) { throw "Portable executable is unexpectedly small: $($bytes.Length) bytes." }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Portable executable is not a valid Windows PE file (missing MZ header).' }

          # This is a secondary, no-install fallback. The primary Windows asset is
          # the real NSIS installer staged above (gpubnb-host-windows-x64.exe): it
          # is the only path that registers the Start Menu shortcut, the Windows
          # service (elevated), and an uninstaller. Do not delete it here — a
          # previous version of this step did, which shipped every public release
          # with no way to get a properly installed GUI, service, or uninstaller.
          $portableDir = 'windows-portable'
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item $portable "$portableDir/GPUbnb-Host-Portable.exe"
          if (-not (Test-Path 'dist/gpubnb-agent.exe')) { throw 'Windows agent sidecar is missing.' }
          Copy-Item 'dist/gpubnb-agent.exe' "$portableDir/gpubnb-agent.exe"
          @'
          GPUbnb Host — version portable Windows (sans installation)

          Pour une installation complète (raccourci menu Démarrer, service Windows,
          désinstalleur), utilisez plutôt gpubnb-host-windows-x64.exe.

          Cette archive portable est un secours sans installation :
          1. Extrayez entièrement cette archive ZIP.
          2. Lancez GPUbnb-Host-Portable.exe.
          3. Windows peut afficher un avertissement car cette version de test n'est pas encore signée.

          Cette version est réservée aux tests sur Devnet.
          '@ | Set-Content -Path "$portableDir/LISEZ-MOI.txt" -Encoding UTF8

          Compress-Archive -Path "$portableDir/*" -DestinationPath 'release-assets/gpubnb-host-windows-x64-portable.zip' -Force
          $zip = Get-Item 'release-assets/gpubnb-host-windows-x64-portable.zip'
          if ($zip.Length -lt 262144) { throw "Windows ZIP is unexpectedly small: $($zip.Length) bytes." }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path 'release-assets/gpubnb-host-windows-x64-portable.zip.sha256' -Value "$hash  gpubnb-host-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish test release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish stable prerelease URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release-assets/gpubnb-host-windows-x64.exe
          test -s release-assets/gpubnb-host-windows-x64-portable.zip
          test -s release-assets/gpubnb-host-linux-x64.deb
          test -s release-assets/gpubnb-host-macos-arm64.dmg
          (cd release-assets && cat ./*.sha256 | sort -k2 > SHA256SUMS.txt)
          test "$(wc -l < release-assets/SHA256SUMS.txt)" -eq 4
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          VERSION_TAG="host-v0.2.0-beta.${GITHUB_RUN_NUMBER}"
          if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable release $VERSION_TAG already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GPUbnb Host v0.2.0-beta.${GITHUB_RUN_NUMBER}" \
            --notes "Préversion immuable Devnet construite depuis ${GITHUB_SHA}. Installateur Windows recommandé : gpubnb-host-windows-x64.exe (raccourci menu Démarrer, service Windows, désinstalleur). Une archive portable sans installation est aussi fournie. Les sommes SHA-256 sont publiées dans SHA256SUMS.txt." \
            --prerelease
          if gh release view host-test-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete host-test-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create host-test-latest release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GPUbnb Host — alias de $VERSION_TAG" \
            --notes "Alias mutable vers $VERSION_TAG. Version de test non signée destinée à valider la détection GPU, la liaison machine et le parcours de location sur Devnet. Installateur Windows recommandé : gpubnb-host-windows-x64.exe (raccourci menu Démarrer, service Windows, désinstalleur). gpubnb-host-windows-x64-portable.zip est un secours sans installation (extraire puis lancer GPUbnb-Host-Portable.exe). Ne pas utiliser en production." \
            --prerelease
