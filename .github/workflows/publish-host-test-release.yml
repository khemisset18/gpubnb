name: publish-host-test-release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/host-desktop/**'
      - 'agent/**'
      - 'services/edge/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/publish-host-test-release.yml'
      - 'scripts/verify-windows-release.ps1'
      - 'scripts/verify-windows-authenticode.ps1'
      - 'scripts/sign-windows-authenticode.ps1'

permissions:
  contents: read

concurrency:
  group: publish-host-test-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            bundle: nsis
            pattern: '*.exe'
            asset: gpubnb-host-windows-x64.exe
            tauri_config: '--config src-tauri/tauri.sidecar.conf.json'
          - os: ubuntu-24.04
            label: Linux x64
            bundle: deb
            pattern: '*.deb'
            asset: gpubnb-host-linux-x64.deb
            tauri_config: ''
          - os: macos-14
            label: macOS arm64
            bundle: dmg
            pattern: '*.dmg'
            asset: gpubnb-host-macos-arm64.dmg
            tauri_config: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/host-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Materialize bundle icon
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const source = 'apps/host-desktop/src-tauri/icons/icon.ico.base64';
          const target = 'apps/host-desktop/src-tauri/icons/icon.ico';
          const decoded = Buffer.from(fs.readFileSync(source, 'utf8').trim(), 'base64');
          if (decoded.length < 256) throw new Error('Invalid icon');
          fs.writeFileSync(target, decoded);
          NODE

      - name: Install locked dependencies
        working-directory: apps/host-desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build standalone Windows agent and Host tunnel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Stamp the real commit into the frozen exe BEFORE building it, so a
          # running agent can always report exactly what it was built from.
          $commit = $env:GITHUB_SHA.Substring(0, 12)
          Set-Content -Path agent/gpubnb_agent/_build_info.py -Encoding utf8 -Value @"
          `"`"`"Build metadata for this specific agent artifact - written by CI, see publish-host-test-release.yml.`"`"`"
          from __future__ import annotations

          BUILD_COMMIT = `"$commit`"
          "@
          python -m pip install --upgrade pip
          python -m pip install ./agent pyinstaller==6.16.0
          pyinstaller --clean --noconfirm --onefile --name gpubnb-agent --hidden-import=_cffi_backend --hidden-import=encodings.idna --hidden-import=servicemanager --hidden-import=win32event --hidden-import=win32service --hidden-import=win32serviceutil --hidden-import=win32timezone --hidden-import=urllib.request --collect-all cffi --collect-all nacl agent/gpubnb_agent/__main__.py
          if (-not (Test-Path dist/gpubnb-agent.exe)) { throw 'Standalone agent was not generated.' }
          $builtCommit = (& ./dist/gpubnb-agent.exe build-info | ConvertFrom-Json).buildCommit
          if ($builtCommit -ne $commit) { throw "Frozen exe reports buildCommit '$builtCommit', expected '$commit' - the commit stamp did not make it into the build." }
          cargo build --manifest-path services/edge/Cargo.toml --release --bin gpubnb-host-tunnel
          if (-not (Test-Path services/edge/target/release/gpubnb-host-tunnel.exe)) { throw 'Host tunnel sidecar was not generated.' }
          $target = (rustc -vV | Select-String '^host:' | ForEach-Object { ($_ -split ':', 2)[1].Trim() })
          if (-not $target) { throw 'Rust target triple could not be determined.' }
          New-Item -ItemType Directory -Force apps/host-desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/gpubnb-agent.exe "apps/host-desktop/src-tauri/binaries/gpubnb-agent-$target.exe"
          Copy-Item services/edge/target/release/gpubnb-host-tunnel.exe "apps/host-desktop/src-tauri/binaries/gpubnb-host-tunnel-$target.exe"
          & ./dist/gpubnb-agent.exe version
          if ($LASTEXITCODE -ne 0) { throw 'Standalone agent validation failed.' }
          & ./dist/gpubnb-agent.exe runtime-check
          if ($LASTEXITCODE -ne 0) { throw 'Standalone agent network runtime check failed.' }

      - name: Validate application
        working-directory: apps/host-desktop
        run: |
          npm run check
          npm run build

      - name: Validate native core
        shell: bash
        env:
          GPUBNB_WEB_BASE_URL: https://gpubnb.netlify.app
        run: |
          set -euo pipefail
          cargo fmt -p gpubnb-host-desktop -- --check
          cargo test --locked -p gpubnb-host-desktop --all-targets
          cargo clippy --locked -p gpubnb-host-desktop --all-targets -- -D warnings

      - name: Build test installer
        working-directory: apps/host-desktop
        shell: bash
        env:
          GPUBNB_RELEASE_CHANNEL: test
          GPUBNB_WEB_BASE_URL: https://gpubnb.netlify.app
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Tauri bundle attempt ${attempt}/3"
            if npm run tauri:build -- --bundles ${{ matrix.bundle }} ${{ matrix.tauri_config }}; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Tauri bundle failed after ${attempt} attempts." >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Stage predictable asset name
        shell: bash
        env:
          EXPECTED_PATTERN: ${{ matrix.pattern }}
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          bundle_dir='target/release/bundle'
          if [ ! -d "$bundle_dir" ]; then bundle_dir='apps/host-desktop/src-tauri/target/release/bundle'; fi
          source_file="$(find "$bundle_dir" -type f -name "$EXPECTED_PATTERN" | head -n 1)"
          test -n "$source_file"
          mkdir -p release-assets
          cp "$source_file" "release-assets/$ASSET_NAME"
          ASSET_PATH="release-assets/$ASSET_NAME" node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const file = process.env.ASSET_PATH;
          const hash = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          fs.writeFileSync(`${file}.sha256`, `${hash}  ${file.split('/').pop()}\n`);
          NODE

      - name: Smoke test exact Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1 -InstallerPath 'release-assets/gpubnb-host-windows-x64.exe' -ExpectedCommit "$env:GITHUB_SHA"

      - name: Create verified Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            'target/release/gpubnb-host-desktop.exe',
            'apps/host-desktop/src-tauri/target/release/gpubnb-host-desktop.exe'
          )
          $portable = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $portable) { throw 'Portable Windows executable was not produced.' }

          $bytes = [System.IO.File]::ReadAllBytes($portable)
          if ($bytes.Length -lt 262144) { throw "Portable executable is unexpectedly small: $($bytes.Length) bytes." }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Portable executable is not a valid Windows PE file (missing MZ header).' }

          $portableDir = 'windows-portable'
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item $portable "$portableDir/GPUbnb-Host-Portable.exe"
          if (-not (Test-Path 'dist/gpubnb-agent.exe')) { throw 'Windows agent sidecar is missing.' }
          if (-not (Test-Path 'services/edge/target/release/gpubnb-host-tunnel.exe')) { throw 'Windows Host tunnel sidecar is missing.' }
          Copy-Item 'dist/gpubnb-agent.exe' "$portableDir/gpubnb-agent.exe"
          Copy-Item 'services/edge/target/release/gpubnb-host-tunnel.exe' "$portableDir/gpubnb-host-tunnel.exe"
          @'
          GPUbnb Host — version portable Windows (sans installation)

          Pour une installation complète (raccourci menu Démarrer, service Windows,
          désinstalleur), utilisez plutôt gpubnb-host-windows-x64.exe.

          Cette archive portable est un secours sans installation :
          1. Extrayez entièrement cette archive ZIP.
          2. Lancez GPUbnb-Host-Portable.exe.

          Cette version est réservée aux tests sur Devnet.
          '@ | Set-Content -Path "$portableDir/LISEZ-MOI.txt" -Encoding UTF8

      - name: Sign Windows publication payloads when signing is required
        if: runner.os == 'Windows' && vars.GPUBNB_WINDOWS_SIGNING_REQUIRED == 'true'
        shell: pwsh
        env:
          GPUBNB_CODESIGN_THUMBPRINT: ${{ secrets.GPUBNB_CODESIGN_THUMBPRINT }}
          GPUBNB_CODESIGN_TIMESTAMP_URL: ${{ vars.GPUBNB_CODESIGN_TIMESTAMP_URL }}
        run: |
          $portableCandidates = @(
            'target/release/gpubnb-host-desktop.exe',
            'apps/host-desktop/src-tauri/target/release/gpubnb-host-desktop.exe'
          )
          $hostExe = $portableCandidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $hostExe) { throw 'codesign_host_exe_missing' }
          & ./scripts/sign-windows-authenticode.ps1 -Path @(
            'dist/gpubnb-agent.exe',
            'services/edge/target/release/gpubnb-host-tunnel.exe',
            $hostExe,
            'release-assets/gpubnb-host-windows-x64.exe'
          )

          # The portable archive must be assembled only after its embedded
          # executables have their final Authenticode bytes.
          Copy-Item $hostExe "$portableDir/GPUbnb-Host-Portable.exe" -Force
          Copy-Item 'dist/gpubnb-agent.exe' "$portableDir/gpubnb-agent.exe" -Force
          Copy-Item 'services/edge/target/release/gpubnb-host-tunnel.exe' "$portableDir/gpubnb-host-tunnel.exe" -Force

      - name: Finalize Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portableDir = 'windows-portable'
          Compress-Archive -Path "$portableDir/*" -DestinationPath 'release-assets/gpubnb-host-windows-x64-portable.zip' -Force
          $zip = Get-Item 'release-assets/gpubnb-host-windows-x64-portable.zip'
          if ($zip.Length -lt 262144) { throw "Windows ZIP is unexpectedly small: $($zip.Length) bytes." }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path 'release-assets/gpubnb-host-windows-x64-portable.zip.sha256' -Value "$hash  gpubnb-host-windows-x64-portable.zip"

      - name: Verify Windows Authenticode publication policy
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GPUBNB_WINDOWS_SIGNING_REQUIRED: ${{ vars.GPUBNB_WINDOWS_SIGNING_REQUIRED }}
        run: |
          $portableCandidates = @(
            'target/release/gpubnb-host-desktop.exe',
            'apps/host-desktop/src-tauri/target/release/gpubnb-host-desktop.exe'
          )
          $hostExe = $portableCandidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $hostExe) { throw 'authenticode_host_exe_missing' }
          $paths = @(
            'dist/gpubnb-agent.exe',
            'services/edge/target/release/gpubnb-host-tunnel.exe',
            $hostExe,
            'release-assets/gpubnb-host-windows-x64.exe'
          )
          $required = "$env:GPUBNB_WINDOWS_SIGNING_REQUIRED".Trim().ToLowerInvariant() -eq 'true'
          if ($required) {
            Write-Host 'Authenticode is REQUIRED for this publication run.'
            & ./scripts/verify-windows-authenticode.ps1 -Path $paths -Required
          } else {
            Write-Host 'Authenticode is not yet mandatory for this Devnet candidate; any present signature must still be valid.'
            & ./scripts/verify-windows-authenticode.ps1 -Path $paths
          }

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable test candidate
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Assemble binary checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/gpubnb-host-windows-x64.exe
          test -s release-assets/gpubnb-host-windows-x64-portable.zip
          test -s release-assets/gpubnb-host-linux-x64.deb
          test -s release-assets/gpubnb-host-macos-arm64.dmg
          (cd release-assets && cat ./*.sha256 | sort -k2 > ARTIFACTS_SHA256SUMS.txt)
          test "$(wc -l < release-assets/ARTIFACTS_SHA256SUMS.txt)" -eq 4
          (cd release-assets && sha256sum --check ARTIFACTS_SHA256SUMS.txt)

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize checksummed release manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/SBOM.spdx.json
          (
            cd release-assets
            {
              cat ARTIFACTS_SHA256SUMS.txt
              sha256sum SBOM.spdx.json
            } | sort -k2 > SHA256SUMS.txt
            test "$(wc -l < SHA256SUMS.txt)" -eq 5
            sha256sum --check SHA256SUMS.txt
          )

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: release-assets/SHA256SUMS.txt

      - name: Attest SBOM for executable release artifacts
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-checksums: release-assets/ARTIFACTS_SHA256SUMS.txt
          sbom-path: release-assets/SBOM.spdx.json

      - name: Publish immutable prerelease candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_TAG="host-v0.2.0-beta.${GITHUB_RUN_NUMBER}"
          if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable release $VERSION_TAG already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GPUbnb Host v0.2.0-beta.${GITHUB_RUN_NUMBER}" \
            --notes "CANDIDATE non promue. Préversion immuable Devnet construite depuis ${GITHUB_SHA}. Elle devient host-test-latest uniquement après vérification post-publication sur un runner Windows indépendant. SHA256SUMS.txt, SBOM SPDX et attestations Sigstore/GitHub sont générés avant publication." \
            --prerelease
