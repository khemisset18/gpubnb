name: codex-runtime-cleanliness-compat

on:
  push:
    branches:
      - codex/agent-runtime-cleanliness-diagnostic
    paths:
      - .github/workflows/codex-runtime-cleanliness-compat.yml
      - scripts/codex-runtime-cleanliness-compat.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/agent-runtime-cleanliness-diagnostic
      - run: python3 scripts/codex-runtime-cleanliness-compat.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/gpubnb_agent/cli.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(agent): preserve diagnostic rolling-deploy compatibility"
          git push origin HEAD:codex/agent-runtime-cleanliness-diagnostic
