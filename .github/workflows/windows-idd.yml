name: windows-idd-build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/windows-idd/**"
      - ".github/workflows/windows-idd.yml"
  push:
    branches:
      - "feat/windows-native-desktop-workspaces"
    paths:
      - "native/windows-idd/**"
      - ".github/workflows/windows-idd.yml"

permissions:
  contents: read

concurrency:
  group: windows-idd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify IddCx control ACL remains SYSTEM-only
        shell: pwsh
        run: |
          $inf = Get-Content native/windows-idd/GPUbnbIdd.inf -Raw
          if ($inf -notmatch 'HKR,,Security,,"D:P\(A;;GA;;;SY\)"') {
            throw "IddCx control device must remain SYSTEM-only"
          }
          foreach ($forbidden in @(';;;BA)', ';;;WD)', ';;;BU)', ';;;AU)')) {
            if ($inf.Contains($forbidden)) {
              throw "Forbidden IddCx control ACL principal: $forbidden"
            }
          }

      - name: Verify monitor mutation remains physically gated
        shell: pwsh
        run: |
          $driver = Get-Content native/windows-idd/Driver.cpp -Raw
          if ($driver -notmatch 'static constexpr bool GPUBNB_ENABLE_MONITOR_MUTATION = false;') {
            throw "IddCx monitor mutation gate must remain compile-time false before physical qualification"
          }
          if ($driver -match 'GPUBNB_ENABLE_MONITOR_MUTATION = true;') {
            throw "IddCx monitor mutation was enabled without physical qualification"
          }

      - name: Verify custom IOCTLs stay on the IddCx control path
        shell: pwsh
        run: |
          $driver = Get-Content native/windows-idd/Driver.cpp -Raw
          $header = Get-Content native/windows-idd/Driver.h -Raw
          if ($driver -notmatch 'EvtIddCxDeviceIoControl\s*=\s*GPUbnbEvtIddCxDeviceIoControl') {
            throw "GPUbnb control IOCTLs must be registered through IDD_CX_CLIENT_CONFIG"
          }
          if ($header -notmatch 'EVT_IDD_CX_DEVICE_IO_CONTROL\s+GPUbnbEvtIddCxDeviceIoControl') {
            throw "GPUbnb IddCx control callback declaration is missing"
          }
          if ($driver -match 'EvtIoDeviceControl\s*=') {
            throw "Do not route GPUbnb IddCx control IOCTLs through a default WDF queue"
          }

      - name: Verify VS2026 toolchain selected for WDK NuGet
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild).Source
          Write-Host "MSBuild: $msbuild"
          if ($msbuild -notmatch '\\Microsoft Visual Studio\\18\\') {
            throw "WDK 28000 requires the VS2026 (18.x) toolchain"
          }

      - name: Restore WDK NuGet packages
        shell: pwsh
        run: |
          msbuild native/windows-idd/GPUbnbIdd.vcxproj /t:Restore /p:Configuration=Release /p:Platform=x64 /warnAsError

      - name: Resolve WDK packaged build tools
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:USERPROFILE ".nuget\packages"
          $wdkX64Root = Join-Path $packageRoot "microsoft.windows.wdk.x64\10.0.28000.2526"
          $wdkX86Root = Join-Path $packageRoot "microsoft.windows.wdk.x86\10.0.28000.2526"
          $sdkX86Root = Join-Path $packageRoot "microsoft.windows.sdk.cpp.x86\10.0.28000.2526"
          foreach ($root in @($wdkX64Root, $wdkX86Root, $sdkX86Root)) {
            if (-not (Test-Path $root)) {
              throw "Restored WDK/SDK package root not found: $root"
            }
          }

          $stampInf = Get-ChildItem $wdkX64Root -Recurse -File -Filter stampinf.exe |
            Where-Object { $_.FullName -like "*\x64\stampinf.exe" } |
            Select-Object -First 1
          $preFast = Get-ChildItem $wdkX64Root -Recurse -File -Filter WindowsPrefast.dll |
            Where-Object { $_.FullName -like "*\x86\WindowsPrefast.dll" } |
            Select-Object -First 1
          $infVerif = Get-ChildItem -Path $wdkX64Root,$wdkX86Root -Recurse -File -Filter InfVerif.dll |
            Where-Object { $_.FullName -like "*\x86\InfVerif.dll" } |
            Select-Object -First 1
          foreach ($tool in @($stampInf, $preFast, $infVerif)) {
            if (-not $tool) {
              throw "Required WDK host tool was not restored"
            }
            Write-Host "WDK tool: $($tool.FullName)"
          }

          # WDK verification and PREfast are x86-hosted even for an x64 target.
          # Keep the x64 build targets authoritative, but expose matching x86 WDK
          # and SDK DLL directories so host-tool dependency loading is complete.
          $hostToolDirs = @(
            $stampInf.DirectoryName,
            $preFast.DirectoryName,
            $infVerif.DirectoryName
          )
          foreach ($root in @($wdkX86Root, $sdkX86Root)) {
            $hostToolDirs += (
              Get-ChildItem $root -Recurse -Directory -Filter x86 |
                Where-Object { $_.FullName -like "*\bin\*\x86" } |
                ForEach-Object { $_.FullName }
            )
          }
          $hostToolDirs = $hostToolDirs |
            Where-Object { $_ -and (Test-Path $_) } |
            Sort-Object -Unique
          if ($hostToolDirs.Count -lt 3) {
            throw "Incomplete x86 host-tool dependency path set"
          }
          foreach ($dir in $hostToolDirs) {
            Write-Host "WDK host dependency path: $dir"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }

          # InfVerif's managed wrapper loads "x86\InfVerif.dll" relative to the
          # process working directory. Use the concrete package bin root that
          # actually contains the restored DLL instead of guessing from PATH.
          $hostBinRoot = Split-Path $infVerif.DirectoryName -Parent
          if (-not (Test-Path (Join-Path $hostBinRoot "x86\InfVerif.dll"))) {
            throw "Resolved InfVerif host root is incoherent: $hostBinRoot"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "GPUBNB_WDK_BIN_ROOT=$hostBinRoot"

      - name: Build inert IddCx driver
        shell: pwsh
        run: |
          where.exe stampinf.exe
          $project = (Resolve-Path native/windows-idd/GPUbnbIdd.vcxproj).Path
          if (-not $env:GPUBNB_WDK_BIN_ROOT) {
            throw "WDK binary root was not exported"
          }
          Push-Location $env:GPUBNB_WDK_BIN_ROOT
          try {
            msbuild $project /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /warnAsError
          } finally {
            Pop-Location
          }

      - name: Verify build produced driver package inputs
        shell: pwsh
        run: |
          $dll = Get-ChildItem native/windows-idd -Recurse -Filter GPUbnbIdd.dll | Select-Object -First 1
          if (-not $dll) { throw "GPUbnbIdd.dll was not produced" }
          if (-not (Test-Path native/windows-idd/GPUbnbIdd.inf)) { throw "GPUbnbIdd.inf missing" }
          Write-Host "Built inert IddCx DLL: $($dll.FullName)"
          Write-Host "Driver remains non-installing and non-promotable in CI."
