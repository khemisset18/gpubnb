name: windows-idd-build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/windows-idd/**"
      - "native/windows-idd-installer/**"
      - ".github/workflows/windows-idd.yml"
  push:
    branches:
      - "feat/windows-native-desktop-workspaces"
    paths:
      - "native/windows-idd/**"
      - "native/windows-idd-installer/**"
      - ".github/workflows/windows-idd.yml"

permissions:
  contents: read

concurrency:
  group: windows-idd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure x64 MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - name: Verify IddCx control ACL remains SYSTEM-only
        shell: pwsh
        run: |
          $inf = Get-Content native/windows-idd/GPUbnbIdd.inf -Raw
          if ($inf -notmatch 'HKR,,Security,,"D:P\(A;;GA;;;SY\)"') {
            throw "IddCx control device must remain SYSTEM-only"
          }
          foreach ($forbidden in @(';;;BA)', ';;;WD)', ';;;BU)', ';;;AU)')) {
            if ($inf.Contains($forbidden)) {
              throw "Forbidden IddCx control ACL principal: $forbidden"
            }
          }

      - name: Verify monitor mutation remains explicitly gated
        shell: pwsh
        run: |
          $driver = Get-Content native/windows-idd/Driver.cpp -Raw
          $project = Get-Content native/windows-idd/GPUbnbIdd.vcxproj -Raw
          if ($driver -notmatch 'GPUBNB_PHYSICAL_QUALIFICATION_BUILD == 1') {
            throw "IddCx monitor mutation must retain the physical qualification authority"
          }
          if ($driver -notmatch 'GPUBNB_RELEASE_CANDIDATE_BUILD == 1') {
            throw "IddCx monitor mutation must retain the distinct release-candidate authority"
          }
          if ($driver -notmatch 'mutually exclusive') {
            throw "IddCx mutation authorities must remain mutually exclusive"
          }
          if ($project -notmatch '<PhysicalQualificationBuild Condition=.*>false</PhysicalQualificationBuild>') {
            throw "The IddCx project must default physical qualification builds to false"
          }
          if ($project -notmatch '<ReleaseCandidateBuild Condition=.*>false</ReleaseCandidateBuild>') {
            throw "The IddCx project must default release-candidate builds to false"
          }
          if ($project -notmatch 'GPUBNB_PHYSICAL_QUALIFICATION_BUILD=0' -or
              $project -notmatch 'GPUBNB_RELEASE_CANDIDATE_BUILD=0') {
            throw "Default IddCx builds must compile every mutation authority disabled"
          }

      - name: Verify exact leased GPU is the preferred IddCx render adapter
        shell: pwsh
        run: |
          $driver = Get-Content native/windows-idd/Driver.cpp -Raw
          if ($driver -notmatch 'PreferredRenderAdapter\s*=\s*request->RenderAdapterLuid') {
            throw "IddCx monitor arrival must prefer the exact leased render-adapter LUID"
          }
          if ($driver -notmatch 'IddCxAdapterSetRenderAdapter\(deviceContext->Adapter') {
            throw "IddCx render-adapter preference is not applied before monitor use"
          }
          if ($driver -notmatch 'input->RenderAdapterLuid, context->RenderAdapterLuid') {
            throw "Swapchain assignment must still reject an OS-selected wrong GPU"
          }

      - name: Verify custom IOCTLs stay on the IddCx control path
        shell: pwsh
        run: |
          $driver = Get-Content native/windows-idd/Driver.cpp -Raw
          $header = Get-Content native/windows-idd/Driver.h -Raw
          if ($driver -notmatch 'EvtIddCxDeviceIoControl\s*=\s*GPUbnbEvtIddCxDeviceIoControl') {
            throw "GPUbnb control IOCTLs must be registered through IDD_CX_CLIENT_CONFIG"
          }
          if ($header -notmatch 'EVT_IDD_CX_DEVICE_IO_CONTROL\s+GPUbnbEvtIddCxDeviceIoControl') {
            throw "GPUbnb IddCx control callback declaration is missing"
          }
          if ($driver -match 'EvtIoDeviceControl\s*=') {
            throw "Do not route GPUbnb IddCx control IOCTLs through a default WDF queue"
          }

      - name: Verify crash cleanup and absence proof stay fail-closed
        shell: pwsh
        run: |
          $driver = Get-Content native/windows-idd/Driver.cpp -Raw
          $protocol = Get-Content native/windows-idd/ControlProtocol.h -Raw
          if ($driver -notmatch 'GPUbnbFileCleanup') {
            throw "IddCx owner-file cleanup callback is required"
          }
          if ($driver -notmatch 'MonitorOwnerFile\s*!=\s*fileObject') {
            throw "IddCx cleanup must remain bound to the exact owner file"
          }
          if ($protocol -notmatch 'AssertNoMonitor\s*=\s*4u') {
            throw "Read-only IddCx absence proof operation is missing"
          }
          if ($driver -notmatch 'GPUbnbIddControlOperation::AssertNoMonitor') {
            throw "Driver must implement the read-only IddCx absence proof"
          }
          if ($driver -notmatch 'context->Monitor\s*==\s*nullptr') {
            throw "IddCx absence proof must require no active GPUbnb monitor"
          }

      - name: Verify VS2026 x64 toolchain
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild).Source
          Write-Host "MSBuild: $msbuild"
          if ($msbuild -notmatch '\\Microsoft Visual Studio\\18\\') {
            throw "WDK 28000 requires the VS2026 (18.x) toolchain"
          }
          if ($msbuild -notmatch '\\MSBuild\\Current\\Bin\\amd64\\MSBuild\.exe$') {
            throw "WDK 28000 CI must use the x64 MSBuild host"
          }

      - name: Verify root-device installer is narrowly scoped
        shell: pwsh
        run: |
          $source = Get-Content native/windows-idd-installer/main.cpp -Raw
          foreach ($required in @(
            'Root\\GPUbnbVirtualDisplay',
            'GPUbnbIdd.inf',
            'DIF_REGISTERDEVICE',
            'UpdateDriverForPlugAndPlayDevicesW',
            'INSTALLFLAG_NONINTERACTIVE'
          )) {
            if ($source -notmatch [regex]::Escape($required)) {
              throw "IDD installer is missing required bounded contract: $required"
            }
          }
          if ($source -match 'INSTALLFLAG_FORCE') {
            throw 'Production IDD installer must not force a driver downgrade.'
          }
          if ($source -match 'argv\[.+HardwareId') {
            throw 'Production IDD installer must not accept an arbitrary hardware ID.'
          }

      - name: Restore WDK NuGet packages
        shell: pwsh
        run: |
          msbuild native/windows-idd/GPUbnbIdd.vcxproj /t:Restore /p:Configuration=Release /p:Platform=x64 /warnAsError
          msbuild native/windows-idd-installer/GPUbnbIddInstaller.vcxproj /t:Restore /p:Configuration=Release /p:Platform=x64 /warnAsError

      - name: Build bounded IddCx root-device installer
        shell: pwsh
        run: |
          msbuild native/windows-idd-installer/GPUbnbIddInstaller.vcxproj /m /p:Configuration=Release /p:Platform=x64 /warnAsError
          $installer = Get-ChildItem native/windows-idd-installer -Recurse -Filter GPUbnbIddInstaller.exe -File | Select-Object -First 1
          if (-not $installer) { throw 'GPUbnbIddInstaller.exe was not produced.' }
          Write-Host "Built bounded IDD installer: $($installer.FullName)"

      - name: Verify restored x64 WDK toolchain
        shell: pwsh
        run: |
          $wdkRoot = Join-Path $env:USERPROFILE ".nuget\packages\microsoft.windows.wdk.x64\10.0.28000.2526"
          $sdkRoot = Join-Path $env:USERPROFILE ".nuget\packages\microsoft.windows.sdk.cpp.x64\10.0.28000.2526"
          foreach ($root in @($wdkRoot, $sdkRoot)) {
            if (-not (Test-Path $root)) {
              throw "Restored package root not found: $root"
            }
          }
          $stampInf = Get-ChildItem $wdkRoot -Recurse -File -Filter stampinf.exe |
            Where-Object { $_.FullName -like "*\x64\stampinf.exe" } |
            Select-Object -First 1
          if (-not $stampInf) {
            throw "x64 stampinf.exe not found in restored WDK package"
          }
          Write-Host "x64 stampinf.exe: $($stampInf.FullName)"

      - name: Build inert IddCx driver
        shell: pwsh
        run: |
          msbuild native/windows-idd/GPUbnbIdd.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /warnAsError

      - name: Compile qualification-only IddCx variant
        shell: pwsh
        run: |
          msbuild native/windows-idd/GPUbnbIdd.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:PhysicalQualificationBuild=true /warnAsError
          Write-Host "Qualification variant compiled only. CI does not install, sign, upload, or promote it."

      - name: Compile Stage 4 release-candidate IddCx variant
        shell: pwsh
        run: |
          msbuild native/windows-idd/GPUbnbIdd.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:ReleaseCandidateBuild=true /warnAsError
          Write-Host "Stage 4 release-candidate variant compiled only. CI does not install, sign, upload, or promote it."

      - name: Reject ambiguous dual-authority IddCx build
        shell: pwsh
        run: |
          msbuild native/windows-idd/GPUbnbIdd.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:PhysicalQualificationBuild=true /p:ReleaseCandidateBuild=true /warnAsError
          if ($LASTEXITCODE -eq 0) {
            throw "IddCx must reject a build with both mutation authorities enabled"
          }
          Write-Host "Dual-authority build correctly failed closed."
          exit 0

      - name: Verify build produced driver package inputs
        shell: pwsh
        run: |
          $dll = Get-ChildItem native/windows-idd -Recurse -Filter GPUbnbIdd.dll | Select-Object -First 1
          if (-not $dll) { throw "GPUbnbIdd.dll was not produced" }
          if (-not (Test-Path native/windows-idd/GPUbnbIdd.inf)) { throw "GPUbnbIdd.inf missing" }
          Write-Host "Built inert IddCx DLL: $($dll.FullName)"
          Write-Host "Driver remains non-installing and non-promotable in CI."
