name: post-publish-host-windows-verify

on:
  workflow_run:
    workflows:
      - publish-host-test-release
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: post-publish-host-windows-verify
  cancel-in-progress: false

jobs:
  verify-published-windows:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Checkout exact published commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download exact immutable release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: host-v0.2.0-beta.${{ github.event.workflow_run.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force published-release | Out-Null
          gh release download $env:VERSION_TAG --repo $env:GITHUB_REPOSITORY --dir published-release --pattern 'gpubnb-host-windows-x64.exe' --pattern 'SHA256SUMS.txt'
          if (-not (Test-Path 'published-release/gpubnb-host-windows-x64.exe' -PathType Leaf)) {
            throw 'Published Windows installer was not downloaded.'
          }
          if (-not (Test-Path 'published-release/SHA256SUMS.txt' -PathType Leaf)) {
            throw 'Published SHA256SUMS.txt was not downloaded.'
          }

      - name: Verify published installer checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sumLine = Get-Content 'published-release/SHA256SUMS.txt' | Where-Object { $_ -match '\s+gpubnb-host-windows-x64\.exe$' } | Select-Object -First 1
          if (-not $sumLine) { throw 'SHA256SUMS.txt does not contain the Windows installer.' }
          $expected = ($sumLine -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash 'published-release/gpubnb-host-windows-x64.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Published Windows installer checksum mismatch: expected $expected, got $actual"
          }
          Write-Host "Published Windows installer SHA-256 verified: $actual"

      - name: Install, exercise service, and uninstall published Windows release
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1 -InstallerPath 'published-release/gpubnb-host-windows-x64.exe'

      - name: Quarantine mutable alias when published Windows smoke fails
        if: steps.smoke.outcome != 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $alias = gh release view host-test-latest --repo $env:GITHUB_REPOSITORY --json targetCommitish 2>$null | ConvertFrom-Json
          if ($alias -and $alias.targetCommitish -eq $env:EXPECTED_SHA) {
            Write-Host 'Removing host-test-latest because the published Windows artifact failed post-publication smoke.'
            gh release delete host-test-latest --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          } else {
            Write-Host 'Alias no longer points to this commit; leaving it untouched.'
          }

      - name: Enforce published Windows smoke result
        if: steps.smoke.outcome != 'success'
        shell: pwsh
        run: throw 'Published Windows release failed installation/service/uninstall verification and has been quarantined.'
