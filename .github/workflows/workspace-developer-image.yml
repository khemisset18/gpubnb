name: Developer Workspace image
on:
  push:
    branches: [main]
    paths:
      - "workspaces/developer/**"
      - ".github/workflows/workspace-developer-image.yml"
  pull_request:
    paths:
      - "workspaces/developer/**"
      - ".github/workflows/workspace-developer-image.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build immutable candidate
        run: docker build --pull=false --tag gpubnb-developer:candidate workspaces/developer
      - name: Verify tools and non-root execution
        run: docker run --rm --entrypoint /usr/local/bin/gpubnb-developer-healthcheck gpubnb-developer:candidate
      - name: Verify hardened code-server startup
        run: bash workspaces/developer/runtime-smoke-test.sh gpubnb-developer:candidate
      - name: Scan high and critical vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/report" \
            aquasec/trivy:0.66.0 image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output /report/trivy-developer.json \
            gpubnb-developer:candidate
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("trivy-developer.json").read_text(encoding="utf-8"))
          findings = []
          for result in report.get("Results") or []:
              for item in result.get("Vulnerabilities") or []:
                  findings.append({
                      "target": result.get("Target"),
                      "package": item.get("PkgName"),
                      "path": item.get("PkgPath"),
                      "id": item.get("VulnerabilityID"),
                      "severity": item.get("Severity"),
                      "installed": item.get("InstalledVersion"),
                      "fixed": item.get("FixedVersion"),
                  })
          print(json.dumps({"blockingCount": len(findings), "findings": findings}, indent=2))
          raise SystemExit(1 if findings else 0)
          PY
      - name: Upload Developer Workspace Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-developer-workspace
          path: trivy-developer.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish commit-addressed image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${{ github.repository_owner }}/gpubnb-developer:${{ github.sha }}"
          docker tag gpubnb-developer:candidate "$IMAGE"
          docker push "$IMAGE"
          docker inspect --format='Published {{index .RepoDigests 0}}' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
