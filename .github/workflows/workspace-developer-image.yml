name: Developer Workspace image
on:
  push:
    branches: [main]
    paths:
      - "workspaces/developer/**"
      - ".github/workflows/workspace-developer-image.yml"
  pull_request:
    paths:
      - "workspaces/developer/**"
      - ".github/workflows/workspace-developer-image.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build immutable candidate
        run: docker build --pull=false --tag gpubnb-developer:candidate workspaces/developer
      - name: Verify tools and non-root execution
        run: docker run --rm --entrypoint /usr/local/bin/gpubnb-developer-healthcheck gpubnb-developer:candidate
      - name: Scan high and critical vulnerabilities
        run: docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed gpubnb-developer:candidate
      - name: Publish commit-addressed image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${{ github.repository_owner }}/gpubnb-developer:${{ github.sha }}"
          docker tag gpubnb-developer:candidate "$IMAGE"
          docker push "$IMAGE"
          docker inspect --format='Published {{index .RepoDigests 0}}' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
