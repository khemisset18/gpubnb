name: codex-agent-sequence-bound-patch

on:
  push:
    branches:
      - codex/agent-resume-state-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/agent-resume-state-boundary
      - name: Bound command sequence before execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('agent/gpubnb_agent/control_channel.py')
          text = path.read_text()

          replacements = [
              (
                  'RESULT_CACHE_SIZE = 64\nID_RE =',
                  'RESULT_CACHE_SIZE = 64\nMAX_SEQUENCE = 9_223_372_036_854_775_807\nID_RE =',
              ),
              (
                  '    if isinstance(sequence, bool) or not isinstance(sequence, int) or sequence <= 0:\n        raise ControlChannelError("control_command_sequence_invalid")',
                  '    if isinstance(sequence, bool) or not isinstance(sequence, int) or not 0 < sequence <= MAX_SEQUENCE:\n        raise ControlChannelError("control_command_sequence_invalid")',
              ),
              (
                  'MAX_SEQUENCE = 9_223_372_036_854_775_807\nCONTROL_STATE_KEYS = {"schemaVersion", "lastAckedCommandSequence", "terminalResults"}\nCONTROL_RESULT_KEYS =',
                  'CONTROL_RESULT_KEYS =',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guarded replacement expected once, found {count}: {old[:60]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit guarded sequence bound
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/gpubnb_agent/control_channel.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(agent): reject out-of-range control sequences before execution"
          git push origin HEAD:codex/agent-resume-state-boundary
