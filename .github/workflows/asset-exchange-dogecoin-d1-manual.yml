name: Asset Exchange Dogecoin D1 Explicitly Authorized Isolated Regtest

# One-time branch/path-scoped execution under the owner's explicit D1 approval.
# workflow_dispatch requires the workflow on the default branch, which may not
# be changed. The exact commit-message guard below admits only this authorized
# execution commit. Restore dispatch-only after preserving the result.
on:
  push:
    branches: [asset-exchange/security-gates-d1-prep-20261029]
    paths: ['.github/workflows/asset-exchange-dogecoin-d1-manual.yml']
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Explicit D1 binary-execution approval: AUTHORIZE_D1_ISOLATED_REGTEST'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  network-identity:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.authorization == 'AUTHORIZE_D1_ISOLATED_REGTEST') ||
      (github.event_name == 'push' && github.repository == 'khemisset18/gpubnb' &&
       github.ref == 'refs/heads/asset-exchange/security-gates-d1-prep-20261029' &&
       github.event.head_commit.message == 'test(doge): retain authorized D1 evidence without exposing private state 20261029')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require distinct D1 approval
        env:
          D1_AUTHORIZATION: ${{ github.event_name == 'push' && 'AUTHORIZE_D1_ISOLATED_REGTEST' || inputs.authorization }}
        run: test "$D1_AUTHORIZATION" = AUTHORIZE_D1_ISOLATED_REGTEST
      - name: Checkout prepared D1 harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline adversarial D1 tests
        run: python3 -m unittest discover -s asset-exchange/qualification/dogecoin/d1 -p 'test_*.py' -v
      - name: Download the already qualified D0 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogecoin-d0-verified-evidence-99724d5b66b9475dcb96f6c471c75ce01ed60f9a
          run-id: 40866305437
          github-token: ${{ github.token }}
          path: dist/doge-d0-verified
      - name: Verify signatures, isolate networking, and qualify D1 identity only
        env:
          D1_AUTHORIZATION: ${{ github.event_name == 'push' && 'AUTHORIZE_D1_ISOLATED_REGTEST' || inputs.authorization }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          bash asset-exchange/qualification/dogecoin/d1/run-isolated.sh \
            "$GITHUB_WORKSPACE/dist/doge-d0-verified" "$RUNNER_TEMP/doge-d1" "$D1_AUTHORIZATION"
      - name: Retain D1 evidence without wallet or cookie data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogecoin-d1-network-identity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/doge-d1/verification/
            ${{ runner.temp }}/doge-d1/regtest-run/evidence/
          if-no-files-found: error
          retention-days: 30
