name: codex-artifact-storage-patch

on:
  push:
    branches:
      - codex/artifact-storage-foundation
    paths:
      - .github/workflows/codex-artifact-storage-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/artifact-storage-foundation
      - name: Apply guarded artifact storage wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/server.ts')
          text = path.read_text()

          replacements = [
            (
              "import Fastify from 'fastify'; import helmet from '@fastify/helmet'; import rateLimit from '@fastify/rate-limit'; import cookie from '@fastify/cookie'; import fastifyStatic from '@fastify/static'; import path from 'node:path'; import fs from 'node:fs'; import fsp from 'node:fs/promises'; import { Transform } from 'node:stream';",
              "import Fastify from 'fastify'; import helmet from '@fastify/helmet'; import rateLimit from '@fastify/rate-limit'; import cookie from '@fastify/cookie'; import fastifyStatic from '@fastify/static'; import path from 'node:path'; import { Transform } from 'node:stream';",
            ),
            (
              "import { enterQuarantine } from './quarantine-service.js';",
              "import { enterQuarantine } from './quarantine-service.js';\nimport { FilesystemArtifactStorage } from './artifact-storage.js';",
            ),
            (
              "const storageDir=path.resolve(config.FILE_STORAGE_DIR);fs.mkdirSync(storageDir,{recursive:true});",
              "const artifactStorage=new FilesystemArtifactStorage(config.FILE_STORAGE_DIR);",
            ),
            (
              "kind:z.string().max(32).default('result')",
              "kind:z.string().regex(/^[A-Za-z0-9._-]{1,32}$/).default('result')",
            ),
            (
              "const storageKey=`${id}/${body.kind}/${body.sha256}`;const filePath=path.join(storageDir,storageKey);await fsp.mkdir(path.dirname(filePath),{recursive:true});await fsp.writeFile(filePath,buf);",
              "const storageKey=await artifactStorage.write(id,body.kind,body.sha256,buf);",
            ),
            (
              "const filePath=path.join(storageDir,artifact.storageKey);try{const data=await fsp.readFile(filePath);reply.header('content-type','application/octet-stream');reply.header('x-artifact-sha256',artifact.sha256);return reply.send(data);}catch{return reply.code(404).send({error:'file_not_found_on_disk'});}",
              "try{const data=await artifactStorage.read(artifact.storageKey);reply.header('content-type','application/octet-stream');reply.header('x-artifact-sha256',artifact.sha256);return reply.send(data);}catch(err){if(typeof err==='object'&&err&&'code'in err&&(err as {code?:string}).code==='ENOENT')return reply.code(404).send({error:'artifact_not_found_in_storage'});throw err;}",
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'guarded replacement expected exactly 1 match, found {count}: {old[:100]}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit artifact storage wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(storage): confine artifact paths behind storage backend"
          git push origin HEAD:codex/artifact-storage-foundation
