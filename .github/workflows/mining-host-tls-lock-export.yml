name: mining-host-tls-lock-export

on:
  pull_request:
    paths:
      - 'apps/host-desktop/src-tauri/Cargo.toml'
      - '.github/workflows/mining-host-tls-lock-export.yml'

# Temporary read-only lock export; removed before final qualification.
permissions:
  contents: read

jobs:
  resolve-lock:
    if: github.head_ref == 'feat/mining-host-stratum-tls-verification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Resolve portable Host TLS test dependencies
        run: cargo check -p gpubnb-host-desktop --tests
      - name: Emit Cargo.lock generated by Cargo
        shell: bash
        run: |
          set -euo pipefail
          echo 'GPUBNB_CARGO_LOCK_BASE64_BEGIN'
          python3 - <<'PY'
          import base64
          from pathlib import Path
          encoded = base64.b64encode(Path("Cargo.lock").read_bytes()).decode("ascii")
          for offset in range(0, len(encoded), 4096):
              print(encoded[offset:offset + 4096])
          PY
          echo 'GPUBNB_CARGO_LOCK_BASE64_END'
      - name: Upload Cargo.lock generated by Cargo
        uses: actions/upload-artifact@v6
        with:
          name: mining-host-tls-portable-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
