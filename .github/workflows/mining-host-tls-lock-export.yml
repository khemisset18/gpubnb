name: mining-host-tls-lock-export

on:
  pull_request:
    paths:
      - 'apps/host-desktop/src-tauri/Cargo.toml'
      - '.github/workflows/mining-host-tls-lock-export.yml'

permissions:
  contents: read

jobs:
  resolve-lock:
    if: github.head_ref == 'feat/mining-host-stratum-tls-verification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Resolve portable Host TLS test dependencies
        run: cargo check -p gpubnb-host-desktop --tests
      - name: Upload Cargo.lock generated by Cargo
        uses: actions/upload-artifact@v6
        with:
          name: mining-host-tls-portable-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
