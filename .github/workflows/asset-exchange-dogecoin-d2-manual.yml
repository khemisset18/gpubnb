name: Asset Exchange DOGE D2 Authorized Script Diagnostics

# Diagnostics are not full D2 qualification. The final qualification gate remains
# blocking until the frozen D2 criteria are actually demonstrated.
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'D2 only: AUTHORIZE_D2_SCRIPT_DIAGNOSTICS'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  script-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require owner-authorized D2 scope
        env:
          D2_AUTHORIZATION: ${{ inputs.authorization }}
        run: test "$D2_AUTHORIZATION" = AUTHORIZE_D2_SCRIPT_DIAGNOSTICS
      - name: Checkout reviewed D2 harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline D2 adversarial tests and shell syntax
        run: |
          bash -n asset-exchange/qualification/dogecoin/d2/run-isolated.sh
          python3 -m unittest discover -s asset-exchange/qualification/dogecoin/d2 -p 'test_*.py' -v
      - name: Download only the already qualified D0 archive and attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogecoin-d0-verified-evidence-99724d5b66b9475dcb96f6c471c75ce01ed60f9a
          run-id: 40866305437
          github-token: ${{ github.token }}
          path: dist/doge-d0-verified
      - name: Revalidate provenance then execute only isolated D2 diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          D2_AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          bash asset-exchange/qualification/dogecoin/d2/run-isolated.sh \
            "$GITHUB_WORKSPACE/dist/doge-d0-verified" "$RUNNER_TEMP/doge-d2" "$D2_AUTHORIZATION"
      - name: Retain nonsecret D2 evidence including FAIL or BLOCKED
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogecoin-d2-script-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/doge-d2/verification/
            ${{ runner.temp }}/doge-d2/regtest-run/evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce full D2 qualification without promoting diagnostic success
        run: |
          python3 - "$RUNNER_TEMP/doge-d2/regtest-run/evidence/d2-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print(json.dumps({key: report[key] for key in ('diagnosticStatus', 'qualificationStatus', 'blockingCriteria')}, indent=2))
          if report['diagnosticStatus'] != 'PASS' or report['qualificationStatus'] != 'PASS':
              raise SystemExit('D2 qualification BLOCKED: diagnostics alone cannot satisfy the frozen criteria')
          PY
