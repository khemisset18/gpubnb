name: patch-data-plane-qualification-temp

on:
  push:
    branches:
      - hardening/data-plane-production-qualification
    paths:
      - '.github/workflows/patch-data-plane-qualification-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/data-plane-production-qualification
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Apply exact Edge instrumentation patch
        run: python scripts/patch-edge-qualification-temp.py
      - name: Canonical format and validate Edge
        run: |
          set -euo pipefail
          cargo fmt --manifest-path services/edge/Cargo.toml
          cargo test --manifest-path services/edge/Cargo.toml --all-targets
          cargo clippy --manifest-path services/edge/Cargo.toml --all-targets -- -D warnings
          git diff --check
      - name: Commit validated patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/edge/src/bin/gpubnb-edge.rs services/edge/src/lib.rs services/edge/src/transport.rs services/edge/Cargo.toml
          git commit -m 'hardening(edge): enforce and expose transport qualification budgets'
          git push origin HEAD:hardening/data-plane-production-qualification
