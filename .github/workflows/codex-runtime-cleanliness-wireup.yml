name: codex-runtime-cleanliness-wireup

on:
  push:
    branches:
      - codex/agent-runtime-cleanliness-diagnostic
    paths:
      - .github/workflows/codex-runtime-cleanliness-wireup.yml
      - scripts/codex-runtime-cleanliness-wireup.py

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/agent-runtime-cleanliness-diagnostic
      - name: Apply guarded runtime cleanliness patch
        run: python3 scripts/codex-runtime-cleanliness-wireup.py
      - name: Commit guarded runtime cleanliness wireup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/gpubnb_agent/cli.py apps/api/src/machine-diagnostics-routes.ts apps/api/src/diagnostic-run-service.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(diagnostics): require clean Host runtime before unquarantine"
          git push origin HEAD:codex/agent-runtime-cleanliness-diagnostic
