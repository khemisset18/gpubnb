name: Apply accelerator integration

on:
  push:
    branches:
      - codex/step-2-hardware-metrics
    paths:
      - scripts/apply-accelerator-server-integration.mjs
      - .github/workflows/apply-accelerator-integration.yml

permissions:
  contents: write

jobs:
  patch-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/step-2-hardware-metrics
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply guarded source patch
        run: node scripts/apply-accelerator-server-integration.mjs
      - name: Verify expected integration
        run: |
          grep -q "verifyAgentRequestV2" apps/api/src/server.ts
          grep -q "processAcceleratorHeartbeat" apps/api/src/server.ts
          grep -q "accelerators/manage" apps/api/src/server.ts
          git diff --check
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "Server already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts
          git commit -m "feat(api): wire signed accelerator heartbeat and views"
          git push origin HEAD:codex/step-2-hardware-metrics
