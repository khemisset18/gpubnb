name: Stage 4 private PC1 signing-copy preflight
on:
  push:
    branches:
      - prep/stage4-private-pc1-staging-20261016
    paths:
      - scripts/stage4-private-test-sign-copies.ps1
      - scripts/tests/stage4-private-test-sign-copies.tests.ps1
      - .github/workflows/stage4-private-pc1-staging.yml
  pull_request:
    paths:
      - scripts/stage4-private-test-sign-copies.ps1
      - scripts/tests/stage4-private-test-sign-copies.tests.ps1
      - .github/workflows/stage4-private-pc1-staging.yml
permissions:
  contents: read
concurrency:
  group: stage4-private-pc1-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-preflight-only:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: PowerShell 5.1 negative-only checks
        shell: powershell
        run: |
          & ./scripts/tests/stage4-private-test-sign-copies.tests.ps1
          if (-not $?) { throw 'private_pc1_preflight_powershell_failed' }
      - name: PowerShell 7 negative-only checks
        shell: pwsh
        run: |
          & ./scripts/tests/stage4-private-test-sign-copies.tests.ps1
          if (-not $?) { throw 'private_pc1_preflight_pwsh_failed' }
      # Intentionally no certificate, signing secret, artifact, install or deploy.
