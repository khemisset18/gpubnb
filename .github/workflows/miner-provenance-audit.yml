name: miner-provenance-audit

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/miner-provenance-audit.yml

permissions:
  contents: read

jobs:
  audit-lolminer:
    name: Verify pinned lolMiner release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official release archives
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3             --output lolMiner_v1.98a_Win64.zip             https://github.com/Lolliedieb/lolMiner-releases/releases/download/1.98a/lolMiner_v1.98a_Win64.zip
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3             --output lolMiner_v1.98a_Lin64.tar.gz             https://github.com/Lolliedieb/lolMiner-releases/releases/download/1.98a/lolMiner_v1.98a_Lin64.tar.gz

      - name: Verify published archive digests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n'             f2bbda2d2255155d50935967b8c55105b9aeefbd27cda3e8d01beaf535a16762             lolMiner_v1.98a_Win64.zip             0b8078299654a12846e4967f1db3506409cfb8b1031687a910965d1a99c6f270             lolMiner_v1.98a_Lin64.tar.gz | sha256sum --check --strict

      - name: Extract only the uniquely named miner binaries
        shell: bash
        run: |
          set -euo pipefail
          win_entry="$(unzip -Z1 lolMiner_v1.98a_Win64.zip | awk 'BEGIN { count=0 } /(^|\/)lolMiner\.exe$/ { entry=$0; count++ } END { if (count != 1) exit 1; print entry }')"
          linux_entry="$(tar -tzf lolMiner_v1.98a_Lin64.tar.gz | awk 'BEGIN { count=0 } /(^|\/)lolMiner$/ { entry=$0; count++ } END { if (count != 1) exit 1; print entry }')"
          case "$win_entry" in /*|*../*|../*) exit 1;; esac
          case "$linux_entry" in /*|*../*|../*) exit 1;; esac
          unzip -p lolMiner_v1.98a_Win64.zip "$win_entry" > lolMiner.exe
          tar -xOzf lolMiner_v1.98a_Lin64.tar.gz "$linux_entry" > lolMiner
          test -s lolMiner.exe
          test -s lolMiner

      - name: Produce immutable provenance report
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'lolMiner release: 1.98a\n'
            printf 'source: https://github.com/Lolliedieb/lolMiner-releases/releases/tag/1.98a\n'
            sha256sum lolMiner_v1.98a_Win64.zip
            sha256sum lolMiner.exe
            sha256sum lolMiner_v1.98a_Lin64.tar.gz
            sha256sum lolMiner
          } > miner-provenance.txt
          cat miner-provenance.txt

      - name: Upload provenance report
        uses: actions/upload-artifact@v4
        with:
          name: lolminer-1.98a-provenance
          path: miner-provenance.txt
          if-no-files-found: error
          retention-days: 14
