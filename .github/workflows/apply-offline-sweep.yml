name: Apply offline sweep integration
on:
  push:
    branches: [codex/step-2-hardware-metrics]
    paths:
      - scripts/apply-offline-sweep-integration.mjs
      - apps/api/src/offline-sweep-service.ts
      - .github/workflows/apply-offline-sweep.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/step-2-hardware-metrics
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/apply-offline-sweep-integration.mjs
      - name: Generate ephemeral validation secrets
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Validate API before commit
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          PLATFORM_WALLET: 11111111111111111111111111111111
        run: |
          npm ci
          npx prisma generate
          npx tsc -p tsconfig.json --noEmit
          npm test
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- apps/api/src/server.ts; then
            echo "Integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts
          git commit -m "feat(api): enforce offline refund policy"
          git push origin HEAD:codex/step-2-hardware-metrics
