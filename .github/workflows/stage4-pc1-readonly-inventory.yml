name: Stage 4 PC1 read-only inventory smoke
on:
  push:
    branches:
      - prep/stage4-pc1-readonly-preflight-20261015
    paths:
      - scripts/stage4-pc1-readonly-inventory.ps1
      - .github/workflows/stage4-pc1-readonly-inventory.yml
  pull_request:
    paths:
      - scripts/stage4-pc1-readonly-inventory.ps1
      - .github/workflows/stage4-pc1-readonly-inventory.yml

permissions:
  contents: read

concurrency:
  group: stage4-pc1-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test read-only output on disposable Windows runner
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'windows_powershell_51_required'
          }
          $raw = & ./scripts/stage4-pc1-readonly-inventory.ps1
          if (-not $?) { throw 'inventory_script_failed' }
          $report = ($raw | Out-String) | ConvertFrom-Json
          if ($report.schemaVersion -ne 1) { throw 'inventory_schema_invalid' }
          if ($report.role -cne 'PC1_windows_nvidia_host') { throw 'inventory_role_invalid' }
          if ($report.collection -cne 'read_only_no_network_no_execution') { throw 'inventory_mode_invalid' }
          if ($null -eq $report.componentsInKnownDirectories -or
              $null -eq $report.amd64Runtime -or
              $null -eq $report.candidateDisplayDrivers) {
            throw 'inventory_fields_missing'
          }
          if ($report.limitations.Count -lt 4) { throw 'inventory_limitations_missing' }
          Write-Host 'stage4_pc1_readonly_inventory_json_valid'
