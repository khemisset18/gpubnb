name: Stage 4 private backend source compatibility (read-only)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4-private-source-delta-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pinned-private-source-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.7'
      - name: Offline adversarial tests of source evidence (no Docker, deploy or network)
        run: python -m unittest discover -s scripts/tests -p test_stage4_private_backend_delta.py -v
      # Baseline observed live in Render on 2026-11-16: 23a7a295...
      # New native cleanup logic modifies apps/api/src on the review HEAD.
      # A changed API source is EXPECTED here; this read-only report does not
      # attest that Render runs the candidate. Recheck live deployment identity
      # before any physical test, and never confuse source drift with parity.
      # Only exact previously classified Gaming web trees, inherited from pinned
      # ancestors, may use the changed-web expectation. New web changes fail
      # closed; source evidence is never a security review or release permit.
      - name: Compare exact candidate and review base with observed Render source (read-only)
        env:
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -o pipefail
          args=()
          if [[ -n "$REVIEW_BASE_SHA" ]]; then
            args+=(--review-base-commit "$REVIEW_BASE_SHA")
          fi
          python scripts/stage4_private_backend_delta.py \
            --repo . \
            --private-render-commit 23a7a2950ecf365866f3531ddbf76920d9fcb295 \
            --pc1-candidate-commit "$REVIEWED_SHA" \
            --expect-api-source-changed \
            --expect-known-gaming-web-snapshot \
            "${args[@]}" \
            | tee "$RUNNER_TEMP/stage4-source-review.json"
      # Preserve the report even when the policy rejects a new web snapshot.
      # The previous step remains failed; uploading evidence grants no authority.
      - name: Upload source review evidence (including blocked comparisons)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: stage4-source-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/stage4-source-review.json
          if-no-files-found: ignore
          retention-days: 14
      # No secrets, deploy, PC1 service, quarantine, booking, signed evidence, or hardware use.
