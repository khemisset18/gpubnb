name: codex-route-runtime-proof-fixture

on:
  push:
    branches:
      - codex/agent-runtime-cleanliness-diagnostic
    paths:
      - .github/workflows/codex-route-runtime-proof-fixture.yml
      - scripts/codex-route-runtime-proof-fixture.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/agent-runtime-cleanliness-diagnostic
      - run: python3 scripts/codex-route-runtime-proof-fixture.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/machine-diagnostics-routes.integration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(diagnostics): send runtime proof through agent route integration"
          git push origin HEAD:codex/agent-runtime-cleanliness-diagnostic
