name: codex-provider-neutral-test-fixture

on:
  push:
    branches:
      - codex/provider-neutral-web-origins
    paths:
      - .github/workflows/codex-provider-neutral-test-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/provider-neutral-web-origins
      - name: Replace legacy gateway test fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/workspace-developer-flow.test.js')
          s = p.read_text()
          old = 'https://gpubnb.onrender.com'
          count = s.count(old)
          if count != 6:
              raise SystemExit(f'unexpected legacy gateway fixture count={count}')
          p.write_text(s.replace(old, 'https://gateway.example.test'))
          PY
      - name: Commit fixture cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/workspace-developer-flow.test.js
          git commit -m "test(web): remove legacy provider gateway fixture"
          git push origin HEAD:codex/provider-neutral-web-origins
