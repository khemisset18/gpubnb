name: Asset Exchange Dogecoin D0 Focal Snapshot Probe

on:
  push:
    branches:
      - asset-exchange/dogecoin-d0-repro-build-2026-10-08
    paths:
      - '.github/workflows/asset-exchange-dogecoin-d0-focal-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focal-snapshot:
    name: Verify historical Focal package state
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Probe Ubuntu archive snapshot used by Dogecoin 1.14.9 release
        shell: bash
        run: |
          set -euo pipefail

          SNAPSHOT_ID="20241201T000000Z"
          IMAGE="ubuntu:focal"

          docker pull "${IMAGE}"
          IMAGE_ID="$(docker image inspect --format='{{.Id}}' "${IMAGE}")"
          IMAGE_DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "${IMAGE}")"
          echo "probe_image_id=${IMAGE_ID}"
          echo "probe_image_digest=${IMAGE_DIGEST}"
          echo "snapshot_id=${SNAPSHOT_ID}"

          docker run --rm             -e SNAPSHOT_ID="${SNAPSHOT_ID}"             "${IMAGE}"             bash -euxo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates
              update-ca-certificates

              cat >/etc/apt/sources.list <<EOF
          deb [snapshot=${SNAPSHOT_ID}] http://archive.ubuntu.com/ubuntu focal main restricted universe multiverse
          deb [snapshot=${SNAPSHOT_ID}] http://archive.ubuntu.com/ubuntu focal-updates main restricted universe multiverse
          deb [snapshot=${SNAPSHOT_ID}] http://archive.ubuntu.com/ubuntu focal-backports main restricted universe multiverse
          deb [snapshot=${SNAPSHOT_ID}] http://security.ubuntu.com/ubuntu focal-security main restricted universe multiverse
          EOF

              apt-get update

              candidate() {
                apt-cache policy "$1" | awk "/Candidate:/ {print \$2; exit}"
              }

              check_version() {
                package="$1"
                expected="$2"
                actual="$(candidate "${package}")"
                printf "%s expected=%s actual=%s\n" "${package}" "${expected}" "${actual}"
                test "${actual}" = "${expected}"
              }

              check_version apt "2.0.10"
              check_version binutils "2.34-6ubuntu1.9"
              check_version curl "7.68.0-1ubuntu2.24"
              check_version git "1:2.25.1-1ubuntu3.13"
              check_version libc6 "2.31-0ubuntu9.16"
              check_version ca-certificates "20240203~20.04.1"
              check_version intel-microcode "3.20241112.0ubuntu0.20.04.1"

              apt-cache policy apt binutils curl git libc6 ca-certificates intel-microcode
            '
