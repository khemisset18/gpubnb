name: Asset Exchange Dogecoin D0 Focal Snapshot Probe

on:
  push:
    branches:
      - asset-exchange/dogecoin-d0-repro-build-2026-10-08
    paths:
      - '.github/workflows/asset-exchange-dogecoin-d0-focal-probe.yml'
  pull_request:
    branches:
      - asset-exchange/doge-d0-kernel-failfast-20261029
    paths:
      - ".github/workflows/asset-exchange-dogecoin-d0-focal-probe.yml"
      - "asset-exchange/qualification/dogecoin/d0/focal-kernel-cohort.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focal-snapshot:
    name: Focal clean snapshot ${{ matrix.snapshot }}
    strategy:
      fail-fast: false
      matrix:
        snapshot:
          - 20241203T000000Z
          - 20241205T000000Z
          - 20241207T000000Z
          - 20241210T000000Z
          - 20241212T000000Z
          - 20241215T000000Z
          - 20241218T000000Z
          - 20241220T000000Z
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout qualification requirements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconstruct clean historical Focal rootfs
        shell: bash
        env:
          SNAPSHOT_ID: ${{ matrix.snapshot }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             ca-certificates debootstrap

          ROOT="${RUNNER_TEMP}/focal-${SNAPSHOT_ID}"
          SNAP_URL="https://snapshot.ubuntu.com/ubuntu/${SNAPSHOT_ID}"
          sudo rm -rf "${ROOT}"

          sudo debootstrap             --variant=minbase             --arch=amd64             --include=ca-certificates             focal             "${ROOT}"             "${SNAP_URL}"

          sudo tee "${ROOT}/etc/apt/sources.list" >/dev/null <<EOF
          deb ${SNAP_URL} focal main restricted universe multiverse
          deb ${SNAP_URL} focal-updates main restricted universe multiverse
          deb ${SNAP_URL} focal-backports main restricted universe multiverse
          deb ${SNAP_URL} focal-security main restricted universe multiverse
          EOF

          sudo tee "${ROOT}/etc/apt/apt.conf.d/99-d0-probe" >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::Retries "3";
          EOF
          EVIDENCE="${RUNNER_TEMP}/focal-evidence-${SNAPSHOT_ID}"
          mkdir -p "$EVIDENCE"
          # Preserve signed InRelease files AND the authenticated package indexes.
          # No snapshot discovered here is automatically promoted into the build.
          collect_probe() {
            rc=$?
            trap - EXIT
            set +e
            sudo tar --exclude=lock --exclude=partial -czf "$EVIDENCE/apt-lists.tar.gz" -C "$ROOT/var/lib/apt" lists || rc=1
            sudo cp "$ROOT/etc/apt/sources.list" "$EVIDENCE/sources.list" || rc=1
            sudo cp "$ROOT/usr/share/keyrings/ubuntu-archive-keyring.gpg" "$EVIDENCE/ubuntu-archive-keyring.gpg" || rc=1
            sudo chown -R "$(id -u):$(id -g)" "$EVIDENCE"
            (cd "$EVIDENCE" && sha256sum apt-lists.tar.gz sources.list ubuntu-archive-keyring.gpg > SHA256SUMS) || rc=1
            exit "$rc"
          }
          trap collect_probe EXIT
          exec > >(tee "$EVIDENCE/probe.log") 2>&1
          source asset-exchange/qualification/dogecoin/d0/focal-kernel-cohort.sh
          sudo chroot "${ROOT}" apt-get update

          candidate() {
            sudo chroot "${ROOT}" apt-cache policy "$1" | awk '/Candidate:/ {print $2; exit}'
          }

          mismatches=0
          check_version() {
            package="$1"
            expected="$2"
            actual="$(candidate "${package}")" || { mismatches=$((mismatches + 1)); return 0; }
            sudo chroot "$ROOT" apt-cache policy "$package" || { mismatches=$((mismatches + 1)); return 0; }
            # Package records include archive filename, version and SHA-256.
            sudo chroot "$ROOT" apt-cache show "$package=$expected" || mismatches=$((mismatches + 1))
            printf 'CHECK package=%s expected=%s actual=%s\n' "${package}" "${expected}" "${actual}"
            if [[ "${actual}" != "${expected}" ]]; then
              mismatches=$((mismatches + 1))
            fi
          }

          check_version apt "2.0.10"
          check_version binutils "2.34-6ubuntu1.9"
          check_version curl "7.68.0-1ubuntu2.24"
          check_version git "1:2.25.1-1ubuntu3.13"
          check_version libc6 "2.31-0ubuntu9.16"
          check_version ca-certificates "20240203~20.04.1"
          check_version libfreetype6 "2.10.1-2ubuntu0.3"
          check_version intel-microcode "3.20241112.0ubuntu0.20.04.1"
          check_version libexpat1 "2.2.9-1ubuntu0.8"
          check_focal_kernel_cohort check_version
          echo "SNAPSHOT_RESULT id=${SNAPSHOT_ID} mismatches=${mismatches}"

          test "${mismatches}" -eq 0

      - name: Preserve authenticated snapshot discovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogecoin-d0-focal-probe-${{ matrix.snapshot }}-${{ github.sha }}
          path: ${{ runner.temp }}/focal-evidence-${{ matrix.snapshot }}/
          if-no-files-found: error
          retention-days: 30
