name: regenerate-api-lock-once

on:
  push:
    branches:
      - feat/gpu-rental-production-hardening-v1
    paths:
      - apps/api/package.json
      - .github/workflows/regenerate-api-lock-once.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/gpu-rental-production-hardening-v1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Regenerate lockfile with repository npm version
        working-directory: apps/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- apps/api/package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/package-lock.json
          test "$(git diff --cached --name-only)" = 'apps/api/package-lock.json'
          git commit -m 'chore(api): regenerate lockfile for security override'
          git push origin HEAD:feat/gpu-rental-production-hardening-v1
