name: codex-doc-runtime-cleanliness

on:
  push:
    branches:
      - codex/agent-runtime-cleanliness-diagnostic
    paths:
      - .github/workflows/codex-doc-runtime-cleanliness.yml
      - scripts/codex-doc-runtime-cleanliness.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/agent-runtime-cleanliness-diagnostic
      - run: python3 scripts/codex-doc-runtime-cleanliness.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SESSION_RESUME.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(diagnostics): mark runtime cleanliness verification resolved"
          git push origin HEAD:codex/agent-runtime-cleanliness-diagnostic
