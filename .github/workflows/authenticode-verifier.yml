name: Authenticode verifier tests
on:
  push:
    branches:
      - fix/authenticode-verifier-fail-closed-20261009
    paths:
      - scripts/verify-windows-authenticode.ps1
      - scripts/tests/verify-windows-authenticode.tests.ps1
      - .github/workflows/authenticode-verifier.yml
permissions:
  contents: read
jobs:
  verify-pwsh:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Syntax and fail-closed behavior
        shell: pwsh
        run: |
          & ./scripts/tests/verify-windows-authenticode.tests.ps1
          if (-not $?) { exit 1 }
  verify-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Syntax and fail-closed behavior
        shell: powershell
        run: |
          & ./scripts/tests/verify-windows-authenticode.tests.ps1
          if (-not $?) { exit 1 }
