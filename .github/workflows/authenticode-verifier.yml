name: Authenticode verifier tests
on:
  push:
    branches:
      - fix/stage4-authenticode-on-290-20261015
    paths:
      - scripts/verify-windows-authenticode.ps1
      - scripts/tests/verify-windows-authenticode.tests.ps1
      - .github/workflows/authenticode-verifier.yml
  pull_request:
    paths:
      - scripts/verify-windows-authenticode.ps1
      - scripts/tests/verify-windows-authenticode.tests.ps1
      - .github/workflows/authenticode-verifier.yml
permissions:
  contents: read

concurrency:
  group: authenticode-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pwsh:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Syntax and fail-closed behavior
        shell: pwsh
        run: |
          Write-Host "POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'expected_powershell_7' }
          & ./scripts/tests/verify-windows-authenticode.tests.ps1
          if (-not $?) { exit 1 }
  verify-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Syntax and fail-closed behavior
        shell: powershell
        run: |
          Write-Host "POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'expected_windows_powershell_5_1' }
          & ./scripts/tests/verify-windows-authenticode.tests.ps1
          if (-not $?) { exit 1 }
