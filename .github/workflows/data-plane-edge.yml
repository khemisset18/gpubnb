name: data-plane-edge

on:
  pull_request:
    paths:
      - 'services/edge/**'
      - 'apps/api/src/data-plane-*.ts'
      - 'apps/api/test/data-plane-*.test.ts'
      - 'docs/architecture/ADR-001-data-plane-v1.md'
      - 'docs/architecture/data-plane-threat-model.md'
      - 'docs/operations/data-plane-slo.md'
      - '.github/workflows/data-plane-edge.yml'
  push:
    branches:
      - main
    paths:
      - 'services/edge/**'
      - 'apps/api/src/data-plane-*.ts'
      - 'apps/api/test/data-plane-*.test.ts'
      - '.github/workflows/data-plane-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-plane-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path services/edge/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path services/edge/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path services/edge/Cargo.toml --all-targets -- -D warnings

  api-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Data-plane contract tests
        run: npx tsx --test test/data-plane-*.test.ts
      - name: TypeScript strict build
        run: npx tsc -p tsconfig.json --noEmit

  quic-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Edge and E2E client
        run: cargo build --manifest-path services/edge/Cargo.toml --bin gpubnb-edge --example e2e_client

      - name: Real QUIC authority, replay, reconnect and restart E2E
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/replay"
          trap 'if [[ -n "${EDGE_PID:-}" ]]; then kill -INT "$EDGE_PID" 2>/dev/null || true; wait "$EDGE_PID" 2>/dev/null || true; fi; rm -rf "$TMP"' EXIT

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$TMP/tls-key.pem" -out "$TMP/tls-cert.pem" \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' >/dev/null 2>&1
          (cd apps/api && npx tsx test/data-plane-e2e-authority.ts "$TMP")

          export GPUBNB_EDGE_BIND='127.0.0.1:4433'
          export GPUBNB_EDGE_TLS_CERT="$TMP/tls-cert.pem"
          export GPUBNB_EDGE_TLS_KEY="$TMP/tls-key.pem"
          export GPUBNB_EDGE_ID='edge_e2e_1'
          export GPUBNB_EDGE_REPLAY_DIR="$TMP/replay"
          export GPUBNB_EDGE_AUTHORITY_PUBLIC_KEY_HEX="$(tr -d '\n' < "$TMP/authority-public.hex")"

          start_edge() {
            services/edge/target/debug/gpubnb-edge >"$TMP/edge.log" 2>&1 &
            EDGE_PID=$!
            sleep 1
            kill -0 "$EDGE_PID"
          }
          stop_edge() {
            kill -INT "$EDGE_PID"
            wait "$EDGE_PID"
            EDGE_PID=''
          }
          client() {
            services/edge/target/debug/examples/e2e_client \
              127.0.0.1:4433 "$TMP/tls-cert.pem" "$1" "$2"
          }

          start_edge
          client expect-ok "$TMP/authority-1.json"
          client expect-reject "$TMP/authority-1.json"
          client expect-ok "$TMP/authority-2.json"
          stop_edge

          start_edge
          client expect-reject "$TMP/authority-2.json"
          client expect-ok "$TMP/authority-3.json"
          stop_edge

          grep -q 'edge_authority_replay_rejected' "$TMP/edge.log"
