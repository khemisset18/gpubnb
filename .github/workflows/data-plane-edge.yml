name: data-plane-edge

on:
  pull_request:
    paths:
      - 'services/edge/**'
      - 'apps/api/src/data-plane-*.ts'
      - 'apps/api/test/data-plane-*.test.ts'
      - 'docs/architecture/ADR-001-data-plane-v1.md'
      - 'docs/architecture/data-plane-threat-model.md'
      - 'docs/operations/data-plane-slo.md'
      - '.github/workflows/data-plane-edge.yml'
  push:
    branches:
      - main
    paths:
      - 'services/edge/**'
      - 'apps/api/src/data-plane-*.ts'
      - 'apps/api/test/data-plane-*.test.ts'
      - '.github/workflows/data-plane-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-plane-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path services/edge/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path services/edge/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path services/edge/Cargo.toml --all-targets -- -D warnings

  api-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Data-plane policy and protocol tests
        run: npx tsx --test test/data-plane-policy.test.ts test/data-plane-protocol.test.ts
      - name: TypeScript strict build
        run: npx tsc -p tsconfig.json --noEmit
