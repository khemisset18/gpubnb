name: DOGE comprehensive isolated software regression (no funds)

on:
  push:
    branches: [test/doge-full-offline-regression-20261122]
    paths:
      - ".github/workflows/asset-exchange-dogecoin-software-matrix.yml"
      - "asset-exchange/qualification/dogecoin/d8/run-full-offline-matrix.sh"
      - "docs/asset-exchange/DOGE_FULL_OFFLINE_MATRIX_2026-11-22.md"
  pull_request:
    paths:
      - ".github/workflows/asset-exchange-dogecoin-software-matrix.yml"
      - "asset-exchange/qualification/dogecoin/d8/run-full-offline-matrix.sh"

permissions:
  contents: read

jobs:
  private-offline-regression:
    if: github.repository == 'khemisset18/gpubnb'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate immutable checkout and shell syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n asset-exchange/qualification/dogecoin/d8/run-full-offline-matrix.sh
      - name: Run every offline suite inside private network namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/doge-offline"
          readlink /proc/self/ns/net > "$RUNNER_TEMP/doge-offline/parent-netns.txt"
          sudo unshare --net -- /bin/bash -c '
            set -euo pipefail
            export PATH="$1"
            ip link set lo up
            cd "$2"
            /bin/bash asset-exchange/qualification/dogecoin/d8/run-full-offline-matrix.sh "$3" "$4"
          ' _ "$PATH" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/doge-offline" "$GITHUB_SHA"
      - name: Save public summary only, no raw logs or secrets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doge-comprehensive-offline-matrix
          path: |
            ${{ runner.temp }}/doge-offline/software-matrix-report.json
            ${{ runner.temp }}/doge-offline/network-links.txt
            ${{ runner.temp }}/doge-offline/network-addresses.txt
          if-no-files-found: warn
          retention-days: 30
