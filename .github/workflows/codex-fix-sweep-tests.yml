name: codex-fix-sweep-tests

on:
  push:
    branches:
      - codex/sweep-advisory-fencing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/sweep-advisory-fencing
      - name: Patch Prisma test doubles for advisory locks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patches = {
              Path('apps/api/test/job-staleness-sweep.test.ts'): (
                  "  const tx = {\n    job: {",
                  "  const tx = {\n    $queryRaw: async () => [{ acquired: true }],\n    job: {",
              ),
              Path('apps/api/test/job-lease-network-outage.test.ts'): (
                  "  const tx = {\n    job: {",
                  "  const tx = {\n    $queryRaw: async () => [{ acquired: true }],\n    job: {",
              ),
          }

          for path, (old, new) in patches.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded match, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit guarded test update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/job-staleness-sweep.test.ts apps/api/test/job-lease-network-outage.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(reliability): model advisory sweep lock in fake clients"
          git push origin HEAD:codex/sweep-advisory-fencing
