name: fix-dedupe-order-temp

on:
  push:
    branches:
      - reliability/workspace-chaos-promotion
    paths:
      - '.github/workflows/fix-dedupe-order-temp.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: reliability/workspace-chaos-promotion
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Repair idempotent enqueue ordering
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/api/src/workspace-gateway.ts')
          source = path.read_text()
          old = """const ENQUEUE_DEDUPED_WS_FRAME_SCRIPT=`
          local count = redis.call('LLEN', KEYS[2])
          local currentBytes = tonumber(redis.call('GET', KEYS[3]) or '0')
          local itemBytes = tonumber(ARGV[4])
          if count >= tonumber(ARGV[5]) or currentBytes + itemBytes > tonumber(ARGV[6]) then
            return -1
          end
          if redis.call('SET', KEYS[1], '1', 'EX', ARGV[1], 'NX') then
            redis.call('LPUSH', KEYS[2], ARGV[3])
            redis.call('SET', KEYS[3], currentBytes + itemBytes, 'EX', ARGV[2])
            redis.call('EXPIRE', KEYS[2], ARGV[2])
            return 1
          end
          return 0
          `;"""
          new = """const ENQUEUE_DEDUPED_WS_FRAME_SCRIPT=`
          if redis.call('EXISTS', KEYS[1]) == 1 then
            return 0
          end
          local count = redis.call('LLEN', KEYS[2])
          local currentBytes = tonumber(redis.call('GET', KEYS[3]) or '0')
          local itemBytes = tonumber(ARGV[4])
          if count >= tonumber(ARGV[5]) or currentBytes + itemBytes > tonumber(ARGV[6]) then
            return -1
          end
          if redis.call('SET', KEYS[1], '1', 'EX', ARGV[1], 'NX') then
            redis.call('LPUSH', KEYS[2], ARGV[3])
            redis.call('SET', KEYS[3], currentBytes + itemBytes, 'EX', ARGV[2])
            redis.call('EXPIRE', KEYS[2], ARGV[2])
            return 1
          end
          return 0
          `;"""
          if old not in source:
              raise SystemExit('expected dedupe Lua block not found exactly; refusing unsafe rewrite')
          path.write_text(source.replace(old, new, 1))
      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: apps/api
        run: npm run prisma:generate
      - name: Run gateway contract and dedupe regression tests
        working-directory: apps/api
        run: npx tsx --test test/workspace-gateway-contract.test.ts test/workspace-gateway-dedupe-capacity.test.ts
      - name: TypeScript strict build
        working-directory: apps/api
        run: npx tsc -p tsconfig.json --noEmit
      - name: Commit verified repair
        run: |
          git config user.name 'gpubnb-ci'
          git config user.email '103233875+khemisset18@users.noreply.github.com'
          git add apps/api/src/workspace-gateway.ts
          git diff --cached --check
          git commit -m 'fix(gateway): dedupe websocket retries before capacity checks'
          git push origin HEAD:reliability/workspace-chaos-promotion
