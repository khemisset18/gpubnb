name: codex-e2e-real-gpu-proof

on:
  push:
    branches:
      - codex/e2e-real-gpu-proof
    paths:
      - .github/workflows/codex-e2e-real-gpu-proof.yml
      - scripts/codex-e2e-real-gpu-proof.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/e2e-real-gpu-proof
      - run: python3 scripts/codex-e2e-real-gpu-proof.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/run.cjs
          git diff --cached --quiet && exit 0
          git commit -m "test(e2e): require real GPU_PROOF before Developer workspace"
          git push origin HEAD:codex/e2e-real-gpu-proof
