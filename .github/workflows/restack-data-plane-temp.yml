name: restack-data-plane-temp

on:
  push:
    branches:
      - architecture/data-plane-v1
    paths:
      - '.github/workflows/restack-data-plane-temp.yml'

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: architecture/data-plane-v1
          fetch-depth: 0
      - name: Merge validated main into stacked branch
        run: |
          git config user.name 'gpubnb-ci'
          git config user.email '103233875+khemisset18@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git diff --check origin/main...HEAD -- . ':(exclude)**/*.md'
          git push origin HEAD:architecture/data-plane-v1
