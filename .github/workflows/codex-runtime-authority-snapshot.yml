name: codex-runtime-authority-snapshot

on:
  push:
    branches:
      - codex/agent-runtime-cleanliness-diagnostic
    paths:
      - .github/workflows/codex-runtime-authority-snapshot.yml
      - scripts/codex-runtime-authority-snapshot.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/agent-runtime-cleanliness-diagnostic
      - run: python3 scripts/codex-runtime-authority-snapshot.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/gpubnb_agent/cli.py agent/tests/test_runtime_cleanliness_diagnostic_payload.py apps/api/src/machine-diagnostics-routes.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(diagnostics): fence runtime cleanup against stale authority"
          git push origin HEAD:codex/agent-runtime-cleanliness-diagnostic
