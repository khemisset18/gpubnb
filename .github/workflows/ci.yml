name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gpubnb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gpubnb
      REDIS_URL: redis://localhost:6379
      SOLANA_CLUSTER: devnet
      ALLOW_MAINNET: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Require isolated PostgreSQL and Redis before integration tests
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module - <<'NODE' 2>&1 | tee integration-preflight.log
          import {PrismaClient} from '@prisma/client';
          import Redis from 'ioredis';
          const prisma = new PrismaClient();
          const redis = new Redis(process.env.REDIS_URL, {lazyConnect: true, enableOfflineQueue: false, retryStrategy: () => null});
          try {
            await prisma.$queryRaw`SELECT 1`;
            await redis.connect();
            if (await redis.ping() !== 'PONG') throw new Error('Redis preflight failed');
            console.log('POSTGRESQL_AND_REDIS_READY: isolated CI services');
          } finally {
            redis.disconnect();
            await prisma.$disconnect();
          }
          NODE
      - name: API tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee api-test.log
      - name: Upload API test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-diagnostics
          path: |
            apps/api/api-test.log
            apps/api/integration-preflight.log
          if-no-files-found: error
          retention-days: 30
      - name: Build API
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee api-build.log
      - name: Strict TypeScript check
        shell: bash
        run: |
          set -o pipefail
          npx tsc -p tsconfig.json --noEmit 2>&1 | tee api-tsc.log
      - name: Upload API build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-build-diagnostics
          path: |
            apps/api/api-build.log
            apps/api/api-tsc.log
          if-no-files-found: warn
          retention-days: 30

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
      - name: Install both actual dependency trees with Node 22
        run: |
          npm ci
          npm ci --prefix apps/api
      - name: npm audit both trees, all severities
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-root.json
          root_status=$?
          npm audit --prefix apps/api --json > npm-audit-api.json
          api_status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          for (const path of ['npm-audit-root.json', 'npm-audit-api.json']) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log(JSON.stringify({path, counts: report.metadata?.vulnerabilities, error: report.error}));
            if (report.error || report.metadata?.vulnerabilities?.total !== 0 || Object.keys(report.vulnerabilities ?? {}).length) {
              process.exitCode = 1;
            }
          }
          NODE
          test "$root_status" -eq 0
          test "$api_status" -eq 0
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            npm-audit-root.json
            npm-audit-api.json
          if-no-files-found: error
          retention-days: 14

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install --disable-pip-version-check -e agent
      - run: python -m py_compile agent/agent.py agent/gpubnb_agent/*.py
      - name: Agent tests
        run: |
          set -o pipefail
          python -m unittest discover -s agent/tests -v 2>&1 | tee agent-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-test-diagnostics
          path: agent-test.log
          if-no-files-found: error
          retention-days: 30

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs/gpu_escrow
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/gpu_escrow
      - name: Contract tests
        run: |
          set -o pipefail
          cargo test 2>&1 | tee contract-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-diagnostics
          path: programs/gpu_escrow/contract-test.log
          if-no-files-found: error
          retention-days: 30

  production-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m py_compile agent/agent.py
      - run: node --check apps/web/app.js
      - run: node --check apps/web/config.js
      - run: node --check apps/web/account.js
      - run: node --check apps/web/workspaces.js
      - run: node --check apps/web/publish.js
      - run: node --check apps/web/choose-workspace.js
      - run: node --check apps/web/rental-owner.js
      - run: node scripts/devnet-doctor.mjs
      - name: Validate qualification PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/qualification-preflight-pc-a.ps1',
            'scripts/qualification-preflight-pc-b.ps1',
            'scripts/qualification-evidence.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }
      - name: Validate Developer Workspace manifest and shell
        run: |
          python3 -m json.tool workspaces/developer/manifest.json >/dev/null
          sh -n workspaces/developer/healthcheck.sh

  security-static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --verbose --no-banner --no-git
      - name: Trivy filesystem report
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          # .claude/worktrees/* are separate git worktrees for other branches' in-progress
          # work (checked into this repo, not gitignored) - their own dependency trees are
          # that branch's own CI's responsibility, not main's. Scanning them here made
          # main's security gate fail on a dependency version that was never actually
          # main's (main's own apps/api/package-lock.json is scanned normally either way).
          # The skip-dirs *action input* is silently a no-op on this trivy-action version
          # (confirmed live: the actual invoked command was plain `trivy fs .`, nothing
          # else) - trivy.yaml at the repo root is Trivy's own native config file, picked
          # up automatically regardless of the action's input handling.
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          scanners: vuln
          format: json
          output: trivy-results.json
          exit-code: '0'
      - name: Enforce Trivy gate on every reported vulnerability
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('trivy-results.json').read_text(encoding='utf-8'))
          findings = []
          for result in report.get('Results') or []:
              target = result.get('Target')
              for item in result.get('Vulnerabilities') or []:
                  if item:
                      findings.append({
                          'target': target,
                          'id': item.get('VulnerabilityID'),
                          'package': item.get('PkgName'),
                          'installed': item.get('InstalledVersion'),
                          'fixed': item.get('FixedVersion'),
                          'severity': item.get('Severity'),
                      })
          print(json.dumps({'blockingCount': len(findings), 'findings': findings[:100]}, indent=2))
          raise SystemExit(1 if findings else 0)
          PY
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Shell syntax
        run: bash -n sandbox/*.sh scripts/*.sh
      - name: Python compile
        run: python3 -m py_compile agent/agent.py agent/gpubnb_agent/*.py
