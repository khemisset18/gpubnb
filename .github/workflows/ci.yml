name: CI
permissions:
  contents: read

on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gpubnb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gpubnb
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-32-characters-minimum
      INTERNAL_SERVICE_TOKEN: ci-only-internal-token-32-characters
      PLATFORM_WALLET: B5WQmXWHL8R86wf3LHLRE4aQAuRdRSz1EXKcwNQDqj2e
      PUBLIC_APP_DOMAIN: localhost
      SOLANA_CLUSTER: devnet
      ALLOW_MAINNET: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Check Prisma formatting
        run: |
          npx prisma format
          git diff --exit-code -- prisma/schema.prisma
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m py_compile agent/agent.py

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs/gpu_escrow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/gpu_escrow
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  production-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
      - run: python3 -m py_compile agent/agent.py
      - run: node --check apps/web/app.js
      - run: node --check apps/web/config.js
      - run: node --check apps/web/auth.js
      - run: node --check apps/web/publish.js
      - run: node --test test/frontend.test.mjs
      - name: Verify that incomplete mainnet evidence is rejected
        run: |
          if ./scripts/mainnet-gate.sh >mainnet-gate.log 2>&1; then
            cat mainnet-gate.log
            echo "The repository unexpectedly passed the mainnet release gate." >&2
            exit 1
          fi
          cat mainnet-gate.log
          grep -Fq 'MAINNET: NO-GO' mainnet-gate.log

  security-static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Shell syntax
        run: bash -n sandbox/*.sh scripts/*.sh
      - name: ShellCheck
        run: shellcheck sandbox/*.sh scripts/*.sh
      - name: Python compile
        run: python3 -m py_compile agent/agent.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f apps/api/Dockerfile -t gpubnb-api:ci .
      - name: Scan production image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gpubnb-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
