name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gpubnb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gpubnb
      REDIS_URL: redis://localhost:6379
      SOLANA_CLUSTER: devnet
      ALLOW_MAINNET: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
      - run: npx tsc -p tsconfig.json --noEmit

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --ignore-scripts
      - name: npm audit (HIGH and CRITICAL)
        id: npm-audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          audit_status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          const blocking = Object.entries(vulnerabilities)
            .filter(([, value]) => value.severity === 'high' || value.severity === 'critical')
            .map(([name, value]) => ({
              name,
              severity: value.severity,
              direct: Boolean(value.isDirect),
              via: (value.via || []).map(item => typeof item === 'string' ? item : item.url || item.title).slice(0, 4),
              fixAvailable: value.fixAvailable,
            }));
          console.log(JSON.stringify({blockingCount: blocking.length, blocking}, null, 2));
          NODE
          exit "$audit_status"
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: apps/api/npm-audit.json
          if-no-files-found: error
          retention-days: 14

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install --disable-pip-version-check -e agent
      - run: python -m py_compile agent/agent.py agent/gpubnb_agent/*.py
      - run: python -m unittest discover -s agent/tests -v

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs/gpu_escrow
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/gpu_escrow
      - run: cargo test

  production-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m py_compile agent/agent.py
      - run: node --check apps/web/app.js
      - run: node --check apps/web/config.js
      - run: node --check apps/web/account.js
      - run: node --check apps/web/workspaces.js
      - run: node scripts/devnet-doctor.mjs
      - name: Validate Developer Workspace manifest and shell
        run: |
          python3 -m json.tool workspaces/developer/manifest.json >/dev/null
          sh -n workspaces/developer/healthcheck.sh

  security-static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --verbose --no-banner --no-git
      - name: Trivy filesystem report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: '0'
      - name: Enforce Trivy HIGH/CRITICAL gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('trivy-results.json').read_text(encoding='utf-8'))
          findings = []
          for result in report.get('Results') or []:
              target = result.get('Target')
              for item in result.get('Vulnerabilities') or []:
                  if item.get('Severity') in {'HIGH', 'CRITICAL'}:
                      findings.append({
                          'target': target,
                          'id': item.get('VulnerabilityID'),
                          'package': item.get('PkgName'),
                          'installed': item.get('InstalledVersion'),
                          'fixed': item.get('FixedVersion'),
                          'severity': item.get('Severity'),
                      })
          print(json.dumps({'blockingCount': len(findings), 'findings': findings[:100]}, indent=2))
          raise SystemExit(1 if findings else 0)
          PY
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Shell syntax
        run: bash -n sandbox/*.sh scripts/*.sh
      - name: Python compile
        run: python3 -m py_compile agent/agent.py agent/gpubnb_agent/*.py
