name: codex-quarantine-runtime-fixtures

on:
  push:
    branches:
      - codex/agent-runtime-cleanliness-diagnostic
    paths:
      - .github/workflows/codex-quarantine-runtime-fixtures.yml
      - scripts/codex-quarantine-runtime-fixtures.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/agent-runtime-cleanliness-diagnostic
      - run: python3 scripts/codex-quarantine-runtime-fixtures.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/quarantine-diagnostics-system.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(diagnostics): include runtime cleanup in quarantine fixtures"
          git push origin HEAD:codex/agent-runtime-cleanliness-diagnostic
