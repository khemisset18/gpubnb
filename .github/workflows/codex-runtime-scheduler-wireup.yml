name: codex-runtime-scheduler-wireup

on:
  push:
    branches:
      - codex/runtime-scheduler-audit
    paths:
      - .github/workflows/codex-runtime-scheduler-wireup.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/runtime-scheduler-audit
      - name: Wire distributed scheduler authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server_path = Path('apps/api/src/server.ts')
          server = server_path.read_text()
          old_import = "import { reconcileDevelopmentBookings, reconcileStalledActivations, reconcileOrphanedDepositBookings, reconcileDevBypassSettlements, reconcileExpiredActiveDeveloperBookings } from './dev-booking-reconciler.js';"
          new_import = "import { reconcileStalledActivations, reconcileOrphanedDepositBookings, reconcileDevBypassSettlements, reconcileExpiredActiveDeveloperBookings } from './dev-booking-reconciler.js';\nimport { reconcileDevelopmentBookingsScheduled } from './development-booking-scheduler.js';\nimport { runWithDistributedTaskLease } from './distributed-task-lease.js';"
          if server.count(old_import) != 1:
              raise SystemExit(f'server import marker count={server.count(old_import)}')
          server = server.replace(old_import, new_import, 1)

          marker = 'const reconcileIntervalId=setInterval'
          start = server.find(marker)
          if start < 0:
              raise SystemExit('reconcile interval marker missing')
          end = server.find('\n', start)
          if end < 0:
              end = len(server)
          line = server[start:end]
          if line.count('Promise.all([') != 1:
              raise SystemExit(f'Promise.all count in reconcile line={line.count("Promise.all([")})')
          line = line.replace(
              'Promise.all([',
              "runWithDistributedTaskLease(redis,'api-reconciliation-tick',()=>Promise.all([",
              1,
          )
          old_dev = "reconcileDevelopmentBookings(db,now).then(result=>{if(Object.values(result).some(v=>v>0))"
          new_dev = "reconcileDevelopmentBookingsScheduled(redis,db,now).then(({result,leaseLost})=>{if(leaseLost)app.log.warn({task:'development-bookings'},'distributed_task_lease_lost');if(Object.values(result).some(v=>v>0))"
          if line.count(old_dev) != 1:
              raise SystemExit(f'development booking marker count={line.count(old_dev)}')
          line = line.replace(old_dev, new_dev, 1)
          old_end = ']).finally(()=>{reconciling=false});},10_000);'
          new_end = "]),{ttlMs:30_000,renewalMs:10_000}).then(lease=>{if(lease.status==='executed'&&lease.leaseLost)app.log.warn({task:'api-reconciliation-tick'},'distributed_task_lease_lost');}).catch(err=>app.log.error({err},'api_reconciliation_tick_failed')).finally(()=>{reconciling=false});},10_000);"
          if line.count(old_end) != 1:
              raise SystemExit(f'reconcile interval end marker count={line.count(old_end)}')
          line = line.replace(old_end, new_end, 1)
          server = server[:start] + line + server[end:]
          server_path.write_text(server)

          worker_path = Path('apps/api/src/delivery-worker.ts')
          worker = worker_path.read_text()
          old_worker_import = "import { reconcileDevelopmentBookings } from './dev-booking-reconciler.js';"
          new_worker_import = "import { reconcileDevelopmentBookingsScheduled } from './development-booking-scheduler.js';"
          if worker.count(old_worker_import) != 1:
              raise SystemExit(f'worker import marker count={worker.count(old_worker_import)}')
          worker = worker.replace(old_worker_import, new_worker_import, 1)
          old_call = '          const reconciliation = await reconcileDevelopmentBookings(db, new Date(now));'
          new_call = "          const scheduled = await reconcileDevelopmentBookingsScheduled(redis, db, new Date(now));\n          const reconciliation = scheduled.result;\n          if (scheduled.leaseLost) {\n            console.warn(JSON.stringify({ level: 'warn', message: 'distributed_task_lease_lost', task: 'development-bookings', workerId }));\n          }"
          if worker.count(old_call) != 1:
              raise SystemExit(f'worker reconciliation marker count={worker.count(old_call)}')
          worker = worker.replace(old_call, new_call, 1)
          worker_path.write_text(worker)
          PY
      - name: Commit guarded scheduler wireup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts apps/api/src/delivery-worker.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(runtime): coordinate reconciliation across replicas"
          git push origin HEAD:codex/runtime-scheduler-audit
