name: codex-runtime-scheduler-wireup

on:
  push:
    branches:
      - codex/runtime-scheduler-audit
    paths:
      - .github/workflows/codex-runtime-scheduler-wireup.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/runtime-scheduler-audit
      - name: Fence sweeps and remove stale provider assumption
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/server.ts')
          text = path.read_text()

          old_comment = '''// Render's free plan does not support the Background Worker service type (the delivery-worker
// and sweep-scheduler processes defined in render.yaml fail to deploy on it — confirmed via a
// failed blueprint sync: "service type is not available for this plan"). Until either a paid
// plan or the two dedicated workers are available, the two reconciliation loops they'd normally
// run run in-process here instead, on plain intervals (single process, so no distributed lock
// is needed the way the dedicated sweep-scheduler needs one across multiple replicas).'''
          new_comment = '''// Reconciliation and sweep loops remain in-process for deployment compatibility.
// Every shared background tick is fenced by Redis so multiple API replicas and the
// delivery worker cannot accidentally duplicate the same scheduler authority.'''
          if text.count(old_comment) != 1:
              raise SystemExit(f'stale provider comment marker count={text.count(old_comment)}')
          text = text.replace(old_comment, new_comment, 1)

          marker = 'const sweepIntervalId=setInterval'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('sweep interval marker missing')
          end = text.find('\n', start)
          if end < 0:
              end = len(text)
          line = text[start:end]
          old_start = 'sweeping=true;(async()=>{'
          new_start = "sweeping=true;runWithDistributedTaskLease(redis,'api-sweep-tick',async()=>{"
          if line.count(old_start) != 1:
              raise SystemExit(f'sweep body marker count={line.count(old_start)}')
          line = line.replace(old_start, new_start, 1)
          old_end = "})().catch(err=>app.log.error({err},'offline_sweep_failed')).finally(()=>{sweeping=false});},Math.max(config.HEARTBEAT_OFFLINE_SECONDS,30)*1000);"
          new_end = "},{ttlMs:120_000,renewalMs:30_000}).then(lease=>{if(lease.status==='executed'&&lease.leaseLost)app.log.warn({task:'api-sweep-tick'},'distributed_task_lease_lost');}).catch(err=>app.log.error({err},'offline_sweep_failed')).finally(()=>{sweeping=false});},Math.max(config.HEARTBEAT_OFFLINE_SECONDS,30)*1000);"
          if line.count(old_end) != 1:
              raise SystemExit(f'sweep interval end marker count={line.count(old_end)}')
          line = line.replace(old_end, new_end, 1)
          text = text[:start] + line + text[end:]
          path.write_text(text)
          PY
      - name: Commit guarded sweep wireup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(runtime): fence background sweeps across replicas"
          git push origin HEAD:codex/runtime-scheduler-audit
