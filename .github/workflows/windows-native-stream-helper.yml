name: windows-native-stream-helper

on:
  pull_request:
    paths:
      - native/windows-stream-helper/**
      - native/windows-platform/**
      - native/windows-worker/**
      - agent/gpubnb_agent/windows_native_*.py
      - agent/tests/test_windows_native_*.py
      - agent/tools/windows_native_qualify.py
      - docs/operations/WINDOWS_NATIVE_DESKTOP_QUALIFICATION.md
      - docs/architecture/WINDOWS_NATIVE_*.md
      - .github/workflows/windows-native-stream-helper.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-stream-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Agent dependencies
        run: python -m pip install ./agent

      - name: Agent native security contracts
        env:
          PYTHONPATH: agent
        run: python -m unittest discover -s agent/tests -p "test_windows_native_*.py" -v

      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path native/windows-stream-helper/Cargo.toml -- --check

      - name: Unit tests
        run: cargo test --locked --manifest-path native/windows-stream-helper/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --locked --manifest-path native/windows-stream-helper/Cargo.toml --all-targets -- -D warnings

      - name: Build release helper
        run: cargo build --locked --release --manifest-path native/windows-stream-helper/Cargo.toml

      - name: Format Windows platform adapter
        run: cargo fmt --manifest-path native/windows-platform/Cargo.toml -- --check

      - name: Test Windows platform adapter
        run: cargo test --locked --manifest-path native/windows-platform/Cargo.toml --all-targets

      - name: Clippy Windows platform adapter
        run: cargo clippy --locked --manifest-path native/windows-platform/Cargo.toml --all-targets -- -D warnings

      - name: Format Windows renter worker
        run: cargo fmt --manifest-path native/windows-worker/Cargo.toml -- --check

      - name: Test Windows renter worker
        run: cargo test --locked --manifest-path native/windows-worker/Cargo.toml --all-targets

      - name: Clippy Windows renter worker
        run: cargo clippy --locked --manifest-path native/windows-worker/Cargo.toml --all-targets -- -D warnings

      - name: Build release Windows renter worker
        run: cargo build --locked --release --manifest-path native/windows-worker/Cargo.toml

      - name: Bootstrap renter worker must fail closed off Windows
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          reply=$(native/windows-worker/target/release/gpubnb-windows-worker \
            --session-id ci-worker \
            --generation 1 \
            --gpu-uuid GPU-e8301c16-2a14-2b3f-f057-b21f3b00524a \
            --workspace cloud-desktop)
          worker_exit=$?
          set -e
          if [ "$worker_exit" -ne 20 ]; then
            echo "Expected windows_required exit 20, got $worker_exit" >&2
            exit 1
          fi
          python -c 'import json,sys; r=json.loads(sys.argv[1]); assert r == {"ok": False, "error": "windows_required"}' "$reply"

      - name: Bootstrap helper must fail closed on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Resolve-Path 'native/windows-stream-helper/target/release/gpubnb-windows-stream.exe'
          $reply = & $exe --self-test --json
          $helperExit = $LASTEXITCODE
          if ($helperExit -ne 21) {
            throw "Expected unavailable backend exit 21, got $helperExit."
          }
          $report = $reply | ConvertFrom-Json
          if ($report.ok -cne $false -or $report.error -cne 'native_backend_not_implemented') {
            throw 'Helper did not return the expected fail-closed proof.'
          }
          Write-Host "Expected fail-closed exit code: $helperExit"
          exit 0
