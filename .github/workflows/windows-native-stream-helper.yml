name: windows-native-stream-helper

on:
  pull_request:
    paths:
      - native/windows-stream-helper/**
      - agent/gpubnb_agent/windows_native_*.py
      - agent/tests/test_windows_native_*.py
      - docs/architecture/WINDOWS_NATIVE_*.md
      - .github/workflows/windows-native-stream-helper.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-stream-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path native/windows-stream-helper/Cargo.toml -- --check

      - name: Unit tests
        run: cargo test --locked --manifest-path native/windows-stream-helper/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --locked --manifest-path native/windows-stream-helper/Cargo.toml --all-targets -- -D warnings

      - name: Build release helper
        run: cargo build --locked --release --manifest-path native/windows-stream-helper/Cargo.toml

      - name: Bootstrap helper must fail closed on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Resolve-Path 'native/windows-stream-helper/target/release/gpubnb-windows-stream.exe'
          & $exe --self-test --json
          $helperExit = $LASTEXITCODE
          if ($helperExit -eq 0) {
            throw 'Unqualified Windows native helper unexpectedly reported success.'
          }
          Write-Host "Expected fail-closed exit code: $helperExit"
          exit 0
