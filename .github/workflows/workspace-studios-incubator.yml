name: workspace-studios-incubator
on:
  pull_request:
    paths:
      - 'apps/api/src/workspace-manifests.ts'
      - 'apps/api/src/workspace-runtime-profiles.ts'
      - 'apps/api/test/workspace-incubator.test.ts'
      - 'workspaces/**'
      - '.github/workflows/workspace-studios-incubator.yml'
  workflow_dispatch:
jobs:
  candidate-source-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate six candidates, Python syntax and shell syntax
        run: python3 workspaces/incubator/test_sources.py
      - name: Ensure candidate build launcher syntax is valid
        run: sh -n workspaces/incubator/build-candidates.sh
