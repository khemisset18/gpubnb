name: patch-host-bootstrap-temp

on:
  push:
    branches: [feature/agent-host-tunnel-bootstrap]
    paths:
      - '.github/workflows/patch-host-bootstrap-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/agent-host-tunnel-bootstrap
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact Agent integration patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('agent/gpubnb_agent/workspace_gateway.py')
          text = path.read_text()

          old = "from .client import ApiClient, agent_request\nfrom .mining_guard import"
          new = "from .client import ApiClient, agent_request\nfrom .host_tunnel import HostTunnelSupervisor\nfrom .mining_guard import"
          if text.count(old) != 1:
              raise SystemExit(f'import anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = "        self._http_slots = threading.BoundedSemaphore(HTTP_RELAY_MAX_CONCURRENCY)\n        self._docker_runner: DockerRunner = docker_runner or _real_docker"
          new = "        self._http_slots = threading.BoundedSemaphore(HTTP_RELAY_MAX_CONCURRENCY)\n        self.host_tunnels = HostTunnelSupervisor(api, key, machine_id, config)\n        self._docker_runner: DockerRunner = docker_runner or _real_docker"
          if text.count(old) != 1:
              raise SystemExit(f'init anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = "    def _stop_runtime(self, session_id: str) -> bool:\n        self._close_session_channels(session_id)"
          new = "    def _stop_runtime(self, session_id: str) -> bool:\n        self.host_tunnels.stop(session_id)\n        self._close_session_channels(session_id)"
          if text.count(old) != 1:
              raise SystemExit(f'stop anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = "        sessions = desired.get(\"sessions\") or []\n        keep_alive_ids = {"
          new = "        sessions = desired.get(\"sessions\") or []\n        data_plane = desired.get(\"dataPlane\") if isinstance(desired.get(\"dataPlane\"), dict) else {}\n        host_tunnel_enabled = data_plane.get(\"hostTunnelEnabled\") is True\n        keep_alive_ids = {"
          if text.count(old) != 1:
              raise SystemExit(f'desired anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = "        self._sweep_orphaned_containers(keep_alive_ids)\n        for session in sessions:"
          new = "        self._sweep_orphaned_containers(keep_alive_ids)\n        self.host_tunnels.stop_except(keep_alive_ids)\n        for session in sessions:"
          if text.count(old) != 1:
              raise SystemExit(f'sweep anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = "            if metadata.get(\"runtimeId\") != existing.container_name or metadata.get(\"localPort\") != existing.port:\n                self._request(f\"/agent/workspace-gateway/{session_id}/register\", \"POST\", {\"machineId\": self.machine_id, \"runtimeId\": existing.container_name, \"localPort\": existing.port})"
          new = "            try:\n                self.host_tunnels.reconcile(session_id, existing.port, host_tunnel_enabled)\n            except Exception as exc:\n                # Data Plane is an additive path until canary qualification completes.\n                # Keep the proven legacy gateway alive while surfacing tunnel failures.\n                self._report_error(exc)\n            if metadata.get(\"runtimeId\") != existing.container_name or metadata.get(\"localPort\") != existing.port:\n                self._request(f\"/agent/workspace-gateway/{session_id}/register\", \"POST\", {\"machineId\": self.machine_id, \"runtimeId\": existing.container_name, \"localPort\": existing.port})"
          if text.count(old) != 1:
              raise SystemExit(f'reconcile anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = "            else:\n                self._last_error_signature = None\n                time.sleep(0.05)\n\n\ndef run_workspace_gateway_forever("
          new = "            else:\n                self._last_error_signature = None\n                time.sleep(0.05)\n        self.host_tunnels.stop_all()\n\n\ndef run_workspace_gateway_forever("
          if text.count(old) != 1:
              raise SystemExit(f'run anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Validate Agent syntax and tests
        shell: bash
        run: |
          python -m compileall -q agent/gpubnb_agent
          python -m unittest discover -s agent/tests -p 'test_*.py'
      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/gpubnb_agent/workspace_gateway.py
          git commit -m 'feat(agent): auto-start Host tunnel with legacy fallback'
          git push origin HEAD:feature/agent-host-tunnel-bootstrap
