name: Asset Exchange LTC L0 Gitian two-builder attestation (no native execution)

on:
  pull_request:
    paths:
      - 'asset-exchange/qualification/litecoin/l0/**'
      - '.github/workflows/asset-exchange-litecoin-l0-gitian.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ltc-l0-gitian-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  signed-attestations:
    name: LTC Gitian pinned two-builder signature and output comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR HEAD without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Retrieve only public pinned Gitian assertion materials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/ltc-gitian-public-only"
          evidence="$RUNNER_TEMP/ltc-gitian-evidence"
          mkdir -p "$work/david" "$work/losh" "$work/gnupg" "$evidence"
          chmod 700 "$work/gnupg"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "HEAD_SHA=$expected" > "$evidence/metadata.txt"
          echo "GITIAN_REPO_SHA=257e8c5e128c40091b9fcd0f7d2327587d04742d" >> "$evidence/metadata.txt"
          echo 'LITECOIN_BINARY_EXECUTED=false' >> "$evidence/metadata.txt"
          echo 'SETTLEMENT_ENABLED=false' >> "$evidence/metadata.txt"

          dl() {
            curl --fail --show-error --silent --location --retry 2 \
              --connect-timeout 15 --max-time 120 --max-filesize "$3" \
              --proto '=https' --proto-redir '=https' \
              --output "$2" "$1"
          }
          base='https://raw.githubusercontent.com/litecoin-project/gitian.sigs.ltc/257e8c5e128c40091b9fcd0f7d2327587d04742d/0.21.5.8-linux'
          for signer in davidburkett38 losh11; do
            target='david'
            if [ "$signer" = losh11 ]; then target='losh'; fi
            dl "$base/$signer/litecoin-core-linux-0.21-build.assert" \
              "$work/$target/litecoin-core-linux-0.21-build.assert" 262144
            dl "$base/$signer/litecoin-core-linux-0.21-build.assert.sig" \
              "$work/$target/litecoin-core-linux-0.21-build.assert.sig" 16384
          done
          dl 'https://download.litecoin.org/litecoin-0.21.5.8/davidburkett38-key.pgp' \
            "$work/david-key.pgp" 131072
          dl 'https://raw.githubusercontent.com/litecoin-project/litecoin/ec1b6489a900d09cf5991e220dce089c77a232a2/contrib/gitian-keys/losh11-key.pgp' \
            "$work/losh-key.pgp" 131072

          # These six independently reviewed exact bytes must not drift.
          # A changed upstream object/key is a BLOCKED review event.
          assert_sha256() {
            local digest
            digest="$(sha256sum "$1" | awk '{print $1}')"
            if [ "$digest" != "$2" ]; then
              echo 'LTC_GITIAN_PINNED_INPUT_CHANGED=BLOCKED'
              exit 1
            fi
          }
          assert_sha256 "$work/david/litecoin-core-linux-0.21-build.assert" 'ea3845019223ba70a4159d2fdf71d2632722ef7c2f20dfe54a71676d90d9505c'
          assert_sha256 "$work/david/litecoin-core-linux-0.21-build.assert.sig" 'c40b5481c4dd781adfce30fd0f0b783e4ab492e5b08f18000df284b3f6447e46'
          assert_sha256 "$work/losh/litecoin-core-linux-0.21-build.assert" '55fcfb4eb8f979c61ed62755ea5f813926a48aacdc2f75984790066f30c496a8'
          assert_sha256 "$work/losh/litecoin-core-linux-0.21-build.assert.sig" '54e01cd63aeeed7ce0790a8b24c0f63005fd6508f6e0c586db5ed6326004378c'
          assert_sha256 "$work/david-key.pgp" '72151da0ab796aec3393ec8834d3ae2a12f6d37e07947357a5d59ad2caa1d7da'
          assert_sha256 "$work/losh-key.pgp" '58b4e3e1ba2d3b6c5df991c34f2249fe112fad085eaeb0f9f0ddabbc7faf0300'
          echo 'GITIAN_PINNED_PUBLIC_INPUTS=PASS' >> "$evidence/metadata.txt"

          d_fpr='D35621D53A1CC6A3456758D03620E9D387E55666'
          l_fpr='C0921846FED0BF4CF28BE1D73B2A6315CD51A673'
          public_fpr() {
            gpg --batch --no-options --homedir "$work/gnupg" \
              --with-colons --with-fingerprint --show-keys "$1" \
              | awk -F: '$1=="fpr" {print $10; exit}'
          }
          test "$(public_fpr "$work/david-key.pgp")" = "$d_fpr"
          test "$(public_fpr "$work/losh-key.pgp")" = "$l_fpr"
          gpg --batch --no-options --homedir "$work/gnupg" --import \
            "$work/david-key.pgp" "$work/losh-key.pgp" >/dev/null

          # Observe a possible self-signed renewal from a separate public
          # distribution service. A keyserver is NOT independent proof of
          # the human signer's identity; the pinned 40-hex fingerprint is
          # mandatory and the verifier still rejects stale/revoked keys.
          refresh_url="https://keys.openpgp.org/vks/v1/by-fingerprint/$l_fpr"
          refreshed="$work/losh-refresh-candidate.asc"
          if curl --fail --show-error --silent --location --retry 1 \
              --connect-timeout 10 --max-time 45 --max-filesize 131072 \
              --proto '=https' --proto-redir '=https' \
              --output "$refreshed" "$refresh_url"; then
            echo 'LOSH_KEYSERVER_CANDIDATE_AVAILABLE=true' >> "$evidence/metadata.txt"
            actual_refreshed="$(public_fpr "$refreshed")"
            if [ "$actual_refreshed" != "$l_fpr" ]; then
              echo 'LOSH_KEYSERVER_FINGERPRINT_REJECTED' >> "$evidence/metadata.txt"
              exit 1
            fi
            # Independent key distribution is not an identity endorsement.
            # Pin the exact observed renewal bytes. A legitimate future
            # update must be reviewed before changing this reviewed pin.
            assert_sha256 "$refreshed" '027f0165865fcbcc53e3d09ee80251cca7da7a29b198fb31ea5b2c357bbbc3bf'
            echo 'LOSH_KEYSERVER_REVIEWED_CANDIDATE_SHA256=027f0165865fcbcc53e3d09ee80251cca7da7a29b198fb31ea5b2c357bbbc3bf' \
              >> "$evidence/metadata.txt"
            (cd "$work" && sha256sum losh-refresh-candidate.asc) \
              >> "$evidence/metadata.txt"
            if gpg --batch --no-options --homedir "$work/gnupg" \
                --import "$refreshed" >/dev/null; then
              echo 'LOSH_KEYSERVER_CANDIDATE_IMPORTED=true' >> "$evidence/metadata.txt"
            else
              echo 'LOSH_KEYSERVER_CANDIDATE_IMPORTED=false' >> "$evidence/metadata.txt"
            fi
          else
            echo 'LOSH_KEYSERVER_CANDIDATE_AVAILABLE=false' >> "$evidence/metadata.txt"
            rm -f "$refreshed"
          fi

          gpg --batch --no-options --homedir "$work/gnupg" --export \
            "$d_fpr" "$l_fpr" > "$work/paired-builders.gpg"
          test -s "$work/paired-builders.gpg"
          echo "DAVID_FINGERPRINT=$d_fpr" >> "$evidence/metadata.txt"
          echo "LOSH_FINGERPRINT=$l_fpr" >> "$evidence/metadata.txt"
          (cd "$work" && sha256sum \
            david/*.assert david/*.assert.sig losh/*.assert losh/*.assert.sig \
            david-key.pgp losh-key.pgp) >> "$evidence/metadata.txt"
          echo 'MATERIAL=PUBLIC_ONLY_NO_LTC_EXECUTION' >> "$evidence/metadata.txt"

      - name: Fail closed on signatures, expiry and output divergence
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ltc-gitian-public-only"
          evidence="$RUNNER_TEMP/ltc-gitian-evidence"
          # Diagnostic only. Record public GnuPG status NAMES for each
          # builder without overriding the verifier's fail-closed policy.
          mkdir -m 700 "$work/diagnostic-home"
          for builder in david losh; do
            set +e
            gpg --batch --no-tty --no-options \
              --homedir "$work/diagnostic-home" --no-auto-key-retrieve \
              --no-default-keyring --keyring "$work/paired-builders.gpg" \
              --status-fd 1 --verify \
              "$work/$builder/litecoin-core-linux-0.21-build.assert.sig" \
              "$work/$builder/litecoin-core-linux-0.21-build.assert" \
              > "$work/$builder-status.raw" 2> /dev/null
            code=$?
            set -e
            codes="$(awk '$1=="[GNUPG:]" {print $2}' "$work/$builder-status.raw" \
              | sort -u | paste -sd, -)"
            echo "GITIAN_${builder}_GPG_RC=$code" >> "$evidence/metadata.txt"
            echo "GITIAN_${builder}_GPG_STATUS_CODES=$codes" >> "$evidence/metadata.txt"
            echo "GITIAN_${builder}_GPG_STATUS_CODES=$codes"
          done
          set +e
          python3 asset-exchange/qualification/litecoin/l0/verify_gitian.py \
            --david-assertion "$work/david/litecoin-core-linux-0.21-build.assert" \
            --david-sig "$work/david/litecoin-core-linux-0.21-build.assert.sig" \
            --losh-assertion "$work/losh/litecoin-core-linux-0.21-build.assert" \
            --losh-sig "$work/losh/litecoin-core-linux-0.21-build.assert.sig" \
            --trusted-keyring "$work/paired-builders.gpg" \
            --david-fingerprint D35621D53A1CC6A3456758D03620E9D387E55666 \
            --losh-fingerprint C0921846FED0BF4CF28BE1D73B2A6315CD51A673 \
            > "$evidence/gitian-verification.json" 2> "$evidence/gitian-verification-error.json"
          rc=$?
          set -e
          echo "GITIAN_VERIFICATION_EXIT=$rc" >> "$evidence/metadata.txt"
          if [ "$rc" -ne 0 ]; then
            echo 'LTC_GITIAN_ASSERTION_STATUS=BLOCKED'
            cat "$evidence/gitian-verification-error.json"
            exit 1
          fi
          echo 'LTC_GITIAN_ASSERTION_STATUS=PARTIAL_CRYPTOGRAPHIC_PROOF_NOT_BUILD_REPRODUCTION'
          echo 'LTC_L0_QUALIFIED=false'

      - name: Retain redacted public attestation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltc-l0-gitian-signed-assertion-observations
          path: ${{ runner.temp }}/ltc-gitian-evidence/
          if-no-files-found: warn
          retention-days: 14
