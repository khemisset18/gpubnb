name: codex-self-update-fixture-version

on:
  push:
    branches:
      - codex/agent-runtime-cleanliness-diagnostic
    paths:
      - .github/workflows/codex-self-update-fixture-version.yml
      - scripts/codex-self-update-fixture-version.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/agent-runtime-cleanliness-diagnostic
      - run: python3 scripts/codex-self-update-fixture-version.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/tests/test_self_update.py
          git diff --cached --quiet && exit 0
          git commit -m "test(agent): keep self-update candidate newer than 0.6.3"
          git push origin HEAD:codex/agent-runtime-cleanliness-diagnostic
