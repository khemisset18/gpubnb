name: PR107 stream lifecycle fix

on:
  push:
    branches:
      - hardening/data-plane-production-qualification

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/data-plane-production-qualification
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Apply lifecycle fix
        run: python3 services/edge/ci/apply-pr107-stream-lifecycle-fix.py
      - name: Canonical format
        run: cargo fmt --manifest-path services/edge/Cargo.toml
      - name: Validate Rust and E2E client
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path services/edge/Cargo.toml -- --check
          cargo test --manifest-path services/edge/Cargo.toml --all-targets
          cargo clippy --manifest-path services/edge/Cargo.toml --all-targets -- -D warnings
          cargo build --manifest-path services/edge/Cargo.toml --bin gpubnb-edge --bin gpubnb-host-tunnel --example e2e_client
      - name: Commit validated fix and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_fix-pr107-stream-lifecycle.yml services/edge/ci/apply-pr107-stream-lifecycle-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/edge/src/bin/gpubnb-edge.rs services/edge/examples/e2e_client.rs
          git commit -m 'fix(edge): release auth stream credit before workspace routing'
          git push origin HEAD:hardening/data-plane-production-qualification
