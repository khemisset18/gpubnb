name: host-windows-preflight

on:
  pull_request:
    paths:
      - agent/**
      - services/edge/**
      - apps/host-desktop/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/host-windows-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-windows-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate language-independent installer ACLs
        shell: pwsh
        run: |
          $hook = Get-Content 'apps/host-desktop/src-tauri/windows/installer-hooks.nsh' -Raw
          if ($hook -match '\$%USERNAME%' -or $hook -match '\$%USERDOMAIN%') {
            throw 'The installer must not grant ACLs through translated account names.'
          }
          if ($hook -notmatch [regex]::Escape('[System.Security.Principal.WindowsIdentity]::GetCurrent().User')) {
            throw 'The installer must resolve the current principal directly to its Windows SID.'
          }
          if ($hook -notmatch [regex]::Escape('[System.IO.Directory]::SetAccessControl')) {
            throw 'The installer must apply its ACL without account-name translation.'
          }
          foreach ($sid in @('S-1-5-18', 'S-1-5-32-544')) {
            if ($hook -notmatch [regex]::Escape($sid)) {
              throw "The installer ACL is missing required SID $sid."
            }
          }

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/host-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Materialize Windows bundle icon
        shell: pwsh
        run: |
          $source = 'apps/host-desktop/src-tauri/icons/icon.ico.base64'
          $target = 'apps/host-desktop/src-tauri/icons/icon.ico'
          if (-not (Test-Path $source)) { throw 'Missing staged bundle icon source.' }
          $encoded = (Get-Content $source -Raw).Trim()
          $decoded = [Convert]::FromBase64String($encoded)
          if ($decoded.Length -lt 256) { throw 'Decoded bundle icon is unexpectedly small.' }
          [IO.File]::WriteAllBytes($target, $decoded)
          if (-not (Test-Path $target)) { throw 'Windows bundle icon was not generated.' }

      - name: Install locked desktop dependencies
        working-directory: apps/host-desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install agent and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./agent pyinstaller==6.16.0

      - name: Test agent CLI
        shell: pwsh
        run: |
          python -m compileall -q agent/gpubnb_agent
          $pyproject = Get-Content 'agent/pyproject.toml' -Raw
          $versionMatch = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $versionMatch.Success) { throw 'Unable to determine expected Agent version.' }
          $expectedAgentVersion = $versionMatch.Groups[1].Value
          $cliVersion = (gpubnb-agent version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Agent version command failed.' }
          if ($cliVersion -ne $expectedAgentVersion) {
            throw "Agent CLI version mismatch: expected $expectedAgentVersion, got $cliVersion."
          }
          python -m gpubnb_agent status

      - name: Build standalone agent
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --name gpubnb-agent --hidden-import=_cffi_backend --hidden-import=encodings.idna --hidden-import=servicemanager --hidden-import=win32event --hidden-import=win32service --hidden-import=win32serviceutil --hidden-import=win32timezone --collect-all cffi --collect-all nacl agent/gpubnb_agent/__main__.py
          if (-not (Test-Path dist/gpubnb-agent.exe)) { throw 'Standalone agent was not generated.' }
          $target = (rustc -vV | Select-String '^host:' | ForEach-Object { ($_ -split ':', 2)[1].Trim() })
          if (-not $target) { throw 'Rust target triple could not be determined.' }
          New-Item -ItemType Directory -Force apps/host-desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/gpubnb-agent.exe "apps/host-desktop/src-tauri/binaries/gpubnb-agent-$target.exe"

      - name: Build Windows Host tunnel sidecar
        shell: pwsh
        run: |
          cargo build --manifest-path services/edge/Cargo.toml --release --bin gpubnb-host-tunnel
          $source = 'services/edge/target/release/gpubnb-host-tunnel.exe'
          if (-not (Test-Path $source -PathType Leaf)) { throw 'Host tunnel sidecar was not generated.' }
          $target = (rustc -vV | Select-String '^host:' | ForEach-Object { ($_ -split ':', 2)[1].Trim() })
          if (-not $target) { throw 'Rust target triple could not be determined.' }
          New-Item -ItemType Directory -Force apps/host-desktop/src-tauri/binaries | Out-Null
          Copy-Item $source "apps/host-desktop/src-tauri/binaries/gpubnb-host-tunnel-$target.exe"

      - name: Verify standalone agent
        shell: pwsh
        run: |
          $pyproject = Get-Content 'agent/pyproject.toml' -Raw
          $versionMatch = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $versionMatch.Success) { throw 'Unable to determine expected Agent version.' }
          $expectedAgentVersion = $versionMatch.Groups[1].Value
          $standaloneVersion = (& ./dist/gpubnb-agent.exe version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Standalone agent version command failed.' }
          if ($standaloneVersion -ne $expectedAgentVersion) {
            throw "Standalone Agent version mismatch: expected $expectedAgentVersion, got $standaloneVersion."
          }
          & ./dist/gpubnb-agent.exe status
          if ($LASTEXITCODE -ne 0) { throw 'Standalone agent status command failed.' }
          & ./dist/gpubnb-agent.exe runtime-check
          if ($LASTEXITCODE -ne 0) { throw 'Standalone agent network runtime check failed.' }

      - name: Type-check and build frontend
        working-directory: apps/host-desktop
        run: |
          npm run check
          npm run build

      - name: Test and lint native host
        run: |
          cargo fmt -p gpubnb-host-desktop -- --check
          cargo test --locked -p gpubnb-host-desktop --all-targets
          cargo clippy --locked -p gpubnb-host-desktop --all-targets -- -D warnings

      - name: Build Windows installer with embedded agent and Host tunnel
        working-directory: apps/host-desktop
        run: npm run tauri:build -- --bundles nsis --config src-tauri/tauri.sidecar.conf.json
        env:
          GPUBNB_RELEASE_CHANNEL: development
          RUST_BACKTRACE: '1'

      - name: Verify installer and bundled sidecars
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path target/release/bundle/nsis -Filter '*-setup.exe' -File -ErrorAction Stop
          if ($installer.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installer.Count)."
          }

          $installDirectory = Join-Path $env:RUNNER_TEMP 'gpubnb-host-smoke-test'
          if (Test-Path $installDirectory) {
            throw "Smoke-test install directory already exists: $installDirectory"
          }
          $installation = Start-Process -FilePath $installer.FullName `
            -ArgumentList '/S', "/D=$installDirectory" -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            $installerLog = Join-Path $env:TEMP 'gpubnb-installer.log'
            if (Test-Path $installerLog) {
              Write-Host (Get-Content $installerLog -Raw)
            }
            throw "NSIS silent installation failed with exit code $($installation.ExitCode)."
          }

          $installedSidecar = Join-Path $installDirectory 'gpubnb-agent.exe'
          $installedTunnel = Join-Path $installDirectory 'gpubnb-host-tunnel.exe'
          if (-not (Test-Path $installedSidecar -PathType Leaf)) {
            throw 'The installed application does not contain the gpubnb-agent sidecar.'
          }
          if (-not (Test-Path $installedTunnel -PathType Leaf)) {
            throw 'The installed application does not contain the gpubnb-host-tunnel sidecar.'
          }
          if ((Get-Item $installedTunnel).Length -lt 262144) {
            throw 'The installed Host tunnel sidecar is unexpectedly small.'
          }
          $pyproject = Get-Content 'agent/pyproject.toml' -Raw
          $versionMatch = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $versionMatch.Success) { throw 'Unable to determine expected Agent version.' }
          $expectedAgentVersion = $versionMatch.Groups[1].Value
          $installedAgentVersion = (& $installedSidecar version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'The installed agent sidecar is not executable.' }
          if ($installedAgentVersion -ne $expectedAgentVersion) {
            throw "Installed Agent version mismatch: expected $expectedAgentVersion, got $installedAgentVersion."
          }
          $service = Get-CimInstance Win32_Service -Filter "Name='GPUbnbAgent'"
          if (-not $service) { throw 'The installer did not register the GPUbnbAgent service.' }
          if ($service.StartMode -ne 'Auto') {
            throw "The GPUbnbAgent service is not automatic: $($service.StartMode)"
          }
          if ($service.PathName -notlike "*$installedSidecar*") {
            throw "The service does not execute the installed sidecar: $($service.PathName)"
          }
          $dataDirectory = Join-Path $env:PROGRAMDATA 'GPUbnb'
          if (-not (Test-Path $dataDirectory -PathType Container)) {
            throw 'The installer did not create the shared service data directory.'
          }
          $broadPrincipals = @(
            'S-1-1-0',
            'S-1-5-11',
            'S-1-5-32-545'
          )
          $unsafeRules = (Get-Acl $dataDirectory).Access | Where-Object {
            $_.AccessControlType -eq 'Allow' -and
            $broadPrincipals -contains $_.IdentityReference.Translate(
              [System.Security.Principal.SecurityIdentifier]
            ).Value
          }
          if ($unsafeRules) {
            throw 'The service data directory grants access to a broad Windows principal.'
          }
          $failure = & sc.exe qfailure GPUbnbAgent
          $failureText = $failure -join "`n"
          if (
            $LASTEXITCODE -ne 0 -or
            $failureText -notmatch '86400' -or
            $failureText -notmatch '5000' -or
            $failureText -notmatch '30000' -or
            $failureText -notmatch '120000'
          ) {
            throw 'Windows Service recovery is not configured.'
          }
          & $installedSidecar service restart
          if ($LASTEXITCODE -ne 0) { throw 'The installed service could not be restarted.' }
          $service = Get-CimInstance Win32_Service -Filter "Name='GPUbnbAgent'"
          if ($service.State -ne 'Running') {
            throw "The restarted service is not running: $($service.State)"
          }

          $uninstaller = Join-Path $installDirectory 'uninstall.exe'
          if (-not (Test-Path $uninstaller -PathType Leaf)) {
            throw 'The NSIS package did not install an uninstaller.'
          }
          $uninstallation = Start-Process -FilePath $uninstaller `
            -ArgumentList '/S' -Wait -PassThru
          if ($uninstallation.ExitCode -ne 0) {
            throw "NSIS silent uninstallation failed with exit code $($uninstallation.ExitCode)."
          }
          if (Test-Path $installedSidecar) {
            throw 'The uninstaller left the agent sidecar behind.'
          }
          if (Test-Path $installedTunnel) {
            throw 'The uninstaller left the Host tunnel sidecar behind.'
          }
          if (Get-CimInstance Win32_Service -Filter "Name='GPUbnbAgent'") {
            throw 'The uninstaller left the GPUbnbAgent service registered.'
          }

          $artifactDirectory = 'apps/host-desktop/dist-windows'
          New-Item -ItemType Directory -Force $artifactDirectory | Out-Null
          Copy-Item $installer.FullName $artifactDirectory
          Copy-Item dist/gpubnb-agent.exe (Join-Path $artifactDirectory 'gpubnb-agent.exe')
          Copy-Item services/edge/target/release/gpubnb-host-tunnel.exe (Join-Path $artifactDirectory 'gpubnb-host-tunnel.exe')

          $payloads = Get-ChildItem $artifactDirectory -File
          $checksums = $payloads | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" }
          $checksums | Set-Content (Join-Path $artifactDirectory 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload Windows preflight artifact
        uses: actions/upload-artifact@v6
        with:
          name: gpubnb-host-windows-preflight-${{ github.sha }}
          path: apps/host-desktop/dist-windows/**
          if-no-files-found: error
          retention-days: 14
