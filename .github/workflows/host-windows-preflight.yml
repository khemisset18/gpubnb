name: host-windows-preflight

on:
  push:
    branches:
      - 'feat/windows-host-unified-installer-*'
    paths:
      - agent/**
      - services/edge/**
      - scripts/build-windows-native-release-candidate.ps1
      - scripts/build-stage4-unsigned-package.ps1
      - scripts/verify_stage4_package.py
      - scripts/verify-stage4-package.ps1
      - scripts/stage4-package-common.ps1
      - scripts/stage4-windows-python.lock
      - scripts/tests/test_host_installer_bundle.py
      - scripts/windows-native-stage4-failure-qualification.ps1
      - apps/host-desktop/**
      - native/windows-media/**
      - native/windows-worker/**
      - native/windows-stream-helper/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/host-windows-preflight.yml
  pull_request:
    paths:
      - agent/**
      - services/edge/**
      - scripts/build-windows-native-release-candidate.ps1
      - scripts/build-stage4-unsigned-package.ps1
      - scripts/verify_stage4_package.py
      - scripts/verify-stage4-package.ps1
      - scripts/stage4-package-common.ps1
      - scripts/stage4-windows-python.lock
      - scripts/tests/test_host_installer_bundle.py
      - scripts/windows-native-stage4-failure-qualification.ps1
      - apps/host-desktop/**
      - native/windows-media/**
      - native/windows-worker/**
      - native/windows-stream-helper/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/host-windows-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-windows-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Parse Stage 4 native release-candidate builder
        shell: pwsh
        run: |
          $source = Get-Content 'scripts/build-windows-native-release-candidate.ps1' -Raw
          [void][scriptblock]::Create($source)
          if ($source -notmatch "'--features', 'release-candidate'") {
            throw 'Stage 4 native candidate builder must use the release-candidate gate.'
          }
          if ($source -match 'physical-qualification') {
            throw 'Stage 4 native candidate builder must never use the physical-qualification gate.'
          }

      - name: Parse the CI-only Host payload helper
        shell: pwsh
        run: |
          $path = 'apps/host-desktop/src-tauri/installer/install-stage4-payload.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'CI-only Host payload helper contains PowerShell parse errors.'
          }
          $source = Get-Content $path -Raw
          foreach ($required in @(
            "'CheckNoActiveNative'",
            "'PreflightInstall'",
            "'PreflightRemove'",
            'host_native_preflight_release_or_installable_payload_rejected',
            'host_native_preflight_signed_component_rejected',
            'host_native_preflight_update_requires_reviewed_rollback'
          )) {
            if ($source -notmatch [regex]::Escape($required)) {
              throw "Host payload helper is missing fail-closed contract: $required"
            }
          }
          if ($source -match 'Start-Process.*gpubnb-windows-stream|Start-Process.*gpubnb-windows-worker|InstallDriver|pnputil') {
            throw 'CI preflight helper must not start media components or install a driver.'
          }

      - name: Parse Stage 4 physical failure harness
        shell: pwsh
        run: |
          $path = 'scripts/windows-native-stage4-failure-qualification.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Stage 4 physical failure harness contains PowerShell parse errors.'
          }
          $source = Get-Content $path -Raw
          foreach ($required in @(
            "'HelperCrash'",
            "'AgentRestart'",
            "'NetworkInterruption'",
            "'RebootPrepare'",
            "'RebootVerify'",
            'stage4_faults_not_armed',
            'overallAcceptancePendingServerEvidence'
          )) {
            if ($source -notmatch [regex]::Escape($required)) {
              throw "Stage 4 physical failure harness is missing required contract: $required"
            }
          }
          if ($source -match 'Disable-NetAdapter|Restart-Computer|shutdown\.exe') {
            throw 'Stage 4 physical failure harness contains a forbidden broad host mutation.'
          }

      - name: Validate language-independent installer ACLs
        shell: pwsh
        run: |
          $hook = Get-Content 'apps/host-desktop/src-tauri/windows/installer-hooks.nsh' -Raw
          if ($hook -match '\$%USERNAME%' -or $hook -match '\$%USERDOMAIN%') {
            throw 'The installer must not grant ACLs through translated account names.'
          }
          if ($hook -notmatch [regex]::Escape('[System.Security.Principal.WindowsIdentity]::GetCurrent().User')) {
            throw 'The installer must resolve the current principal directly to its Windows SID.'
          }
          if ($hook -notmatch [regex]::Escape('[System.IO.Directory]::SetAccessControl')) {
            throw 'The installer must apply its ACL without account-name translation.'
          }
          foreach ($sid in @('S-1-5-18', 'S-1-5-32-544')) {
            if ($hook -notmatch [regex]::Escape($sid)) {
              throw "The installer ACL is missing required SID $sid."
            }
          }

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.7'
          architecture: x64

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: FFmpeg/nv-codec-headers
          ref: e844e5b26f46bb77479f063029595293aa8f812d
          path: .deps/nv-codec-headers
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/host-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - name: Materialize Windows bundle icon
        shell: pwsh
        run: |
          $source = 'apps/host-desktop/src-tauri/icons/icon.ico.base64'
          $target = 'apps/host-desktop/src-tauri/icons/icon.ico'
          if (-not (Test-Path $source)) { throw 'Missing staged bundle icon source.' }
          $encoded = (Get-Content $source -Raw).Trim()
          $decoded = [Convert]::FromBase64String($encoded)
          if ($decoded.Length -lt 256) { throw 'Decoded bundle icon is unexpectedly small.' }
          [IO.File]::WriteAllBytes($target, $decoded)
          if (-not (Test-Path $target)) { throw 'Windows bundle icon was not generated.' }

      - name: Install locked desktop dependencies
        working-directory: apps/host-desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install hash-locked Stage 4 build dependencies and Agent
        run: |
          python -m pip install --require-hashes -r scripts/stage4-windows-python.lock
          python -m pip install --no-deps --no-build-isolation ./agent

      - name: Verify unified installer policy contract
        run: python -m unittest scripts/tests/test_host_installer_bundle.py -v

      - name: Build and stage the complete unsigned native payload
        shell: pwsh
        run: |
          $commit = '${{ github.event.pull_request.head.sha || github.sha }}'
          $publisher = '3060de709bd0db7fa8588b7480a8a04f94b2a7df005ee48361cbdcd39b0e9619'
          $out = Join-Path $env:RUNNER_TEMP 'stage4-host-payload'
          & ./scripts/build-stage4-unsigned-package.ps1 `
            -ExpectedCommit $commit `
            -PublisherSha256 $publisher `
            -NvCodecHeadersDir "$env:GITHUB_WORKSPACE/.deps/nv-codec-headers/include/ffnvcodec" `
            -OutputDirectory $out
          if (-not $?) { throw 'Unified Host native payload build failed.' }
          $manifest = Get-Content (Join-Path $out 'stage4.manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -cne $commit -or
              $manifest.signatureStatus -cne 'unsigned' -or
              $manifest.installable -cne $false -or
              $manifest.iddDriverIncluded -cne $false -or
              $manifest.publicBookabilityEnabled -cne $false -or
              @($manifest.files).Count -ne 4) {
            throw 'The Host preflight must carry the exact four-file unsigned, non-installable policy.'
          }
          $payload = 'apps/host-desktop/src-tauri/stage4'
          New-Item -ItemType Directory -Force $payload | Out-Null
          foreach ($name in @(
            'gpubnb-windows-stream.exe',
            'gpubnb-windows-worker.exe',
            'GPUbnbWindowsMedia.dll',
            'build-identities.json',
            'stage4.manifest.json'
          )) {
            Copy-Item -LiteralPath (Join-Path $out $name) -Destination (Join-Path $payload $name)
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath (Join-Path $out 'gpubnb-agent.exe') -Destination 'dist/gpubnb-agent.exe'
          $hash = (Get-FileHash (Join-Path $payload 'stage4.manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Unsigned Stage 4 manifest SHA-256: $hash"

      - name: Test agent CLI
        shell: pwsh
        run: |
          python -m compileall -q agent/gpubnb_agent
          $pyproject = Get-Content 'agent/pyproject.toml' -Raw
          $versionMatch = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $versionMatch.Success) { throw 'Unable to determine expected Agent version.' }
          $expectedAgentVersion = $versionMatch.Groups[1].Value
          $cliVersion = (gpubnb-agent version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Agent version command failed.' }
          if ($cliVersion -ne $expectedAgentVersion) {
            throw "Agent CLI version mismatch: expected $expectedAgentVersion, got $cliVersion."
          }
          python -m gpubnb_agent status

      - name: Stage verified Agent sidecar
        shell: pwsh
        run: |
          $source = 'dist/gpubnb-agent.exe'
          if (-not (Test-Path $source -PathType Leaf)) { throw 'The verified Stage 4 Agent was not staged.' }
          $target = (rustc -vV | Select-String '^host:' | ForEach-Object { ($_ -split ':', 2)[1].Trim() })
          if (-not $target) { throw 'Rust target triple could not be determined.' }
          New-Item -ItemType Directory -Force apps/host-desktop/src-tauri/binaries | Out-Null
          Copy-Item $source "apps/host-desktop/src-tauri/binaries/gpubnb-agent-$target.exe"

      - name: Build Windows Host tunnel sidecar
        shell: pwsh
        run: |
          cargo build --manifest-path services/edge/Cargo.toml --release --bin gpubnb-host-tunnel
          $source = 'services/edge/target/release/gpubnb-host-tunnel.exe'
          if (-not (Test-Path $source -PathType Leaf)) { throw 'Host tunnel sidecar was not generated.' }
          $target = (rustc -vV | Select-String '^host:' | ForEach-Object { ($_ -split ':', 2)[1].Trim() })
          if (-not $target) { throw 'Rust target triple could not be determined.' }
          New-Item -ItemType Directory -Force apps/host-desktop/src-tauri/binaries | Out-Null
          Copy-Item $source "apps/host-desktop/src-tauri/binaries/gpubnb-host-tunnel-$target.exe"

      - name: Verify standalone agent
        shell: pwsh
        run: |
          $pyproject = Get-Content 'agent/pyproject.toml' -Raw
          $versionMatch = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $versionMatch.Success) { throw 'Unable to determine expected Agent version.' }
          $expectedAgentVersion = $versionMatch.Groups[1].Value
          $standaloneVersion = (& ./dist/gpubnb-agent.exe version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Standalone agent version command failed.' }
          if ($standaloneVersion -ne $expectedAgentVersion) {
            throw "Standalone Agent version mismatch: expected $expectedAgentVersion, got $standaloneVersion."
          }
          $expectedCommit = '${{ github.event.pull_request.head.sha || github.sha }}'
          $buildInfo = (& ./dist/gpubnb-agent.exe build-info | Out-String) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Standalone agent build-info command failed.' }
          if (-not $buildInfo.frozen) { throw 'Standalone agent does not report itself as frozen.' }
          if ($buildInfo.buildCommit -ne $expectedCommit) {
            throw "Standalone Agent build commit mismatch: expected $expectedCommit, got $($buildInfo.buildCommit)."
          }
          & ./dist/gpubnb-agent.exe status
          if ($LASTEXITCODE -ne 0) { throw 'Standalone agent status command failed.' }
          & ./dist/gpubnb-agent.exe runtime-check
          if ($LASTEXITCODE -ne 0) { throw 'Standalone agent network runtime check failed.' }

      - name: Type-check and build frontend
        working-directory: apps/host-desktop
        run: |
          npm run check
          npm run build

      - name: Test and lint native host
        run: |
          cargo fmt -p gpubnb-host-desktop -- --check
          cargo test --locked -p gpubnb-host-desktop --all-targets
          cargo clippy --locked -p gpubnb-host-desktop --all-targets -- -D warnings

      - name: Build Windows installer with embedded agent and Host tunnel
        working-directory: apps/host-desktop
        run: npm run tauri:build -- --bundles nsis --config src-tauri/tauri.sidecar.conf.json --config src-tauri/tauri.preflight.conf.json
        env:
          GPUBNB_RELEASE_CHANNEL: development
          RUST_BACKTRACE: '1'

      - name: Verify installer and bundled sidecars
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path target/release/bundle/nsis -Filter '*-setup.exe' -File -ErrorAction Stop
          if ($installer.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installer.Count)."
          }

          $installDirectory = Join-Path $env:RUNNER_TEMP 'gpubnb-host-smoke-test'
          if (Test-Path $installDirectory) {
            throw "Smoke-test install directory already exists: $installDirectory"
          }
          $installation = Start-Process -FilePath $installer.FullName `
            -ArgumentList '/S', "/D=$installDirectory" -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            $installerLog = Join-Path $env:TEMP 'gpubnb-installer.log'
            if (Test-Path $installerLog) {
              Write-Host (Get-Content $installerLog -Raw)
            }
            throw "NSIS silent installation failed with exit code $($installation.ExitCode)."
          }

          $installedSidecar = Join-Path $installDirectory 'gpubnb-agent.exe'
          $installedTunnel = Join-Path $installDirectory 'gpubnb-host-tunnel.exe'
          $nativeInstallDirectory = Join-Path $env:ProgramFiles 'GPUbnb'
          if (-not (Test-Path $installedSidecar -PathType Leaf)) {
            throw 'The installed application does not contain the gpubnb-agent sidecar.'
          }
          if (-not (Test-Path $installedTunnel -PathType Leaf)) {
            throw 'The installed application does not contain the gpubnb-host-tunnel sidecar.'
          }
          if ((Get-Item $installedTunnel).Length -lt 262144) {
            throw 'The installed Host tunnel sidecar is unexpectedly small.'
          }
          $pyproject = Get-Content 'agent/pyproject.toml' -Raw
          $versionMatch = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $versionMatch.Success) { throw 'Unable to determine expected Agent version.' }
          $expectedAgentVersion = $versionMatch.Groups[1].Value
          $installedAgentVersion = (& $installedSidecar version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'The installed agent sidecar is not executable.' }
          if ($installedAgentVersion -ne $expectedAgentVersion) {
            throw "Installed Agent version mismatch: expected $expectedAgentVersion, got $installedAgentVersion."
          }

          $payloadRoot = Join-Path $installDirectory 'resources/stage4'
          $payloadManifest = Get-Content (Join-Path $payloadRoot 'stage4.manifest.json') -Raw | ConvertFrom-Json
          if ($payloadManifest.installable -ne $false -or
              $payloadManifest.signatureStatus -cne 'unsigned' -or
              $payloadManifest.iddDriverIncluded -ne $false -or
              $payloadManifest.publicBookabilityEnabled -ne $false) {
            throw 'The disposable installer smoke must remain explicitly non-installable.'
          }
          foreach ($name in @('gpubnb-windows-stream.exe','gpubnb-windows-worker.exe','GPUbnbWindowsMedia.dll')) {
            $record = @($payloadManifest.files | Where-Object { $_.name -ceq $name })
            $installedNative = Join-Path $nativeInstallDirectory $name
            if ($record.Count -ne 1 -or -not (Test-Path $installedNative -PathType Leaf)) {
              throw "Unified installer did not install native component $name."
            }
            if ((Get-FileHash $installedNative -Algorithm SHA256).Hash.ToLowerInvariant() -cne $record[0].sha256) {
              throw "Installed native component hash mismatch: $name"
            }
          }
          $expectedCommit = '${{ github.event.pull_request.head.sha || github.sha }}'
          $installedBuildInfo = (& $installedSidecar build-info | Out-String) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Installed agent build-info command failed.' }
          if (-not $installedBuildInfo.frozen) { throw 'Installed agent does not report itself as frozen.' }
          if ($installedBuildInfo.buildCommit -ne $expectedCommit) {
            throw "Installed Agent build commit mismatch: expected $expectedCommit, got $($installedBuildInfo.buildCommit)."
          }
          $service = Get-CimInstance Win32_Service -Filter "Name='GPUbnbAgent'"
          if (-not $service) { throw 'The installer did not register the GPUbnbAgent service.' }
          if ($service.StartMode -ne 'Auto') {
            throw "The GPUbnbAgent service is not automatic: $($service.StartMode)"
          }
          if ($service.PathName -notlike "*$installedSidecar*") {
            throw "The service does not execute the installed sidecar: $($service.PathName)"
          }
          $dataDirectory = Join-Path $env:PROGRAMDATA 'GPUbnb'
          if (-not (Test-Path $dataDirectory -PathType Container)) {
            throw 'The installer did not create the shared service data directory.'
          }
          $broadPrincipals = @(
            'S-1-1-0',
            'S-1-5-11',
            'S-1-5-32-545'
          )
          $unsafeRules = (Get-Acl $dataDirectory).Access | Where-Object {
            $_.AccessControlType -eq 'Allow' -and
            $broadPrincipals -contains $_.IdentityReference.Translate(
              [System.Security.Principal.SecurityIdentifier]
            ).Value
          }
          if ($unsafeRules) {
            throw 'The service data directory grants access to a broad Windows principal.'
          }
          $failure = & sc.exe qfailure GPUbnbAgent
          $failureText = $failure -join "`n"
          if (
            $LASTEXITCODE -ne 0 -or
            $failureText -notmatch '86400' -or
            $failureText -notmatch '5000' -or
            $failureText -notmatch '30000' -or
            $failureText -notmatch '120000'
          ) {
            throw 'Windows Service recovery is not configured.'
          }

          $requiredPrivileges = @(
            'SeTcbPrivilege',
            'SeAssignPrimaryTokenPrivilege',
            'SeIncreaseQuotaPrivilege'
          )
          $privileges = (& sc.exe qprivs GPUbnbAgent 8192) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to query GPUbnbAgent required privileges.'
          }
          foreach ($privilege in $requiredPrivileges) {
            if ($privileges -notmatch [regex]::Escape($privilege)) {
              throw "GPUbnbAgent is missing required privilege $privilege."
            }
          }
          foreach ($forbiddenPrivilege in @(
            'SeDebugPrivilege',
            'SeBackupPrivilege',
            'SeRestorePrivilege',
            'SeImpersonatePrivilege',
            'SeTakeOwnershipPrivilege'
          )) {
            if ($privileges -match [regex]::Escape($forbiddenPrivilege)) {
              throw "GPUbnbAgent retains unnecessary privilege $forbiddenPrivilege."
            }
          }

          $serviceSddl = (& sc.exe sdshow GPUbnbAgent | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($serviceSddl)) {
            throw 'Unable to read GPUbnbAgent service security descriptor.'
          }
          $descriptor = [System.Security.AccessControl.RawSecurityDescriptor]::new($serviceSddl)
          $broadServicePrincipals = @('S-1-1-0', 'S-1-5-11', 'S-1-5-32-545')
          $dangerousServiceRights = 0x00000002 -bor 0x00000010 -bor 0x00000020 -bor 0x00010000 -bor 0x00040000 -bor 0x00080000
          foreach ($ace in $descriptor.DiscretionaryAcl) {
            if (
              $ace -is [System.Security.AccessControl.CommonAce] -and
              $ace.AceQualifier -eq [System.Security.AccessControl.AceQualifier]::AccessAllowed -and
              $broadServicePrincipals -contains $ace.SecurityIdentifier.Value -and
              (($ace.AccessMask -band $dangerousServiceRights) -ne 0)
            ) {
              throw "Broad principal $($ace.SecurityIdentifier.Value) has dangerous GPUbnbAgent service rights."
            }
          }

          & $installedSidecar service restart
          if ($LASTEXITCODE -ne 0) { throw 'The installed service could not be restarted.' }
          $service = Get-CimInstance Win32_Service -Filter "Name='GPUbnbAgent'"
          if ($service.State -ne 'Running') {
            throw "The restarted service is not running: $($service.State)"
          }

          $uninstaller = Join-Path $installDirectory 'uninstall.exe'
          if (-not (Test-Path $uninstaller -PathType Leaf)) {
            throw 'The NSIS package did not install an uninstaller.'
          }
          $uninstallation = Start-Process -FilePath $uninstaller `
            -ArgumentList '/S' -Wait -PassThru
          if ($uninstallation.ExitCode -ne 0) {
            throw "NSIS silent uninstallation failed with exit code $($uninstallation.ExitCode)."
          }
          if (Test-Path $installedSidecar) {
            throw 'The uninstaller left the agent sidecar behind.'
          }
          if (Test-Path $installedTunnel) {
            throw 'The uninstaller left the Host tunnel sidecar behind.'
          }
          foreach ($name in @('gpubnb-windows-stream.exe','gpubnb-windows-worker.exe','GPUbnbWindowsMedia.dll')) {
            if (Test-Path (Join-Path $nativeInstallDirectory $name)) {
              throw "The uninstaller left native component $name behind."
            }
          }
          if (Get-CimInstance Win32_Service -Filter "Name='GPUbnbAgent'") {
            throw 'The uninstaller left the GPUbnbAgent service registered.'
          }

          $artifactDirectory = 'apps/host-desktop/dist-windows'
          New-Item -ItemType Directory -Force $artifactDirectory | Out-Null
          Copy-Item $installer.FullName $artifactDirectory
          Copy-Item dist/gpubnb-agent.exe (Join-Path $artifactDirectory 'gpubnb-agent.exe')
          Copy-Item services/edge/target/release/gpubnb-host-tunnel.exe (Join-Path $artifactDirectory 'gpubnb-host-tunnel.exe')
          @'
          CI PREFLIGHT ONLY — NOT INSTALLABLE FOR PC1.
          The bundled Stage 4 binaries are unsigned and the signed IddCx driver is not included.
          No PC1 installation, account connection, GPU session, or streaming test has been performed.
          '@ | Set-Content (Join-Path $artifactDirectory 'INSTALLATION_STATUS.txt') -Encoding utf8

          $payloads = Get-ChildItem $artifactDirectory -File
          $checksums = $payloads | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" }
          $checksums | Set-Content (Join-Path $artifactDirectory 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload Windows preflight artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gpubnb-host-windows-preflight-noninstallable-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/host-desktop/dist-windows/**
          if-no-files-found: error
          retention-days: 14
