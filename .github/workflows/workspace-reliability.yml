name: workspace-reliability

on:
  pull_request:
    paths:
      - 'agent/**'
      - 'apps/api/src/workspace-gateway.ts'
      - 'apps/api/test/workspace-gateway-contract.test.ts'
      - '.github/workflows/workspace-reliability.yml'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'apps/api/src/workspace-gateway.ts'
      - 'apps/api/test/workspace-gateway-contract.test.ts'
      - '.github/workflows/workspace-reliability.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      doge_suite:
        description: Private DOGE experiments to run on the authorized development branch
        type: choice
        required: true
        default: both
        options: [both, d3, multinode, fee-pinning, vm-recovery, auxpow-expanded, source-audit, rbf-boundaries]

permissions:
  contents: read

concurrency:
  group: workspace-reliability-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  workspace-agent-soak:
    name: Workspace Agent soak (25 clean passes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e agent
      - name: Compile workspace transport
        run: python -m py_compile agent/agent.py agent/gpubnb_agent/*.py
      - name: Repeat critical workspace suites
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 25); do
            echo "=== workspace reliability pass ${i}/25 ==="
            PYTHONHASHSEED=random python -m unittest discover \
              -s agent/tests \
              -p 'test_workspace_gateway*.py' \
              -v
          done
      - name: Workspace progress/health contract
        run: python -m unittest discover -s agent/tests -p 'test_workspace_health_progress.py' -v

  workspace-api-contract-soak:
    name: Workspace API contract soak (10 clean passes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gpubnb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gpubnb
      REDIS_URL: redis://localhost:6379
      SOLANA_CLUSTER: devnet
      ALLOW_MAINNET: 'false'
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Repeat workspace gateway contract
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "=== workspace API contract pass ${i}/10 ==="
            node --test test/workspace-gateway-contract.test.ts
          done
      - name: Strict TypeScript contract
        run: npx tsc -p tsconfig.json --noEmit


  # The registered workflow provides a manual entry on the development branch.
  # These jobs can never run from push, PR, schedule, main or another repository.
  doge-d3-private-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.doge_suite != 'source-audit' && inputs.doge_suite != 'rbf-boundaries' && inputs.doge_suite != 'multinode' && inputs.doge_suite != 'fee-pinning' && inputs.doge_suite != 'vm-recovery' && inputs.doge_suite != 'auxpow-expanded' && github.repository == 'khemisset18/gpubnb' && github.repository_id == '1305325878' && github.ref == 'refs/heads/asset-exchange/doge-independent-recovery-20261111'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/asset-exchange-dogecoin-policy.yml
    with:
      diagnostic_suite: d3

  doge-recovery-multinode-private-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.doge_suite != 'source-audit' && inputs.doge_suite != 'rbf-boundaries' && inputs.doge_suite != 'd3' && github.repository == 'khemisset18/gpubnb' && github.repository_id == '1305325878' && ((inputs.doge_suite == 'fee-pinning' && github.ref == 'refs/heads/asset-exchange/doge-fee-pinning-20261111') || (inputs.doge_suite == 'vm-recovery' && github.ref == 'refs/heads/asset-exchange/doge-vm-recovery-20261111') || (inputs.doge_suite == 'auxpow-expanded' && github.ref == 'refs/heads/asset-exchange/doge-auxpow-boundaries-20261111') || (inputs.doge_suite != 'fee-pinning' && inputs.doge_suite != 'vm-recovery' && inputs.doge_suite != 'auxpow-expanded' && github.ref == 'refs/heads/asset-exchange/doge-independent-recovery-20261111'))
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/asset-exchange-dogecoin-multinode.yml
    with:
      execution_commit: ${{ github.sha }}
      harness_commit: eadb9c1e3265cf3858a0bebdc0917964b8f89ede
      authorization: AUTHORIZE_D6_PRIVATE_MULTINODE_REGTEST
      lab_suite: ${{ inputs.doge_suite == 'auxpow-expanded' && 'auxpow-expanded' || inputs.doge_suite == 'vm-recovery' && 'recovery-handoff' || inputs.doge_suite == 'fee-pinning' && 'fee-pinning' || 'multinode' }}

  doge-source-audit-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.doge_suite == 'source-audit' && github.repository == 'khemisset18/gpubnb' && github.repository_id == '1305325878' && github.ref == 'refs/heads/asset-exchange/doge-audit-candidate-20261112'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/asset-exchange-source-artifact.yml

  doge-rbf-boundaries-private-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.doge_suite == 'rbf-boundaries' && github.repository == 'khemisset18/gpubnb' && github.repository_id == '1305325878' && github.ref == 'refs/heads/asset-exchange/doge-rbf-boundaries-20261112'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/asset-exchange-dogecoin-policy.yml
    with:
      diagnostic_suite: rbf
      harness_commit: 0000000000000000000000000000000000000000
