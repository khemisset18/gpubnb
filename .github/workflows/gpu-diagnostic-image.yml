name: gpu-diagnostic-image

on:
  pull_request:
    paths:
      - containers/gpu-diagnostic/**
      - .github/workflows/gpu-diagnostic-image.yml
      - agent/gpubnb_agent/runner.py
      - agent/tests/test_agent.py
  push:
    branches: [main]
    tags: [gpu-diagnostic-v*]
    paths:
      - containers/gpu-diagnostic/**
      - .github/workflows/gpu-diagnostic-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: gpu-diagnostic-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gpu-diagnostic
  COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=GPUbnb GPU Diagnostic
            org.opencontainers.image.description=Minimal NVIDIA NVML diagnostic image for GPUbnb hosts
            org.opencontainers.image.vendor=GPUbnb
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build local image for security tests
        uses: docker/build-push-action@v6
        with:
          context: containers/gpu-diagnostic
          load: true
          push: false
          tags: gpu-diagnostic:ci
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert hardened shell-free runtime
        run: |
          set -euo pipefail
          test "$(docker image inspect gpu-diagnostic:ci --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect gpu-diagnostic:ci --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/gpu-diagnostic"]'
          test "$(docker image inspect gpu-diagnostic:ci --format '{{json .Config.Cmd}}')" = "null"
          test "$(docker image inspect gpu-diagnostic:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          if docker run --rm --entrypoint=/bin/sh gpu-diagnostic:ci -c true >/dev/null 2>&1; then
            echo 'Runtime image unexpectedly contains a shell' >&2
            exit 1
          fi

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Generate vulnerability evidence
        run: |
          set -euo pipefail
          trivy image --ignore-unfixed --severity HIGH,CRITICAL --format json --output trivy-gpu-diagnostic.json gpu-diagnostic:ci
          trivy image --ignore-unfixed --severity HIGH,CRITICAL --format sarif --output trivy-gpu-diagnostic.sarif gpu-diagnostic:ci
          jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-gpu-diagnostic.json | tee trivy-vulnerability-count.txt

      - name: Upload Trivy SARIF
        if: hashFiles('trivy-gpu-diagnostic.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-gpu-diagnostic.sarif

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate local SBOM
        run: syft gpu-diagnostic:ci -o spdx-json=sbom.spdx.json

      - name: Enforce zero fixable HIGH or CRITICAL vulnerabilities
        run: |
          set -euo pipefail
          count="$(cat trivy-vulnerability-count.txt)"
          if [ "$count" -ne 0 ]; then
            jq -r '.Results[]? | .Target as $target | .Vulnerabilities[]? | [$target,.VulnerabilityID,.PkgName,.InstalledVersion,.FixedVersion,.Severity] | @tsv' trivy-gpu-diagnostic.json
            echo "Image rejected: $count fixable HIGH/CRITICAL vulnerabilities" >&2
            exit 1
          fi

      - name: Publish image by immutable digest
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: containers/gpu-diagnostic
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Verify published digest and regenerate SBOM
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          case "$DIGEST" in sha256:[a-f0-9][a-f0-9]*) ;; *) echo 'Invalid published digest' >&2; exit 1 ;; esac
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" >/dev/null
          syft "${IMAGE}@${DIGEST}" -o spdx-json=sbom.spdx.json

      - name: Sign image and attest SBOM
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: Verify signature and SBOM attestation
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/gpu-diagnostic-image.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            "${IMAGE}@${DIGEST}" > cosign-signature-verification.json
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            "${IMAGE}@${DIGEST}" > cosign-sbom-verification.json

      - name: Write verified agent configuration reference
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -s cosign-signature-verification.json
          test -s cosign-sbom-verification.json
          printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee gpu-diagnostic-image.txt
          printf 'diagnosticImage=%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gpu-diagnostic-image-evidence
          path: |
            sbom.spdx.json
            trivy-gpu-diagnostic.json
            trivy-gpu-diagnostic.sarif
            trivy-vulnerability-count.txt
            cosign-signature-verification.json
            cosign-sbom-verification.json
            gpu-diagnostic-image.txt
          if-no-files-found: warn
          retention-days: 30
