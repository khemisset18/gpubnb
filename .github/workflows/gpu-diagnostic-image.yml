name: gpu-diagnostic-image

on:
  pull_request:
    paths:
      - containers/gpu-diagnostic/**
      - .github/workflows/gpu-diagnostic-image.yml
      - agent/gpubnb_agent/runner.py
      - agent/tests/test_agent.py
  push:
    branches: [main]
    tags: [gpu-diagnostic-v*]
    paths:
      - containers/gpu-diagnostic/**
      - .github/workflows/gpu-diagnostic-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: gpu-diagnostic-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gpu-diagnostic

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build local image for security tests
        uses: docker/build-push-action@v6
        with:
          context: containers/gpu-diagnostic
          load: true
          push: false
          tags: gpu-diagnostic:ci
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert hardened shell-free runtime
        run: |
          set -euo pipefail
          test "$(docker image inspect gpu-diagnostic:ci --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect gpu-diagnostic:ci --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/gpu-diagnostic"]'
          test -z "$(docker image inspect gpu-diagnostic:ci --format '{{json .Config.Cmd}}' | grep -v '^null$' || true)"
          if docker run --rm --entrypoint=/bin/sh gpu-diagnostic:ci -c true >/dev/null 2>&1; then
            echo 'Runtime image unexpectedly contains a shell' >&2
            exit 1
          fi

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1
        with:
          version: 0.65.0
          cache: true

      - name: Generate vulnerability evidence
        run: |
          set -euo pipefail
          trivy image --ignore-unfixed --severity HIGH,CRITICAL --format json --output trivy-gpu-diagnostic.json gpu-diagnostic:ci
          trivy image --ignore-unfixed --severity HIGH,CRITICAL --format sarif --output trivy-gpu-diagnostic.sarif gpu-diagnostic:ci
          jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-gpu-diagnostic.json | tee trivy-vulnerability-count.txt

      - name: Upload Trivy SARIF
        if: hashFiles('trivy-gpu-diagnostic.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-gpu-diagnostic.sarif

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: syft gpu-diagnostic:ci -o spdx-json=sbom.spdx.json

      - name: Enforce zero fixable HIGH or CRITICAL vulnerabilities
        run: |
          set -euo pipefail
          count="$(cat trivy-vulnerability-count.txt)"
          if [ "$count" -ne 0 ]; then
            jq -r '.Results[]? | .Target as $target | .Vulnerabilities[]? | [$target,.VulnerabilityID,.PkgName,.InstalledVersion,.FixedVersion,.Severity] | @tsv' trivy-gpu-diagnostic.json
            echo "Image rejected: $count fixable HIGH/CRITICAL vulnerabilities" >&2
            exit 1
          fi

      - name: Publish image by immutable digest
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: containers/gpu-diagnostic
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign immutable image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          test "$DIGEST" != ""
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Write agent configuration reference
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          test "$DIGEST" != ""
          printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee gpu-diagnostic-image.txt
          printf 'diagnosticImage=%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gpu-diagnostic-image-evidence
          path: |
            sbom.spdx.json
            trivy-gpu-diagnostic.json
            trivy-gpu-diagnostic.sarif
            trivy-vulnerability-count.txt
            gpu-diagnostic-image.txt
          if-no-files-found: warn
          retention-days: 30