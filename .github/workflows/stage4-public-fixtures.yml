name: stage4-public-fixture-diagnostics
on:
  push:
    branches: [prep/stage4-osslsigncode-hardened-20261015]
    paths:
      - scripts/tests/windows-rfc3161-fixtures.ps1
      - .github/workflows/stage4-public-fixtures.yml
permissions:
  contents: read
jobs:
  public-fixtures:
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Inspect public expired certificate and malformed HTTP fixture
        shell: pwsh
        run: |
          & ./scripts/tests/windows-rfc3161-fixtures.ps1
          if (-not $?) { exit 1 }
